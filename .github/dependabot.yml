# Keeps GitHub Actions references in .github/workflows/ maintained.
# Every workflow pins every third-party action to a full commit SHA for supply-chain
# integrity; without this ecosystem entry those pins would silently rot.
#
# Dependabot updates a pin's SHA and its own trailing version comment together, but it
# raises one pull request per ACTION rather than per action repository. Where a single
# repository provides several actions - github/codeql-action supplies both init and
# analyze - one upstream release is split across separate pull requests, and such a
# request can rewrite a SIBLING action's version comment without touching its SHA.
# One such pull request did exactly that: it relabelled the analyze pin as v4.37.4
# while leaving it on the v4.37.3 commit. A pin whose comment misdescribes what it pins defeats the
# reason for pinning, since that comment is the only human-readable statement of what
# the SHA is. Actions sharing a repository are therefore grouped below, so one upstream
# release lands as one commit.
#
# nuget: keeps the centrally managed package versions in Directory.Packages.props
# (ManagePackageVersionsCentrally + CentralPackageTransitivePinningEnabled) current, and
# lets Dependabot open security-update PRs for NuGet advisories. Without this entry an
# advisory such as GHSA-473q-m89c-ghf8 (MySqlConnector 2.4.0, 2026-10-28) turns every
# branch red via NuGet audit (NU1902 under TreatWarningsAsErrors) with no fix PR raised.
#
# LOCK FILES: unlike vouchfx-mcp, this repo does NOT set RestorePackagesWithLockFile and
# commits no packages.lock.json, and CI restores without --locked-mode, so the mcp
# NU1004 / dependabot-core#12318 manual lock-file regeneration remedy does not apply here.
# If lock files are ever adopted, copy vouchfx-mcp's "LOCK FILES AND DEPENDABOT" paragraph
# and its remedy (`dotnet restore vouchfx.sln` without --locked-mode on the PR branch, then
# commit every regenerated packages.lock.json) into this comment.
#
# TRANSITIVE PINS: several entries in Directory.Packages.props are exact-minimum pins chosen
# to avoid NU1109/NU1605 under transitive pinning (Microsoft.Data.SqlClient, RabbitMQ.Client,
# System.Text.Json). A Dependabot bump of one of those (or of Aspire.Hosting.*) can fail
# restore with NU1109/NU1605; resolve it on the PR branch by moving the paired pins together,
# not by reverting the bump. A System.Text.Json major is the exception: it stays held in
# the nuget `ignore` list below, although the repository now targets net10.0, because 11.x
# has no supported asset for the net8.0 provider-contract libraries and the event-wire
# contract was checked only against 10.x.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"

  - package-ecosystem: "nuget"
    # One entry, several directories, so the groups and the ignore rules below apply to all
    # of them. Dependabot's NuGet discovery reads the project and solution files in a
    # directory it is given and the projects they reference; it does not recurse into
    # subdirectories. "/" therefore reaches vouchfx.sln and everything in it, and
    # Directory.Packages.props. examples/compose-orders/app/ComposeOrders.csproj is in no
    # solution and pins its own Npgsql version, so it needs its own line here. A project
    # outside the solution that uses only the central versions, and references only
    # packages a solution project also references, is covered through "/" and needs none.
    # Add a directory when a project outside the solution sets a version itself.
    # Dependabot alerts, and so security updates, already covered the example through the
    # dependency graph; this entry adds version updates for it.
    # Seen on the first run after this directory was added: one grouped pull request
    # covered both directories. It edited Directory.Packages.props and
    # examples/compose-orders/app/ComposeOrders.csproj together (see the groups note
    # below), raised the example's own Npgsql in ComposeOrders.csproj only, and left the
    # central Npgsql PackageVersion untouched.
    directories:
      - "/"
      - "/examples/compose-orders/app"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Collapse each week's MINOR and PATCH version updates into ONE pull request per group
    # (fewer PRs to triage, and any paired-pin / NU1109 fix-up is paid once per week). With
    # several directories, the first run showed that a group makes one pull request across
    # all the directories, not one per directory. `group-by: dependency-name` is not set:
    # GitHub's Dependabot options reference describes it as one pull request per dependency
    # across all the directories, which would defeat the weekly batching. Aspire.Hosting.*
    # ships in lockstep, so it is grouped on its own so a partial Aspire bump never lands.
    # Security updates are not affected by `groups` unless `applies-to: security-updates`
    # is set, so these groups never batch an advisory fix: any security update that is
    # raised comes as its own PR. Whether a hold in the ignore list also stops one is a
    # separate question; see the note on security updates in the ignore list below.
    #
    # Majors are deliberately kept OUT of the weekly group (update-types below). Dependabot
    # cannot split a grouped pull request, so when a major that cannot build sat in the
    # group, every safe minor and patch in the same pull request went red with it. A major
    # that is not in the group arrives as its own pull request, which can fail or be
    # deferred without blocking the rest. A package with a major available still gets its
    # minor and patch updates in the group; only the major arrives as its own pull request.
    # The aspire group is left without update-types on purpose: the Aspire.* ignore below
    # already limits it to patches, and if that hold is ever lifted a major must still move
    # every Aspire package together in one pull request, never one package at a time. The
    # awssdk group follows the same rule: AWSSDK.* packages share AWSSDK.Core and move
    # together, because a major for one package alone needs a Core major that the other
    # packages' dependency ranges refuse. AWSSDK.Core is pinned centrally and no project
    # references it directly: if a grouped update fails restore with NU1109 on AWSSDK.Core,
    # raise that pin in Directory.Packages.props on the same branch.
    # open-pull-requests-limit stays at 5, and the limit is shared by both directories. The
    # three groups take up to three slots, so at least two slots are left for individual
    # majors. The example has few packages, and no AWSSDK or Aspire package. Most majors are
    # held below, so few are expected at once. Security updates have their own separate
    # limit (10 open pull requests) and are not queued behind these.
    groups:
      aspire:
        patterns:
          - "Aspire.*"
      awssdk:
        patterns:
          - "AWSSDK.*"
      nuget-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "Aspire.*"
          - "AWSSDK.*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Roslyn is pinned to 4.14.x, the line this engine's script compiler and its tests are
      # validated on. Its major was first held because a 5.x bump produced CS9057 (an analyser
      # built against a newer compiler than the one running) under -warnaserror with the .NET 8
      # SDK, as measured in vouchfx-mcp. The repository now builds with the .NET 10 SDK, whose
      # own compiler is newer than 4.14; a 5.x bump has not been re-measured against it. Held
      # until a dedicated upgrade measures it. Scripting and the plain compiler move in lockstep.
      - dependency-name: "Microsoft.CodeAnalysis.*"
        update-types: ["version-update:semver-major"]
      # System.CommandLine is pinned to the 2.0.0 GA API surface (see Directory.Packages.props).
      - dependency-name: "System.CommandLine"
        update-types: ["version-update:semver-major"]
      # SECURITY UPDATES AND THESE HOLDS. Never add a versions: range to any entry here: that
      # suppresses security updates on every code path. Whether an update-types hold also
      # filters a NuGet security update is not settled. Observed: on 15 November 2026 a
      # security update moving Aspire.Hosting and Aspire.Hosting.AppHost from 13.4.6 to 13.6.5
      # was raised while the Aspire.* minor and major hold below was in place. But the NuGet
      # updater's own code can apply update-types to security jobs when the service passes
      # them. So do not rely on a held package's security fix arriving as a pull request. When
      # an advisory lands on a held package, check the Dependabot alert: an update that could
      # not be produced shows there as an error, not as a pull request. NuGet audit in the
      # build reports advisories independently. Security updates also have their own fixed
      # limit of 10 open pull requests; beyond that only the alerts remain.
      # Aspire is held at the 13.4.x patch line for the v1.x series. 13.5.x is
      # unpatched for GHSA-f7vh-h5g3-7jrh. Aspire 13.6.0 and 13.6.5 require YamlDotNet
      # 18.1.0 or later, which the YamlDotNet hold below rules out, and 13.6.5 is the only
      # patched release. Patch updates within 13.4.x still flow.
      # AspireVersionLockstepGuardTests fails an Aspire patch pull request until
      # VouchfxDcpVersion (Directory.Packages.props) and every Aspire.AppHost.Sdk
      # version are moved on the same branch. Dependabot may attempt a security update to
      # 13.6.5 despite this hold (see above), as a pull request that cannot pass or as an
      # update error on the alert; it cannot succeed while YamlDotNet is held, and the
      # repository's Dependabot alert stays open. The advisory is suppressed in NuGet audit
      # in Directory.Build.props; lift this hold when that entry is removed. The hold also
      # covers Aspire.Hosting.Elasticsearch (pinned 13.3.0, see Directory.Packages.props),
      # so its move to 13.4.x is a manual edit.
      - dependency-name: "Aspire.*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # YamlDotNet types are part of the frozen Vouchfx.Sdk v1 surface (IStepBinder<T>.Bind
      # takes a YamlNode). A new assembly major makes the CLI refuse external providers built
      # against YamlDotNet 16 (ProviderLoadException). Held for the whole v1.x engine series.
      - dependency-name: "YamlDotNet"
        update-types: ["version-update:semver-major"]
      # Npgsql majors above 8 are held: Npgsql 10 reads PostgreSQL date/time as
      # DateOnly/TimeOnly through non-generic reads, which would change db-assert.postgres
      # comparisons, and validates the TLS chain against the provided root CA only. Held
      # pending a dedicated upgrade with date/time and TLS-chain regression tests. The
      # Docker-backed pins (real-server rendering and the TLS matrix) run only in the daily
      # Docker lane, so a driver-upgrade branch must run that lane by manual dispatch before
      # it is merged.
      - dependency-name: "Npgsql"
        update-types: ["version-update:semver-major"]
      # System.Text.Json versions with the .NET release. Its major stays held although the
      # repository now targets net10.0: EventContractFreezeTests asserts that the central pin
      # in Directory.Packages.props is on major 10, the major the event-wire contract was
      # checked against. The five provider-contract libraries and the two example provider
      # templates stay on net8.0 (VouchfxProviderContractTargetFramework in
      # Directory.Build.props), where 11.x has no supported asset: it ships only net10.0,
      # net11.0, net462 and netstandard2.0, so a net8.0 library that gains it transitively
      # takes the netstandard2.0 asset, which is unsupported on net8.0. A net10.0 project that
      # references 11.x directly takes it and ships it beside the application, replacing the
      # framework serializer the event-wire contract was checked against. Both were measured
      # with SDK 10.0.115 (see the System.Text.Json pin comment in Directory.Packages.props).
      # Revisit when the provider-contract libraries leave net8.0 and the event-wire notes
      # have been re-checked against the new major. Dependabot's NuGet version updates act
      # only on packages a project references directly (a PackageReference, or a
      # GlobalPackageReference, which this repository does not use), and no project
      # references System.Text.Json directly at present, so this hold currently matches no
      # directly referenced package. It is kept so that a reintroduced direct reference cannot
      # take 11.x unnoticed. No other runtime-tied package is listed for the same reason: a
      # package that is only a central transitive pin (a PackageVersion with no
      # PackageReference, such as System.Security.Cryptography.Pkcs) is not version-updated,
      # so a hold on it would do nothing there. A runtime-tied package that a project starts
      # referencing directly needs its own major hold. For security updates, see the note
      # above the Aspire hold.
      - dependency-name: "System.Text.Json"
        update-types: ["version-update:semver-major"]
      # MySqlConnector 3.x targets net8.0 (and net10.0) and built clean when the projects that
      # reference it targeted net8.0; they now target net10.0. It has not been run against the
      # MySQL seed, reset and TLS paths. Held until a dedicated upgrade passes the Docker
      # integration jobs. MySqlConnectorPinGuardTests enforces the 2.6.1 security floor. A
      # security fix that exists only in 3.x may not arrive as a pull request while this hold
      # is in place (see the note above the Aspire hold); check the Dependabot alert.
      - dependency-name: "MySqlConnector"
        update-types: ["version-update:semver-major"]
