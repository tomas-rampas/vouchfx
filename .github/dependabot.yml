# Keeps GitHub Actions references in .github/workflows/ maintained.
# release.yml (the only secret-touching, OIDC-publishing workflow) pins
# every action to a full commit SHA for supply-chain integrity; without
# this ecosystem entry those pins would silently rot. Dependabot updates
# SHA pins and their trailing version comments together. The scan covers
# all workflows: the non-release workflows deliberately stay on floating
# major tags and receive ordinary major-tag bumps.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
