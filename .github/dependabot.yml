# Keeps GitHub Actions references in .github/workflows/ maintained.
# Every workflow pins every third-party action to a full commit SHA for supply-chain
# integrity; without this ecosystem entry those pins would silently rot.
#
# Dependabot updates a pin's SHA and its own trailing version comment together, but it
# raises one pull request per ACTION rather than per action repository. Where a single
# repository provides several actions - github/codeql-action supplies both init and
# analyze - one upstream release is split across separate pull requests, and such a
# request can rewrite a SIBLING action's version comment without touching its SHA.
# PR #323 did exactly that: it relabelled the analyze pin as v4.37.4 while leaving it
# on the v4.37.3 commit. A pin whose comment misdescribes what it pins defeats the
# reason for pinning, since that comment is the only human-readable statement of what
# the SHA is. Actions sharing a repository are therefore grouped below, so one upstream
# release lands as one commit.
#
# nuget: keeps the centrally managed package versions in Directory.Packages.props
# (ManagePackageVersionsCentrally + CentralPackageTransitivePinningEnabled) current, and
# lets Dependabot open security-update PRs for NuGet advisories. Without this entry an
# advisory such as GHSA-473q-m89c-ghf8 (MySqlConnector 2.4.0, 2026-10-28) turns every
# branch red via NuGet audit (NU1902 under TreatWarningsAsErrors) with no fix PR raised.
#
# LOCK FILES: unlike vouchfx-mcp, this repo does NOT set RestorePackagesWithLockFile and
# commits no packages.lock.json, and CI restores without --locked-mode, so the mcp
# NU1004 / dependabot-core#12318 manual lock-file regeneration remedy does not apply here.
# If lock files are ever adopted, copy vouchfx-mcp's "LOCK FILES AND DEPENDABOT" paragraph
# and its remedy (`dotnet restore vouchfx.sln` without --locked-mode on the PR branch, then
# commit every regenerated packages.lock.json) into this comment.
#
# TRANSITIVE PINS: several entries in Directory.Packages.props are exact-minimum pins chosen
# to avoid NU1109/NU1605 under transitive pinning (Microsoft.Data.SqlClient, RabbitMQ.Client,
# SharpCompress, System.Text.Json). A Dependabot bump of one of those (or of Aspire.Hosting.*)
# can fail restore with NU1109/NU1605; resolve it on the PR branch by moving the paired pins
# together, not by reverting the bump.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"

  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Collapse each week's version updates into ONE pull request (fewer PRs to triage, and
    # any paired-pin / NU1109 fix-up is paid once per week). Aspire.Hosting.* ships in
    # lockstep, so it is grouped on its own so a partial Aspire bump never lands.
    # Security updates are not affected by `groups` unless `applies-to: security-updates`
    # is set, so advisory fixes still arrive immediately as their own PRs.
    groups:
      aspire:
        patterns:
          - "Aspire.*"
      nuget-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "Aspire.*"
    ignore:
      # Roslyn follows the pinned .NET 8 SDK's compiler (mcp measured CS9057 on a 5.x bump
      # under -warnaserror). Scripting and the plain compiler move in lockstep.
      - dependency-name: "Microsoft.CodeAnalysis.*"
        update-types: ["version-update:semver-major"]
      # System.CommandLine is pinned to the 2.0.0 GA API surface (see Directory.Packages.props).
      - dependency-name: "System.CommandLine"
        update-types: ["version-update:semver-major"]
      # These holds use update-types only, which apply to version updates and not to
      # security updates. Never add a versions: range here: that WOULD suppress security PRs.
      # YamlDotNet types are part of the frozen Vouchfx.Sdk v1 surface (IStepBinder<T>.Bind
      # takes a YamlNode). A new assembly major makes the CLI refuse external providers built
      # against YamlDotNet 16 (ProviderLoadException). Held for the whole v1.x engine series.
      - dependency-name: "YamlDotNet"
        update-types: ["version-update:semver-major"]
      # AWSSDK 4 makes value-type members nullable, so the emitted DynamoDB CSX no longer
      # compiles (CS0266), and the S3 provider's dropped-connection bucket confirmation
      # re-issues the HeadBucket request repeatedly. Held pending a dedicated AWSSDK 4
      # migration (see PR #662). Any AWSSDK.* package added later must join this hold
      # (they share AWSSDK.Core).
      - dependency-name: "AWSSDK.DynamoDBv2"
        update-types: ["version-update:semver-major"]
      - dependency-name: "AWSSDK.S3"
        update-types: ["version-update:semver-major"]
      # Npgsql majors above 8 are held: Npgsql 10 reads PostgreSQL date/time as
      # DateOnly/TimeOnly through non-generic reads, which would change db-assert.postgres
      # comparisons, and validates the TLS chain against the provided root CA only. Held
      # pending a dedicated upgrade with date/time and TLS-chain regression tests
      # (see PR #662).
      - dependency-name: "Npgsql"
        update-types: ["version-update:semver-major"]
