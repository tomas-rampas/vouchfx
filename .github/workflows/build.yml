# .github/workflows/build.yml — vouchfx CI pipeline
#
# Jobs
# ----
#  build        Blocking gate: restore → build (0-warning) → format → unit tests.
#               Docker-dependent Aspire integration tests are EXCLUDED via the
#               `requires!=docker` trait filter; they run in the `integration`
#               job.
#
#  windows-unit Blocking Windows gate: restore → build (0-warning) → unit tests.
#               Uses the same `requires!=docker` filter; Docker stays on Linux.
#               Uploads per-project TRX results even when a step fails.
#
#  memory-leak  BLOCKING permanent gate: runs the 5,000-iteration
#               provider-closure memory-leak harness over the full Core-provider
#               client closure (Npgsql, Confluent.Kafka, MongoDB.Driver,
#               StackExchange.Redis, HttpClient).  Docker-independent — the
#               closure script touches client types in-memory only, never
#               connects.  Runs on every pull request and push, and also on the daily
#               06:17 UTC schedule to catch regressions introduced by dependency
#               upgrades between pushes.
#               Exit non-zero iff NetDelta > threshold-bytes (2 MB) or context
#               not reclaimed; a failure here blocks merge.
#
#  integration / integration-gate
#               Docker-dependent Aspire integration tests (requires=docker
#               trait).  `integration` calls the reusable workflow
#               docker-integration.yml, which holds the lane's steps;
#               `integration-gate` reports its result under the required check
#               name `Integration tests — Docker / Aspire`.  No longer runs on
#               pull requests or pushes: it runs daily on main via the schedule
#               and on demand via workflow_dispatch on any branch (Actions tab
#               -> CI -> Run workflow -> pick the branch).  A failure is
#               therefore found on the next daily run, not before merge; it
#               still fails the run it is in.
#               The lane (in docker-integration.yml) runs on ubuntu-22.04, which
#               keeps MongoDB 7 on a compatible hosted kernel.
#
#  docs-build   Blocking documentation build and publication gate on every PR.
#               Uses the Pages build inputs without publishing or dispatching.
#
#  tls-transport / tls-transport-gate
#               Blocking: the reusable TLS transport acceptance workflow on
#               Windows and Linux; the gate job requires both hosted platforms.
#
#  workflow-contract Blocking workflow lint and actual Docker pre-pull regressions.
#               Uses fixture commands only; it never pulls or starts containers.
#
#  vscode-extension Non-blocking (continue-on-error): builds, lints, tests and
#               packages the VS Code extension.
#
#  site-tools-tests Blocking Python regression tests for scripts/site-tools,
#               the shared static-site package the satellite repositories use.
#
#  analyser-forward Advisory, non-blocking rebuild with the next major SDK's
#               (.NET 11) recommended analysers.  Runs outside the checkout so
#               global.json's .NET 10 SDK pin cannot hide rules added in later
#               SDKs.
#
#  vuln-scan    ADVISORY, NON-BLOCKING dependency-vulnerability scan
#               (continue-on-error: true).  Surfaces known-vulnerable
#               transitive packages via `dotnet list package --vulnerable
#               --include-transitive` for the solution and for each project
#               outside it (the worked example and the isolated TLS acceptance
#               host), so maintainers retain continuous CVE
#               visibility over the published-package footprint (the engine
#               assemblies + Vouchfx.Sdk.Testing now ship a code-generating
#               compiler + JsonSchema.Net + YamlDotNet onto every consumer's
#               transitive graph).  It deliberately NEVER gates merge: a
#               newly-published upstream CVE must not break unrelated PRs.
#
#  coverage-badge
#               Cosmetic, non-blocking: converts the `build` job's Cobertura
#               coverage into badge files via ReportGenerator and force-pushes
#               them to the orphan `badges` branch, which feeds the README's
#               shields.io/endpoint coverage badge.  Main pushes + the daily
#               schedule only — PR runs never move the published badge.

name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "chore/**"
  pull_request:
    branches:
      - main
      - "feat/**"
  # Scheduled workflows run only on the default branch.  The daily run drives the
  # memory-leak regression cadence, the Docker integration job and the badge refresh.
  # Keep exactly one entry: a second entry would run the full workflow twice on the days it fires.
  schedule:
    - cron: "17 6 * * *"   # 06:17 UTC every day
  # Manual run on any branch: Actions tab -> CI -> Run workflow -> pick the branch.
  workflow_dispatch:

# Cancel in-progress runs of the same event on the same ref to avoid wasting
# runner minutes. The event name is part of the group so that a push to main
# cannot cancel the scheduled or dispatched run, which is the only run that
# carries the Docker integration job; runs of the same event still cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

# Least-privilege default token for every job: checkout needs contents: read
# and nothing else here touches the GITHUB_TOKEN. The coverage-badge job
# re-declares its own block (contents: write) to push the `badges` branch.
permissions:
  contents: read

env:
  DOTNET_NOLOGO:             "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  # Suppress the .NET first-run welcome message on every step.
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

# ── Blocking gate ─────────────────────────────────────────────────────────────
jobs:
  tls-transport:
    name: TLS transport
    uses: ./.github/workflows/tls-transport-acceptance.yml
    with:
      reviewed_sha: ${{ github.event.pull_request.head.sha || github.sha }}

  tls-transport-gate:
    name: TLS transport acceptance (Windows and Linux)
    runs-on: ubuntu-latest
    needs: tls-transport
    if: always()
    steps:
      - name: Require both hosted platforms
        env:
          TRANSPORT_RESULT: ${{ needs.tls-transport.result }}
        run: test "$TRANSPORT_RESULT" = success

  workflow-contract:
    name: Workflow lint & Docker pre-pull contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install pinned workflow tools (verified SHA-256)
        run: bash scripts/ci/install-workflow-tools.sh

      - name: Lint every workflow
        run: python -B scripts/ci/lint_workflows.py

      - name: Require one release trigger and non-publishing dispatch
        run: python -B -m unittest discover -s scripts/ci -p test_release_workflow.py -v

      - name: Verify lossless tool package compression
        run: python -B -m unittest discover -s scripts/tests -p test_package_compression.py -v

      - name: Exercise the actual Docker pre-pull script
        run: python -B -m unittest discover -s scripts/ci -p test_docker_ci_contract.py -v

      - name: Exercise the GitLab Docker client bootstrap
        run: python -B -m unittest discover -s scripts/ci -p test_gitlab_bootstrap.py -v

      - name: Check image pin source contracts and inert registry regressions
        run: python -B -m unittest discover -s scripts/ci -p test_image_pins.py -v

      - name: Exercise DCP capture artefact contracts
        run: python -B -m unittest discover -s scripts/ci -p test_dcp_capture_artifacts.py -v

      - name: Pin failure-diagnostics capture allowlist
        run: python -B -m unittest discover -s scripts/ci -p test_failure_diagnostics_capture.py -v

  build:
    name: Build & unit tests
    runs-on: ubuntu-latest
    # The job is green in about 15 minutes. The ZEB-49 failures were the hosted runner
    # losing communication mid-test (runs 43707738732, 44070514767), which leaves no log.
    # This bound ends a stuck job sooner; it does not preserve the log once the runner is
    # starved: the compatibility job hit its 30-minute bound in the same step on
    # 15 November 2026 (runs 43735628400, 43758635481) and has no log either.
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Install the .NET 10 SDK.  The version spec "10.0.x" satisfies global.json
      # (sdk.version = "10.0.100", rollForward = latestFeature) — the setup
      # action will resolve the latest 10.0 feature band available on the runner.
      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"

      # Restore NuGet packages using the lock file if present; otherwise resolve
      # centrally-managed versions from Directory.Packages.props.
      - name: Restore dependencies
        run: dotnet restore vouchfx.sln

      # Build in Release configuration.  Directory.Build.props sets
      # TreatWarningsAsErrors=true, so a single Roslyn warning fails the build.
      # --no-restore avoids a redundant network round-trip.
      - name: Build (Release, 0-warning gate)
        run: dotnet build vouchfx.sln -c Release --no-restore

      # ubuntu-26.04 (now behind ubuntu-latest) ships fs.inotify.max_user_instances=128.
      # Each IConfiguration JSON source with reloadOnChange opens a FileSystemWatcher, so
      # test hosts exhaust it and fail with "The configured user limit (128) on the number
      # of inotify instances has been reached" (run 41217231299). Raise instances and
      # watches to common CI values before any test host starts.
      - name: Raise inotify limits (ubuntu-26.04 defaults to 128 instances)
        run: |
          sudo sysctl -w fs.inotify.max_user_instances=8192
          sudo sysctl -w fs.inotify.max_user_watches=524288

      # Format gate: dotnet format re-runs the formatter and errors if any file
      # would change.  This catches whitespace drift, import ordering, and any
      # EditorConfig rule that the formatter enforces.
      # --no-restore avoids a redundant restore pass.
      - name: Format gate (dotnet format --verify-no-changes)
        run: dotnet format vouchfx.sln --verify-no-changes --no-restore

      # Run all unit tests in Release configuration.
      # The  --filter "requires!=docker"  expression uses xUnit's trait filter
      # syntax to EXCLUDE any test decorated with [Trait("requires","docker")].
      # Aspire integration tests carry that trait; they run in the `integration`
      # job instead.  Plain unit tests have no trait and run here.
      # --collect:"XPlat Code Coverage" writes Cobertura XML via coverlet.
      #
      # A trx logger is configured (VSTestLogger, repo-root Directory.Build.props — see
      # #550 below for why it lives there and not on this command line) for a test that
      # has something to say when it PASSES (#529).
      # SystemProcessRunnerTests.TheGuardsAnchors_StayInTheOrderARealChildProduces
      # measures the skew between Process.StartTime and a pid file's write time and
      # writes it to ITestOutputHelper; the console logger prints captured output for
      # FAILED tests only, so without a trx that figure existed nowhere on this lane.
      # Both unit lanes now preserve it for comparison across Linux and Windows.
      # The trx lands in TestResults/ and therefore inside the coverage artifact the
      # step below already uploads with if: always().  Not console;verbosity=detailed,
      # which would print a line for every test in the solution.
      #
      # LogFilePrefix, NOT LogFileName, and the difference is load-bearing here.  A
      # fixed LogFileName is one path per RUN, while `dotnet test <solution>` starts one
      # test host per project — 37 of them overlapping on run 33904509538, per the note
      # in docker-integration.yml's integration job — so every assembly would write the same file and
      # the last to finish would win.  MEASURED locally over two projects: with
      # LogFileName=unit.trx the results directory held ONE trx carrying only the second
      # project's 57 tests, the first project's 250 gone; with LogFilePrefix=unit it held
      # two, unit_net8.0_<timestamp>.trx apiece, 250 and 57.
      #
      # #550: LogFilePrefix alone still carried no PROJECT component, only a
      # second-resolution timestamp, so two hosts starting in the same second could still
      # collide — inferred, not measured, at the time this comment first shipped. Checked
      # rather than assumed on PR #546's own first CI run (job 106123840813): all 37
      # `Results File:` lines it printed name 37 DISTINCT paths, so the gap stayed
      # theoretical there too — including for Vouchfx.Cli.Tests, whose own line
      # (unit_net8.0_20260920181339.trx, identified by the Passed! summary naming
      # Vouchfx.Cli.Tests.dll seven milliseconds later in the same host's output) is the
      # one loss that would have cost anything: the only trx carrying a figure (#529's
      # skew) that exists nowhere else, every other trx here duplicating what the job log
      # already shows. Theoretical is still a live bug, so the trx name now carries the
      # PROJECT too — see VSTestLogger in the repo-root Directory.Build.props, which is
      # also why this step no longer passes --logger itself (below): a CLI --logger flag
      # is forwarded to every project as an MSBuild GLOBAL property, which always beats a
      # PropertyGroup value, so it would apply the same literal prefix to every host again
      # and undo the fix. $(MSBuildProjectName) is unique per project by construction,
      # which turns "still theoretical" into "cannot happen" rather than merely extending
      # how long it stays unseen.
      #
      # AND IT DOES NOT CONTRADICT #498, WHICH THIS BRANCH APPLIES TWO COMMITS EARLIER.
      # BuiltCli.cs declines to print an absolute path into an assertion because CI logs
      # are public; a trx carries runUser and computerName, so the question is fair.  The
      # answer is that they are different values.  #498 is about the MAINTAINER's host
      # layout — a developer's account name and directory tree, reached through
      # Path.GetTempPath() on a machine that is not disposable.  This build job runs on
      # ubuntu-latest, so on this lane those attributes are the ephemeral GitHub runner
      # identity — `runner` on an `fv-az…` host that ceases to exist when the job ends.
      # The Windows unit job also uses a disposable GitHub-hosted runner.
      # A green run's TRX carries no repository paths; a failing one can carry source
      # paths in PDB-resolved stack traces, which is the same exposure the job log
      # already has and is not what #498 restricts.  The ARTIFACT is not path-free
      # either way and never was: the Cobertura XML this step already collected carries
      # a <sources> element with an absolute base path on every run, green included.
      # That is `/home/runner/work/...` on a hosted runner — the same non-identifying
      # ephemeral tree — so the conclusion holds, but the trx is not what introduced
      # paths to this artifact and removing it would not make the artifact path-free.  If a self-hosted runner is ever added here, this
      # paragraph stops being true and the flag should be reconsidered with it.
      # Bound cross-project contention while preserving every existing test and timeout.
      # Per-project xUnit scheduling and exclusive certificate guards remain unchanged.
      #
      # --blame-hang makes the test host name a test that runs longer than 10 minutes and
      # then terminates it, instead of the job going silent. A hang on 17 November 2026
      # left no log and no test name (ZEB-49). No non-Docker test legitimately runs that
      # long, and --blame-hang-dump-type none records the test name in Sequence_*.xml
      # under TestResults/ without writing a dump.
      - name: Unit tests (requires!=docker)
        run: >
          dotnet test vouchfx.sln
          -m:1
          -c Release
          --no-build
          --filter "requires!=docker"
          --collect:"XPlat Code Coverage"
          --blame-hang
          --blame-hang-timeout 10m
          --blame-hang-dump-type none
          --results-directory TestResults

      - name: Verify tracked checkout is unchanged after tests
        if: always()
        run: |
          status=0
          git diff --exit-code || status=1
          git diff --cached --exit-code || status=1
          exit "$status"

      # Upload coverage artefacts.  On main pushes and the daily schedule the
      # `coverage-badge` job downloads this artifact and turns it into the
      # README's self-hosted coverage badge; the artifact also remains handy
      # for local inspection of a CI run's coverage.
      - name: Upload coverage artefacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: TestResults/
          retention-days: 7

  # Rebuild every project with the newer SDK's recommended analyser set. An
  # incremental build can skip already-built projects and miss violations.
  # This is advisory: the repository's supported SDK is .NET 10, and this job
  # looks one major ahead. (With the target itself on net10.0, a .NET 10 forward
  # job would only repeat the build job.)
  analyser-forward:
    name: Analyser forward (.NET 11, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET 11 SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "11.0.x"

      - name: Rebuild solution with forward analysers
        working-directory: ${{ runner.temp }}
        run: |
          # The hosted image carries several SDKs and the muxer picks the newest
          # one when no global.json is in scope, so a newer major (.NET 12)
          # would beat the 11.0 SDK installed above.  The muxer resolves
          # global.json by walking up from the working directory, not from the
          # solution, so a pin written into a scratch directory outside the
          # checkout governs both the version check and the build while the
          # repository's own .NET 10 pin stays out of the way.  latestFeature
          # rolls only within 11.0, so it takes the newest installed 11.0.x and
          # fails closed if none exists instead of drifting to another major.
          mkdir -p analyser-forward
          cd analyser-forward
          printf '%s\n' '{"sdk":{"version":"11.0.100","rollForward":"latestFeature"}}' > global.json
          sdk_version="$(dotnet --version)"
          echo "Forward analyser SDK: $sdk_version"
          [[ "$sdk_version" == 11.* ]]
          dotnet build "$GITHUB_WORKSPACE/vouchfx.sln" -c Release -t:Rebuild -warnaserror

  windows-unit:
    name: Windows build & unit tests
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore vouchfx.sln

      # Directory.Build.props sets TreatWarningsAsErrors=true.
      - name: Build (Release, 0-warning gate)
        run: dotnet build vouchfx.sln -c Release --no-restore

      # Retain the project-specific VSTestLogger from Directory.Build.props;
      # a CLI --logger override would erase its unique per-project prefix.
      # Bound cross-project contention while preserving every existing test and timeout.
      # Per-project xUnit scheduling and exclusive certificate guards remain unchanged.
      - name: Unit tests (requires!=docker)
        run: >
          dotnet test vouchfx.sln
          -m:1
          -c Release
          --no-build
          --filter "requires!=docker"
          --results-directory TestResults/Windows

      - name: Verify tracked checkout is unchanged after tests
        if: always()
        run: |
          git diff --exit-code
          $workingTreeExit = $LASTEXITCODE
          git diff --cached --exit-code
          if ($workingTreeExit -ne 0 -or $LASTEXITCODE -ne 0) { exit 1 }

      - name: Upload Windows unit test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-unit-test-results
          path: TestResults/Windows/*.trx
          retention-days: 7

  # ── Memory-leak regression — BLOCKING permanent gate ─────────────────────────
  # Runs the 5,000-iteration provider-closure harness over the full Core-provider
  # client closure.  Docker-independent; scheduled daily to catch regressions
  # introduced by dependency upgrades between feature pushes.
  memory-leak:
    name: Memory-leak regression gate (provider closure)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore vouchfx.sln

      - name: Build (Release)
        run: dotnet build vouchfx.sln -c Release --no-restore

      # Run the 5,000-iteration provider-closure memory-leak regression gate.
      # --mode closure  exercises the full Core-provider client type closure
      #                 (Npgsql, Confluent.Kafka, MongoDB.Driver,
      #                  StackExchange.Redis, HttpClient) — no live connections.
      # --iterations 5000  is the calibrated run length (NetDelta stays far below the
      #                    2 MB threshold; see docs/memory-harness.md for a dated run).
      # --threshold-bytes 2000000  (2 MB) is the M1 permanent threshold.
      # Exit 0 iff Passed && ContextReclaimed; any non-zero exit fails the pipeline.
      - name: Run memory-leak harness (closure, 5 000 iterations, 2 MB threshold)
        run: >
          dotnet run
          -c Release
          --no-build
          --project tests/Vouchfx.Engine.Compilation.MemoryHarness
          -- --mode closure --iterations 5000 --threshold-bytes 2000000

  # ── Docker / Aspire integration — topology and provider tests ───────────────────
  # The lane's steps live in the reusable workflow
  # .github/workflows/docker-integration.yml, which this job calls at the commit
  # under test.  Tests decorated with [Trait("requires","docker")] run there after
  # the `build` job.  The lane no longer runs on pull requests or pushes: it runs
  # daily on main via the schedule and on demand via workflow_dispatch on any
  # branch (Actions tab -> CI -> Run workflow -> pick the branch).  A failure is
  # therefore found on the next daily run, not before merge; it still fails the
  # run it is in, through `integration-gate` below.
  integration:
    name: Docker integration lane
    needs: build
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/docker-integration.yml
    with:
      reviewed_sha: ${{ github.event.pull_request.head.sha || github.sha }}

  # The repository's ruleset requires the check `Integration tests — Docker / Aspire`.
  # A job that calls a reusable workflow reports as "<caller> / <called job>", and a
  # skipped caller reports under its own name only, so this job carries the required
  # name.  It is skipped exactly when the lane is skipped (pull requests, pushes, and
  # a scheduled or dispatched run whose `build` job failed), which is the conclusion
  # the check had before the lane moved into its own workflow.  Whenever the lane
  # did start, it passes only if the lane succeeded: a failed or cancelled lane
  # fails the check.  A cancelled run is different: a lane that was still waiting
  # for `build` when the run was cancelled is reported as cancelled, not skipped,
  # even where its `if:` would have been false.  So on a cancelled run, including a
  # superseded pull-request or push run, the check reports failure where it used to
  # report cancelled, like the TLS gate; the step's error message says which result
  # it saw.
  integration-gate:
    name: Integration tests — Docker / Aspire
    runs-on: ubuntu-latest
    needs: integration
    if: always() && needs.integration.result != 'skipped'
    steps:
      - name: Require the Docker / Aspire lane to succeed
        env:
          LANE_RESULT: ${{ needs.integration.result }}
        run: |
          if [ "$LANE_RESULT" != success ]; then
            echo "::error::Docker / Aspire lane result: $LANE_RESULT (cancelled = the run was cancelled, not a test failure)"
            exit 1
          fi

  # ── Dependency vulnerability scan — ADVISORY, non-blocking ───────────────────
  # Reports known-vulnerable transitive packages across the solution so a
  # maintainer retains continuous CVE visibility over the published-package
  # footprint.  This job is NON-BLOCKING:
  #   * continue-on-error: true            → the job never fails the workflow;
  #   * NOT a required check               → it gates no merge;
  #   * `dotnet list package --vulnerable` → exits 0 even when it finds
  #     vulnerabilities (it is a report, not a gate), so continue-on-error is
  #     belt-and-braces and intentional.
  # A newly-published upstream CVE must never break an otherwise-clean PR.
  vuln-scan:
    name: Dependency vulnerability scan (advisory, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore vouchfx.sln

      # Scan the whole solution's transitive graph for packages with a known
      # advisory.  --include-transitive surfaces the indirect footprint (the
      # bulk of the CVE surface flows through the Aspire deps).
      # The command prints flagged packages, severities and advisory URLs to
      # the Actions log; it exits 0 regardless of findings, so combined with
      # continue-on-error this step is purely informational.
      - name: List vulnerable packages (transitive, advisory)
        continue-on-error: true
        run: dotnet list vouchfx.sln package --vulnerable --include-transitive

      # The same report for each project that is NOT in vouchfx.sln, because the
      # solution scan above cannot see them.  Every project file with a
      # PackageReference that sits outside the solution must be named here;
      # OutOfSolutionProjectAuditGuardTests fails when one is missing.  Each
      # project is restored and listed on its own, and a failure in one does not
      # skip the next.  As above, the findings are printed to the Actions log and
      # `dotnet list package` exits 0 on them, so this step is informational.
      # Only a restore failure (for example an advisory that audit reports as an
      # error under the repository's warnings-as-errors setting) fails the step,
      # which continue-on-error keeps from failing the workflow.
      - name: List vulnerable packages (projects outside the solution, advisory)
        continue-on-error: true
        env:
          OUT_OF_SOLUTION_PROJECTS: >-
            examples/compose-orders/app/ComposeOrders.csproj
            tests/Vouchfx.Engine.Runtime.TransportAcceptance.Tests/Vouchfx.Engine.Runtime.TransportAcceptance.Tests.csproj
        run: |
          status=0
          for project in $OUT_OF_SOLUTION_PROJECTS; do
            echo "::group::$project"
            dotnet restore "$project" \
              && dotnet list "$project" package --vulnerable --include-transitive \
              || status=1
            echo "::endgroup::"
          done
          exit "$status"

  # ── VSCode extension build — NON-BLOCKING ────────────────────────────────────
  # Builds, lints, tests and packages the greenfield TypeScript VSCode extension
  # at tools/vscode-vouchfx/.  This extension is OUT of the .NET solution
  # (vouchfx.sln), so it is invisible to every .NET job above; this job is the
  # only thing that exercises it in CI.
  #
  # This job is NON-BLOCKING (continue-on-error: true) and is NOT a required
  # check — it must NEVER gate merge:
  #   * The extension is new (greenfield), so its Node toolchain is allowed to be
  #     skipped or flaky without blocking unrelated .NET PRs.
  #   * The AUTHORITATIVE editor-schema-vs-compiler contract gate is the .NET test
  #     `VsCodeShippedSchemaSyncTests` (Vouchfx.Engine.Compilation.Tests), which
  #     runs in the BLOCKING `build` job (`--filter "requires!=docker"`). That
  #     test asserts the schema shipped with the extension equals the composer's
  #     output and remains the single source of truth even if this Node job is
  #     skipped or flaky.
  # This job only PROVES the extension compiles, lints, tests and packages — it
  # makes no contract assertion of its own.
  #
  # Node version: LTS 22 (NOT the non-LTS Node 25 the extension was authored on
  # locally).  The committed package-lock.json (lockfileVersion 3) makes
  # `npm ci` reproducible; the package.json `engines` field pins only
  # `vscode` (no Node engine floor), and the full chain
  # (npm ci → lint → compile → test → package) was verified green locally.
  # LTS 22 is the correct CI baseline: the `test` script runs
  # `node --test "dist/test/**/*.test.js"`, which relies on the test runner
  # expanding that quoted glob.  Observed on the previously-pinned Node 20 runner,
  # `node --test` took the glob literally (`Could not find '…/dist/test/**/*.test.js'`),
  # matched zero files and exited 1.  Node 22 (active LTS) expands it as local dev
  # (Node 25) does and the suite runs.  Do not regress below 22, and do not regress
  # to a non-LTS.
  vscode-extension:
    name: VSCode extension build (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true

    # All npm steps run inside the extension package directory.
    defaults:
      run:
        working-directory: tools/vscode-vouchfx

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # LTS Node 22 with npm caching keyed on the extension's own lock file.
      - name: Set up Node.js (LTS 22)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: tools/vscode-vouchfx/package-lock.json

      # Reproducible clean install from the committed lockfile (lockfileVersion 3).
      - name: Install dependencies (npm ci)
        run: npm ci

      # ESLint over src (npm run lint → `eslint src --ext ts`).
      - name: Lint (eslint)
        run: npm run lint

      # TypeScript compile (npm run compile → `tsc -p ./`).
      - name: Compile (tsc)
        run: npm run compile

      # Node built-in test runner (npm test → `node --test "dist/test/**/*.test.js"`;
      # its `pretest` recompiles, so this is safe even standalone).
      - name: Test (node --test)
        run: npm test

      # Package the .vsix via @vscode/vsce (npm run package → `vsce package`).
      - name: Package extension (vsce package)
        run: npm run package

      # Publish the produced .vsix for inspection/download.  if: always() so the
      # artefact is captured even if a later step in this non-blocking job fails.
      - name: Upload .vsix artefact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vscode-vouchfx-vsix
          path: tools/vscode-vouchfx/*.vsix
          retention-days: 7
          if-no-files-found: ignore

  # ── Documentation build and publication gate — BLOCKING ─────────────────────
  # Keep the Python pin, dependency install and build/gate commands aligned
  # with pages.yml. No paths filter or job condition: this check must exist
  # on every PR, including changes to generated facts or example references.
  docs-build:
    name: Documentation build & publication gate
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The git-revision-date-localized plugin requires full history.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: python -m pip install -r requirements-docs.txt

      - name: Build site (MkDocs Material)
        env:
          # Read-only token provides rate-limit headroom for facts API reads.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mkdocs build --strict

      - name: Verify publication gate
        run: python scripts/check_site.py _site

  # ── Site tools (Python) — BLOCKING ────────────────────────────────────────────
  # Regression-tests scripts/site-tools' `vouchfx_site_tools` package — the
  # shared static-site generator four satellite repositories (vouchfx-
  # providers, vouchfx-samples, vouchfx-telemetry-backend, vouchfx-mcp)
  # pip-install at a pinned SHA. In particular, it pins SiteConfig.site_url's
  # additive/byte-identical contract (vouchfx issue #254): unset, `build()`
  # must be a byte-for-byte no-op; set, it must emit robots.txt/sitemap.xml
  # correctly and pass a `canonical` kwarg that a template without the
  # placeholder tolerates. Independent of the .NET solution (no `needs`) and of the
  # MkDocs Pages build (`.github/workflows/pages.yml`) — this only exercises
  # the shared package's own public API (SiteConfig + build()) against a
  # throw-away repo skeleton, so it needs neither `dotnet build` nor `mkdocs
  # build` to have run first. Deterministic and network-free (the suite
  # overrides every default fact fetcher), so — unlike the greenfield
  # `vscode-extension` job — this is a required, blocking gate, not advisory.
  site-tools-tests:
    name: Site tools (Python) — site_url contract tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history (not the default fetch-depth 1): the cross-version
          # EDGE-002 test in test_semantic_headings_and_llms_txt.py needs
          # refs/remotes/origin/main to resolve via `git show`/`git rev-parse`.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      # Editable install of the package under test, plus its `test` extra
      # (pytest) declared in scripts/site-tools/pyproject.toml.
      - name: Install vouchfx-site-tools (test extra)
        run: python -m pip install -e "scripts/site-tools[test]"

      # Since vouchfx issue #300, this same blocking run also carries
      # test_check_site.py (scripts/check_site.py, the publication gate
      # one directory up) and test_og_card_render.py
      # (scripts/og-card/render.py, the og:image social-card renderer) —
      # both loaded via importlib rather than imported as part of this
      # package; see each file's own docstring for why it deliberately
      # lives here instead of a new job.
      - name: Run pytest (site_url contract + check_site.py + og-card render suites)
        run: python -m pytest scripts/site-tools/tests -q

  # ── Coverage badge — self-hosted, cosmetic, NON-BLOCKING ─────────────────────
  # Turns the Cobertura XML produced by the `build` job into a shields.io
  # endpoint JSON + SVG via ReportGenerator and force-pushes them to the orphan
  # `badges` branch (single commit — no history growth).  The README renders the
  # JSON through img.shields.io/endpoint, so the coverage number stays entirely
  # self-hosted (no coverage service, no new credentials).
  #
  # Runs only for main pushes and the daily schedule — PR runs must never move
  # the published badge.  The badge reflects UNIT coverage only (the blocking
  # `build` job); the native-process Docker lane is uninstrumented. A red
  # `build` skips this job via `needs`, so the last good badge is retained.
  coverage-badge:
    name: Coverage badge (main only)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule')
    continue-on-error: true            # cosmetic — must never redden CI
    # Push and scheduled runs on main are in separate workflow concurrency groups,
    # so the badge pushes are serialised here instead.
    concurrency:
      group: coverage-badge-main
      cancel-in-progress: false
    permissions:
      contents: write                  # push to the `badges` branch (this job only)

    steps:
      - name: Download coverage artefacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
          path: TestResults

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"

      # Exact-version pin per repo convention for third-party tooling.  The
      # global-tool shim lands under ~/.dotnet/tools, which is NOT guaranteed
      # to be on PATH for subsequent steps (same rationale as the release.yml
      # smoke-test job) — append it to $GITHUB_PATH so the next steps can
      # invoke `reportgenerator` bare.
      - name: Install ReportGenerator
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.5.10
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      # Merges every per-project Cobertura file into one number.  JsonSummary
      # yields Summary.json (machine-readable percentages); Badges yields
      # badge_linecoverage.svg, kept alongside the endpoint JSON as a
      # zero-third-party fallback.  Assembly filters keep the measured surface
      # to product code — test helpers must not inflate the percentage.
      # (Verified on 5.5.10: Badges does NOT emit a shields endpoint JSON —
      # only pre-coloured SVGs — hence the compose step below.)
      - name: Generate coverage summary + badge SVG
        run: >
          reportgenerator
          -reports:"TestResults/**/coverage.cobertura.xml"
          -targetdir:badge-out
          -reporttypes:"Badges;JsonSummary"
          -assemblyfilters:"+Vouchfx.*;-*.Tests;-*.TestSupport"

      # Compose the shields.io endpoint JSON
      # (https://shields.io/badges/endpoint-badge) the README renders via
      # img.shields.io/endpoint.  Colour thresholds are deliberate: red below
      # 60 %, yellow to 75 %, green to 90 %, brightgreen above.
      - name: Compose shields endpoint JSON
        run: |
          pct=$(jq -r '.summary.linecoverage' badge-out/Summary.json)
          # Fail loudly on a non-numeric percentage (e.g. null when the filter
          # matched nothing) — better no badge update than a "null%" badge.
          [[ "$pct" =~ ^[0-9]+(\.[0-9]+)?$ ]] || { echo "unexpected linecoverage: '$pct'" >&2; exit 1; }
          jq -n --argjson pct "$pct" '{
            schemaVersion: 1,
            label: "coverage",
            message: "\($pct)%",
            color: (if $pct >= 90 then "brightgreen"
                    elif $pct >= 75 then "green"
                    elif $pct >= 60 then "yellow"
                    else "red" end)
          }' > badge-out/coverage-endpoint.json
          cat badge-out/coverage-endpoint.json

      # Orphan single-commit publish: git init + force-push replaces the branch
      # wholesale each run.  `badges` matches none of this workflow's branch
      # triggers, so this push cannot re-trigger CI.  The token reaches git via
      # env, never interpolated into the script text.
      - name: Publish to badges branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd badge-out
          git init -b badges
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coverage-endpoint.json badge_linecoverage.svg
          git commit -m "coverage badge for ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
