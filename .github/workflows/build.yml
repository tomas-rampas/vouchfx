# .github/workflows/build.yml — vouchfx CI pipeline skeleton
#
# Jobs
# ----
#  build        Blocking gate: restore → build (0-warning) → format → unit tests.
#               Docker-dependent Aspire integration tests are EXCLUDED via the
#               `requires!=docker` trait filter; they run in the `integration`
#               job.
#
#  memory-leak  BLOCKING permanent gate: runs the 5,000-iteration
#               provider-closure memory-leak harness over the full Core-provider
#               client closure (Npgsql, Confluent.Kafka, MongoDB.Driver,
#               StackExchange.Redis, HttpClient).  Docker-independent — the
#               closure script touches client types in-memory only, never
#               connects.  Also scheduled weekly (Monday 06:00 UTC) to catch
#               regressions introduced by dependency upgrades between pushes.
#               Exit non-zero iff NetDelta > threshold-bytes (2 MB) or context
#               not reclaimed; a failure here blocks merge.
#
#  integration  Forward-looking stub for Docker-dependent Aspire spike tests
#               (requires=docker trait).  Non-blocking until tests exist.
#               ubuntu-latest runners include Docker out of the box.
#
#  vuln-scan    ADVISORY, NON-BLOCKING dependency-vulnerability scan
#               (continue-on-error: true).  Surfaces known-vulnerable
#               transitive packages via `dotnet list package --vulnerable
#               --include-transitive` so maintainers retain continuous CVE
#               visibility over the published-package footprint (the engine
#               assemblies + Platform.Sdk.Testing now ship a code-generating
#               compiler + JsonSchema.Net + YamlDotNet onto every consumer's
#               transitive graph).  It deliberately NEVER gates merge: a
#               newly-published upstream CVE must not break unrelated PRs.

name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "chore/**"
  pull_request:
    branches:
      - main
      - "feat/**"
  schedule:
    - cron: "0 6 * * 1"   # 06:00 UTC every Monday — weekly memory-leak regression cadence

# Cancel in-progress runs for the same ref to avoid wasting runner minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO:             "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  # Suppress the .NET first-run welcome message on every step.
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

# ── Blocking gate ─────────────────────────────────────────────────────────────
jobs:
  build:
    name: Build & unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Install the .NET 8 SDK.  The version spec "8.0.x" satisfies global.json
      # (sdk.version = "8.0.400", rollForward = latestFeature) — the setup
      # action will resolve the latest 8.0 feature band available on the runner.
      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      # Restore NuGet packages using the lock file if present; otherwise resolve
      # centrally-managed versions from Directory.Packages.props.
      - name: Restore dependencies
        run: dotnet restore vouchfx.sln

      # Build in Release configuration.  Directory.Build.props sets
      # TreatWarningsAsErrors=true, so a single Roslyn warning fails the build.
      # --no-restore avoids a redundant network round-trip.
      - name: Build (Release, 0-warning gate)
        run: dotnet build vouchfx.sln -c Release --no-restore

      # Format gate: dotnet format re-runs the formatter and errors if any file
      # would change.  This catches whitespace drift, import ordering, and any
      # EditorConfig rule that the formatter enforces.
      # --no-restore avoids a redundant restore pass.
      - name: Format gate (dotnet format --verify-no-changes)
        run: dotnet format vouchfx.sln --verify-no-changes --no-restore

      # Run all unit tests in Release configuration.
      # The  --filter "requires!=docker"  expression uses xUnit's trait filter
      # syntax to EXCLUDE any test decorated with [Trait("requires","docker")].
      # Aspire integration tests carry that trait; they run in the `integration`
      # job instead.  Plain unit tests have no trait and run here.
      # --collect:"XPlat Code Coverage" writes Cobertura XML via coverlet.
      - name: Unit tests (requires!=docker)
        run: >
          dotnet test vouchfx.sln
          -c Release
          --no-build
          --filter "requires!=docker"
          --collect:"XPlat Code Coverage"
          --results-directory TestResults

      # Upload coverage artefacts so they are available to coverage services
      # (e.g. Codecov, SonarCloud) that may be wired up later.
      - name: Upload coverage artefacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: TestResults/
          retention-days: 7

  # ── Memory-leak regression — BLOCKING permanent gate ─────────────────────────
  # Runs the 5,000-iteration provider-closure harness over the full Core-provider
  # client closure.  Docker-independent; scheduled weekly to catch regressions
  # introduced by dependency upgrades between feature pushes.
  memory-leak:
    name: Memory-leak regression gate (provider closure)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore vouchfx.sln

      - name: Build (Release)
        run: dotnet build vouchfx.sln -c Release --no-restore

      # Run the 5,000-iteration provider-closure memory-leak regression gate.
      # --mode closure  exercises the full Core-provider client type closure
      #                 (Npgsql, Confluent.Kafka, MongoDB.Driver,
      #                  StackExchange.Redis, HttpClient) — no live connections.
      # --iterations 5000  is the calibrated run length (verified locally:
      #                    NetDelta ≈ 1.7 KB against a 2 MB threshold, ≈1000× headroom).
      # --threshold-bytes 2000000  (2 MB) is the M1 permanent threshold.
      # Exit 0 iff Passed && ContextReclaimed; any non-zero exit fails the pipeline.
      - name: Run memory-leak harness (closure, 5 000 iterations, 2 MB threshold)
        run: >
          dotnet run
          -c Release
          --no-build
          --project tests/Platform.Engine.Compilation.MemoryHarness
          -- --mode closure --iterations 5000 --threshold-bytes 2000000

  # ── Docker / Aspire integration — forward-looking stub ───────────────────────
  # ubuntu-latest runners include Docker Engine, which is required for the
  # Aspire topology (Testcontainers, §4).  Tests decorated with
  # [Trait("requires","docker")] run here, isolated from the blocking `build`
  # job, so a topology failure never blocks a clean unit-test run.
  #
  # This job is NON-BLOCKING (continue-on-error: true) until the Aspire spike
  # tests exist (S01-A-*).  Remove continue-on-error when tests are green.
  integration:
    name: Integration tests — Docker / Aspire (forward-looking, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore vouchfx.sln

      - name: Build (Release)
        run: dotnet build vouchfx.sln -c Release --no-restore

      # Warm the Docker image cache BEFORE dotnet test so DCP's internal
      # ~20s per-resource start window is never spent on a cold image pull.
      #
      # Why this step exists
      # --------------------
      # The Aspire/DCP native orchestrator enforces its own per-resource
      # readiness watchdog ("the operation didn't complete within the allowed
      # timeout of '00:00:20'") inside DistributedApplication.StartAsync — this
      # is NOT our 120s health gate (SuiteTopology uses a 120s gateTimeout).
      # On a cold/slow ubuntu-latest runner the FIRST requires=docker test pays
      # a cold image pull during startup; pull + create can exceed DCP's ~20s
      # window, surfacing as `EnvironmentError` (a CI flake, not a defect).
      # Pre-pulling here moves the pull OUT of the timed startup path: by the
      # time StartAsync runs, every image is already local, so DCP's window is
      # spent only on container create + health, which it comfortably makes.
      #
      # Image list (exact refs the requires=docker suite uses)
      # ------------------------------------------------------
      #   postgres:18.3                          — Aspire.Hosting.PostgreSQL 13.4.2
      #                                            default (PostgresContainerImageTags:
      #                                            docker.io/library/postgres:18.3);
      #                                            no test overrides the tag.
      #   confluentinc/confluent-local:8.2.0     — Aspire.Hosting.Kafka 13.4.2 default
      #                                            (KafkaContainerImageTags:
      #                                            docker.io/confluentinc/confluent-local:8.2.0).
      #   confluentinc/cp-schema-registry:7.6.1  — EnvironmentMapper.cs (explicit
      #                                            AddContainer(..., "7.6.1")) for the
      #                                            Kafka+Avro schema-registry capstone.
      #   traefik/whoami:latest                  — system-under-test image in the
      #                                            http.rest / capture / Respawn capstones.
      #   hashicorp/vault:latest                 — VaultSecretSourceDockerTests dev-mode
      #                                            Vault container (§17 secret source).
      #   axllent/mailpit:v1.21                  — MailExpectSmtpDockerTests SMTP capture
      #                                            container (mail-expect.smtp provider);
      #                                            pinned tag mirrors EnvironmentMapper's
      #                                            mailpit default (determinism, §4).
      #   redis:7                                — CacheAssertRedisDockerTests cache container
      #                                            (cache-assert.redis provider); Aspire.Hosting.Redis
      #                                            AddRedis default image family.
      #   rabbitmq:4.3-management                — MqRabbitmqDockerTests AMQP broker container
      #                                            (mq-publish.rabbitmq / mq-expect.rabbitmq);
      #                                            Aspire.Hosting.RabbitMQ 13.4.2 default tag
      #                                            (RabbitMQContainerImageTags: confirmed by
      #                                            inspecting the installed package — this list
      #                                            previously said "4-management", a DIFFERENT,
      #                                            floating tag Aspire never actually requests,
      #                                            so the pre-pull silently warmed nothing for
      #                                            this dependency); management variant includes
      #                                            the HTTP API for exchange/queue management.
      #   nats:2.14                              — MqNatsDockerTests JetStream broker container
      #                                            (mq-publish.nats / mq-expect.nats);
      #                                            Aspire.Hosting.Nats 13.4.2 default image tag.
      #   mysql:9.7                              — DbAssertMysqlDockerTests MySQL container
      #                                            (db-assert.mysql provider);
      #                                            Aspire.Hosting.MySql 13.4.2 default
      #                                            (MySqlContainerImageTags:
      #                                            docker.io/library/mysql:9.7);
      #                                            no test overrides the tag.
      #
      # Best-effort & non-fatal by design
      # ---------------------------------
      # continue-on-error: true PLUS a per-image `|| echo` guard ensure a stale,
      # renamed or unreachable tag NEVER fails the job — it simply degrades to
      # today's behaviour (a cold pull inside StartAsync). This step only REMOVES
      # the cold-pull flake; it can never MASK a genuine pull failure, because a
      # truly bad/unreachable image still fails the real pull inside StartAsync
      # and surfaces as an EnvironmentError, exactly as before. When the pinned
      # Aspire minor advances and a default tag changes, a missed update here is
      # harmless (degrades, never breaks).
      - name: Pre-pull dependency images (warm Docker cache for DCP's ~20s window)
        continue-on-error: true
        run: |
          for image in \
            postgres:18.3 \
            mcr.microsoft.com/mssql/server:2022-latest \
            mongo:7 \
            redis:7 \
            confluentinc/confluent-local:8.2.0 \
            confluentinc/cp-schema-registry:7.6.1 \
            traefik/whoami:latest \
            hashicorp/vault:latest \
            axllent/mailpit:v1.21 \
            rabbitmq:4.3-management \
            elasticsearch:8.17.3 \
            nats:2.14 \
            mysql:9.7 \
            mcr.microsoft.com/azure-messaging/servicebus-emulator:1.1.2 \
            quay.io/prometheus/node-exporter:v1.8.2 \
            amazon/dynamodb-local:2.5.2 \
            minio/minio:RELEASE.2025-09-07T16-13-09Z ; do
            echo "::group::docker pull $image"
            docker pull "$image" || echo "::warning::pre-pull of $image failed (non-fatal; DCP will cold-pull it during StartAsync)"
            echo "::endgroup::"
          done

      # Run only tests carrying [Trait("requires","docker")].
      # Until the Aspire topology tests are wired in S01-A-*, this filter
      # matches nothing and dotnet test exits 0 with "No tests found."
      #
      # Topology startup is serialised so at most ONE Aspire topology starts at a
      # time — fitting DCP's internal ~20s per-resource startup window on a loaded
      # runner and killing the intermittent `startup` HealthGate flake. Two facts
      # combine to guarantee this:
      #   • per-assembly [assembly: CollectionBehavior(DisableTestParallelization
      #     = true)] in Runtime.Tests + Orchestration.Tests serialises the
      #     topology-starting classes WITHIN each assembly; and
      #   • under the pinned .NET 8 SDK (global.json 8.0.400), with single-TFM
      #     classic-VSTest projects and no parallelism flag set, `dotnet test
      #     <solution>` runs ONE test host per project SEQUENTIALLY by default, so
      #     assemblies don't overlap either. (If a future SDK/MTP/`-m` change
      #     enabled cross-assembly parallelism, revisit with the right lever.)
      # (The Sprint08 parallel capstone intentionally runs two topologies at once
      # via the engine's own ParallelSuiteRunner — unaffected by, and orthogonal
      # to, xUnit/VSTest scheduling.)
      - name: Integration tests (requires=docker)
        run: >
          dotnet test vouchfx.sln
          -c Release
          --no-build
          --filter "requires=docker"
          --collect:"XPlat Code Coverage"
          --results-directory TestResults

  # ── Dependency vulnerability scan — ADVISORY, non-blocking ───────────────────
  # Reports known-vulnerable transitive packages across the solution so a
  # maintainer retains continuous CVE visibility over the published-package
  # footprint.  This job is NON-BLOCKING:
  #   * continue-on-error: true            → the job never fails the workflow;
  #   * NOT a required check               → it gates no merge;
  #   * `dotnet list package --vulnerable` → exits 0 even when it finds
  #     vulnerabilities (it is a report, not a gate), so continue-on-error is
  #     belt-and-braces and intentional.
  # A newly-published upstream CVE must never break an otherwise-clean PR.
  vuln-scan:
    name: Dependency vulnerability scan (advisory, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore vouchfx.sln

      # Scan the whole solution's transitive graph for packages with a known
      # advisory.  --include-transitive surfaces the indirect footprint (the
      # bulk of the CVE surface flows through Aspire/Testcontainers deps).
      # The command prints flagged packages, severities and advisory URLs to
      # the Actions log; it exits 0 regardless of findings, so combined with
      # continue-on-error this step is purely informational.
      - name: List vulnerable packages (transitive, advisory)
        continue-on-error: true
        run: dotnet list vouchfx.sln package --vulnerable --include-transitive

  # ── VSCode extension build — NON-BLOCKING ────────────────────────────────────
  # Builds, lints, tests and packages the greenfield TypeScript VSCode extension
  # at tools/vscode-vouchfx/.  This extension is OUT of the .NET solution
  # (vouchfx.sln), so it is invisible to every .NET job above; this job is the
  # only thing that exercises it in CI.
  #
  # This job is NON-BLOCKING (continue-on-error: true) and is NOT a required
  # check — it must NEVER gate merge:
  #   * The extension is new (greenfield), so its Node toolchain is allowed to be
  #     skipped or flaky without blocking unrelated .NET PRs.
  #   * The AUTHORITATIVE editor-schema-vs-compiler contract gate is the .NET test
  #     `VsCodeShippedSchemaSyncTests` (Platform.Engine.Compilation.Tests), which
  #     runs in the BLOCKING `build` job (`--filter "requires!=docker"`). That
  #     test asserts the schema shipped with the extension equals the composer's
  #     output and remains the single source of truth even if this Node job is
  #     skipped or flaky.
  # This job only PROVES the extension compiles, lints, tests and packages — it
  # makes no contract assertion of its own.
  #
  # Node version: LTS 22 (NOT the non-LTS Node 25 the extension was authored on
  # locally).  The committed package-lock.json (lockfileVersion 3) makes
  # `npm ci` reproducible; the package.json `engines` field pins only
  # `vscode` (no Node engine floor), and the full chain
  # (npm ci → lint → compile → test → package) was verified green locally.
  # LTS 22 is the correct CI baseline: the `test` script runs
  # `node --test "dist/test/**/*.test.js"`, which relies on the test runner
  # expanding that quoted glob.  Observed on the previously-pinned Node 20 runner,
  # `node --test` took the glob literally (`Could not find '…/dist/test/**/*.test.js'`),
  # matched zero files and exited 1.  Node 22 (active LTS) expands it as local dev
  # (Node 25) does and the suite runs.  Do not regress below 22, and do not regress
  # to a non-LTS.
  vscode-extension:
    name: VSCode extension build (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true

    # All npm steps run inside the extension package directory.
    defaults:
      run:
        working-directory: tools/vscode-vouchfx

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # LTS Node 22 with npm caching keyed on the extension's own lock file.
      - name: Set up Node.js (LTS 22)
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: tools/vscode-vouchfx/package-lock.json

      # Reproducible clean install from the committed lockfile (lockfileVersion 3).
      - name: Install dependencies (npm ci)
        run: npm ci

      # ESLint over src (npm run lint → `eslint src --ext ts`).
      - name: Lint (eslint)
        run: npm run lint

      # TypeScript compile (npm run compile → `tsc -p ./`).
      - name: Compile (tsc)
        run: npm run compile

      # Node built-in test runner (npm test → `node --test "dist/test/**/*.test.js"`;
      # its `pretest` recompiles, so this is safe even standalone).
      - name: Test (node --test)
        run: npm test

      # Package the .vsix via @vscode/vsce (npm run package → `vsce package`).
      - name: Package extension (vsce package)
        run: npm run package

      # Publish the produced .vsix for inspection/download.  if: always() so the
      # artefact is captured even if a later step in this non-blocking job fails.
      - name: Upload .vsix artefact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vscode-vouchfx-vsix
          path: tools/vscode-vouchfx/*.vsix
          retention-days: 7
          if-no-files-found: ignore
