# The source targets net10.0 (the published provider SDK libraries keep a net8.0
# asset, which loads in the net10.0 host). The .NET 10 lanes install ONE SDK major
# into an isolated directory and remove every other shared framework, so no
# preinstalled runtime can satisfy a build, test host or the packed tool. .NET 8
# and .NET 9 cannot run net10.0 code, so those lanes hold .NET 10 only.
#
# The roll-forward job proves RollForward=Major, which the README, the
# getting-started guide and the changelog promise: it builds and packs the CLI
# with the .NET 10 SDK (global.json pins the 10.0 band), then removes the .NET 10
# SDK and shared frameworks and runs the installed tool with only a newer major
# runtime present. It is a runtime-only lane: the solution's test hosts cannot be
# run on the newer runtime there, because `dotnet test` needs the .NET 10 SDK and
# that SDK needs the .NET 10 runtime. The existing CI retains Docker and release
# checks; this workflow exercises the source and Docker-free runtime paths in
# isolation.
name: .NET compatibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Scheduled workflows run only on the default branch. The daily run also
  # repeats the per-PR jobs; offset from build.yml so the two do not start together.
  schedule:
    - cron: "47 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

# The event name is part of the group so that a push to the same ref cannot
# cancel the scheduled or dispatched run, which is the only run that carries the
# Docker lanes; runs of the same event on the same ref still cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: .NET ${{ matrix.dotnet }} compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        dotnet: ['10.0']
    env:
      DOTNET_MULTILEVEL_LOOKUP: '0'
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A fresh directory prevents preinstalled SDKs/runtimes from satisfying
      # global.json or a net10.0 testhost on the selected lane.
      - name: Configure isolated SDK installation
        run: printf 'DOTNET_INSTALL_DIR=%s/dotnet-compatibility\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Install isolated .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ matrix.dotnet }}.x

      - name: Test runtime-isolation guard safety
        shell: pwsh
        run: ./scripts/ci/test-select-dotnet-runtime.ps1
      - name: Keep only the selected SDK and shared frameworks
        env:
          EXPECTED_DOTNET: '${{ matrix.dotnet }}'
        shell: pwsh
        run: ./scripts/ci/select-dotnet-runtime.ps1 -ExpectedDotnet $env:EXPECTED_DOTNET

      - name: Require the selected SDK and runtime only
        env:
          EXPECTED_DOTNET: ${{ matrix.dotnet }}
        run: |
          set -euo pipefail
          test "$(dirname "$(command -v dotnet)")" = "$DOTNET_INSTALL_DIR"
          sdk="$(dotnet --version)"
          [[ "$sdk" == "$EXPECTED_DOTNET".* ]]
          runtimes="$(dotnet --list-runtimes)"
          printf '%s\n' "$sdk" "$runtimes"
          [[ "$runtimes" == *Microsoft.NETCore.App* ]]
          [[ "$runtimes" == *Microsoft.AspNetCore.App* ]]
          while read -r _framework version _location; do
            [[ "$version" == "$EXPECTED_DOTNET".* ]]
          done <<< "$runtimes"

      - name: Restore
        run: dotnet restore vouchfx.sln

      - name: Build (Release, warnings as errors)
        run: dotnet build vouchfx.sln -c Release --no-restore -warnaserror

      # ubuntu-26.04 (now behind ubuntu-latest) ships fs.inotify.max_user_instances=128.
      # Each IConfiguration JSON source with reloadOnChange opens a FileSystemWatcher, so
      # test hosts exhaust it and fail with "The configured user limit (128) on the number
      # of inotify instances has been reached" (run 41311946394). Same step as build.yml.
      - name: Raise inotify limits (ubuntu-26.04 defaults to 128 instances)
        run: |
          sudo sysctl -w fs.inotify.max_user_instances=8192
          sudo sysctl -w fs.inotify.max_user_watches=524288

      - name: Docker-free tests
        # Match the baseline lanes' scheduling bound: concurrent solution test
        # hosts can starve real Roslyn child processes of their compile budget.
        run: dotnet test vouchfx.sln -m:1 -c Release --no-build --filter "requires!=docker"


      - name: Pack and run the installed CLI
        env:
          EXPECTED_DOTNET: ${{ matrix.dotnet }}
        run: |
          set -euo pipefail
          packages="$RUNNER_TEMP/compatibility-packages"
          tools="$RUNNER_TEMP/compatibility-tools"
          dotnet pack src/Cli/Vouchfx.Cli/Vouchfx.Cli.csproj -c Release --no-build \
            -p:PackageVersion=0.0.0-compatibility -o "$packages"
          python3 -m unittest discover -s scripts/tests -p test_package_compression.py -v
          python3 scripts/check_distribution.py --package "$packages/vouchfx.0.0.0-compatibility.nupkg" \
            --nuget-cache "$HOME/.nuget/packages"
          printf '<configuration><packageSources><clear/><add key="local" value="%s"/></packageSources></configuration>\n' \
            "$packages" > "$RUNNER_TEMP/compatibility-nuget.config"
          dotnet tool install vouchfx --version 0.0.0-compatibility \
            --tool-path "$tools" --configfile "$RUNNER_TEMP/compatibility-nuget.config"
          "$tools/vouchfx" --version
          expected_major="${EXPECTED_DOTNET%%.*}"
          suite="$RUNNER_TEMP/compatibility-runtime.e2e.yaml"
          cat > "$suite" <<YAML
          steps:
            - id: runtime-proof
              type: script.csharp
              code: |
                Console.WriteLine("RUNTIME=" + System.Environment.Version);
                if (System.Environment.Version.Major != $expected_major)
                    throw new Exception("Unexpected runtime: " + System.Environment.Version);
          YAML
          "$tools/vouchfx" validate "$suite"
          "$tools/vouchfx" run "$suite" --events "$RUNNER_TEMP/compatibility-events.jsonl" \
            --fail-on-env-error --fail-on-inconclusive --no-telemetry --no-decorations \
            | tee "$RUNNER_TEMP/compatibility-runtime.log"
          grep -F "RUNTIME=$expected_major." "$RUNNER_TEMP/compatibility-runtime.log"

  # Runtime-only roll-forward proof (the role the 9.0 and 10.0 lanes played for
  # the net8.0 tool before the move). Build and pack with the .NET 10 SDK, then
  # keep only the newer major's SDK and shared frameworks, so the installed
  # framework-dependent tool can start only by rolling forward.
  roll-forward:
    name: .NET ${{ matrix.dotnet }} roll-forward
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        dotnet: ['11.0']
    env:
      BUILD_DOTNET: '10.0'
      DOTNET_MULTILEVEL_LOOKUP: '0'
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure isolated SDK installation
        run: printf 'DOTNET_INSTALL_DIR=%s/dotnet-compatibility\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      # The .NET 10 SDK builds (global.json); the newer SDK is installed only for
      # its shared frameworks, which are all that remain once the tool runs.
      - name: Install isolated .NET SDKs
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            10.0.x
            ${{ matrix.dotnet }}.x

      - name: Test runtime-isolation guard safety
        shell: pwsh
        run: ./scripts/ci/test-select-dotnet-runtime.ps1

      - name: Require the build SDK and the two runtime lines only
        env:
          EXPECTED_DOTNET: ${{ matrix.dotnet }}
        run: |
          set -euo pipefail
          test "$(dirname "$(command -v dotnet)")" = "$DOTNET_INSTALL_DIR"
          sdk="$(dotnet --version)"
          [[ "$sdk" == "$BUILD_DOTNET".* ]]
          runtimes="$(dotnet --list-runtimes)"
          printf '%s\n' "$sdk" "$runtimes"
          while read -r _framework version _location; do
            [[ "$version" == "$BUILD_DOTNET".* || "$version" == "$EXPECTED_DOTNET".* ]]
          done <<< "$runtimes"

      - name: Build, pack and install the CLI with the .NET 10 SDK
        run: |
          set -euo pipefail
          packages="$RUNNER_TEMP/compatibility-packages"
          dotnet restore vouchfx.sln
          dotnet build vouchfx.sln -c Release --no-restore -warnaserror
          dotnet pack src/Cli/Vouchfx.Cli/Vouchfx.Cli.csproj -c Release --no-build \
            -p:PackageVersion=0.0.0-compatibility -o "$packages"
          python3 scripts/check_distribution.py --package "$packages/vouchfx.0.0.0-compatibility.nupkg" \
            --nuget-cache "$HOME/.nuget/packages"
          printf '<configuration><packageSources><clear/><add key="local" value="%s"/></packageSources></configuration>\n' \
            "$packages" > "$RUNNER_TEMP/compatibility-nuget.config"
          dotnet tool install vouchfx --version 0.0.0-compatibility \
            --tool-path "$RUNNER_TEMP/compatibility-tools" --configfile "$RUNNER_TEMP/compatibility-nuget.config"

      - name: Keep only the newer SDK and shared frameworks
        env:
          EXPECTED_DOTNET: '${{ matrix.dotnet }}'
        shell: pwsh
        run: ./scripts/ci/select-dotnet-runtime.ps1 -ExpectedDotnet $env:EXPECTED_DOTNET

      - name: Require the newer runtime only
        env:
          EXPECTED_DOTNET: ${{ matrix.dotnet }}
        run: |
          set -euo pipefail
          runtimes="$(dotnet --list-runtimes)"
          printf '%s\n' "$runtimes"
          [[ "$runtimes" == *Microsoft.NETCore.App* ]]
          [[ "$runtimes" == *Microsoft.AspNetCore.App* ]]
          while read -r _framework version _location; do
            [[ "$version" == "$EXPECTED_DOTNET".* ]]
          done <<< "$runtimes"

      # Run outside the checkout so its global.json (.NET 10 band) is not in scope.
      - name: Run the installed CLI on the newer runtime
        working-directory: ${{ runner.temp }}
        env:
          EXPECTED_DOTNET: ${{ matrix.dotnet }}
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/compatibility-tools"
          "$tools/vouchfx" --version
          expected_major="${EXPECTED_DOTNET%%.*}"
          suite="$RUNNER_TEMP/compatibility-runtime.e2e.yaml"
          cat > "$suite" <<YAML
          steps:
            - id: runtime-proof
              type: script.csharp
              code: |
                Console.WriteLine("RUNTIME=" + System.Environment.Version);
                if (System.Environment.Version.Major != $expected_major)
                    throw new Exception("Unexpected runtime: " + System.Environment.Version);
          YAML
          "$tools/vouchfx" validate "$suite"
          "$tools/vouchfx" run "$suite" --events "$RUNNER_TEMP/compatibility-events.jsonl" \
            --fail-on-env-error --fail-on-inconclusive --no-telemetry --no-decorations \
            | tee "$RUNNER_TEMP/compatibility-runtime.log"
          grep -F "RUNTIME=$expected_major." "$RUNNER_TEMP/compatibility-runtime.log"

  # build.yml keeps its existing CI lanes and check names. These lanes exercise
  # all Docker tests and the permanent memory gate with only the selected SDK
  # and runtime installed.
  docker:
    name: Docker integration .NET ${{ matrix.dotnet }}
    runs-on: ubuntu-22.04
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        dotnet: ['10.0']
    env:
      DOTNET_MULTILEVEL_LOOKUP: '0'
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      VOUCHFX_TOPOLOGY_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure isolated SDK and apphost roots
        run: |
          printf 'DOTNET_INSTALL_DIR=%s/dotnet-compatibility\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'DOTNET_ROOT_X64=%s/dotnet-compatibility\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install isolated .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ matrix.dotnet }}.x

      - name: Test runtime-isolation guard safety
        shell: pwsh
        run: ./scripts/ci/test-select-dotnet-runtime.ps1
      - name: Keep only the selected SDK and shared frameworks
        env:
          EXPECTED_DOTNET: '${{ matrix.dotnet }}'
        shell: pwsh
        run: ./scripts/ci/select-dotnet-runtime.ps1 -ExpectedDotnet $env:EXPECTED_DOTNET
      - name: Require selected SDK, runtimes and Docker
        env:
          EXPECTED_DOTNET: ${{ matrix.dotnet }}
        run: |
          set -euo pipefail
          [[ "$(dotnet --version)" == "$EXPECTED_DOTNET".* ]]
          runtimes="$(dotnet --list-runtimes)"
          printf '%s\n' "$runtimes"
          [[ "$runtimes" == *Microsoft.NETCore.App* ]]
          [[ "$runtimes" == *Microsoft.AspNetCore.App* ]]
          while read -r _framework version _location; do
            [[ "$version" == "$EXPECTED_DOTNET".* ]]
          done <<< "$runtimes"
          test "$(docker info --format '{{.OSType}}')" = linux
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install pinned workflow tools
        run: bash scripts/ci/install-workflow-tools.sh
      # Extract the exact, parser-verified script used by build.yml's
      # integration lane; keep its image pins, retry policy and diagnostics.
      - name: Pre-pull the integration lane's pinned images
        timeout-minutes: 25
        run: |
          set -euo pipefail
          PYTHONPATH=scripts/ci python -c 'from pathlib import Path; import sys; from docker_ci_support import extract_pull; Path(sys.argv[1]).write_bytes(extract_pull())' \
            "$RUNNER_TEMP/compatibility-pull.sh"
          bash "$RUNNER_TEMP/compatibility-pull.sh"
      - name: Restore and build
        run: |
          set -euo pipefail
          dotnet restore vouchfx.sln
          dotnet build vouchfx.sln -c Release --no-restore -warnaserror
      - name: Snapshot default-root DCP captures
        run: |
          python -B scripts/ci/collect_dcp_captures.py snapshot \
            --source "${XDG_DATA_HOME:-$HOME/.local/share}/vouchfx" \
            --state "$RUNNER_TEMP/dcp-capture-baseline.json"
      - name: Prepare first-attempt topology evidence
        id: topology
        run: |
          set -euo pipefail
          results="$RUNNER_TEMP/vouchfx-topology-acceptance"
          python -B scripts/assert-owned-environment-acceptance.py --prepare \
            --directory "$results" \
            --cli src/Cli/Vouchfx.Cli/bin/Release/net10.0/vouchfx.dll \
            --checkout-sha "$(git rev-parse HEAD)" --head-sha "$VOUCHFX_TOPOLOGY_PR_HEAD_SHA"
          printf 'VOUCHFX_TOPOLOGY_ACCEPTANCE_RESULTS=%s\n' "$results" >> "$GITHUB_ENV"
      - name: All Docker integration tests (requires=docker)
        id: tests
        run: |
          dotnet test vouchfx.sln -m:1 -c Release --no-build \
            --filter "requires=docker" --blame-crash --blame-crash-dump-type mini \
            --results-directory "$RUNNER_TEMP/docker-test-results"
      - name: Require owned-topology execution and closure
        if: always() && steps.topology.outcome == 'success'
        run: |
          python -B scripts/assert-owned-environment-acceptance.py \
            --directory "$VOUCHFX_TOPOLOGY_ACCEPTANCE_RESULTS" \
            --cli src/Cli/Vouchfx.Cli/bin/Release/net10.0/vouchfx.dll
      - name: Collect new DCP captures
        id: captures
        if: always() && steps.topology.outcome == 'success'
        env:
          VOUCHFX_CI_TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          python -B scripts/ci/collect_dcp_captures.py collect \
            --source "${XDG_DATA_HOME:-$HOME/.local/share}/vouchfx" \
            --state "$RUNNER_TEMP/dcp-capture-baseline.json" \
            --destination "$RUNNER_TEMP/dcp-captures" \
            --test-outcome "$VOUCHFX_CI_TEST_OUTCOME"
      - name: Retain Docker results and topology evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dotnet-${{ matrix.dotnet }}-docker-results
          path: |
            ${{ runner.temp }}/docker-test-results
            ${{ runner.temp }}/vouchfx-topology-acceptance
          if-no-files-found: error
          retention-days: 7
      - name: Retain collected DCP diagnostics
        if: always() && steps.captures.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dotnet-${{ matrix.dotnet }}-dcp-captures
          path: ${{ runner.temp }}/dcp-captures
          if-no-files-found: error
          retention-days: 7

  memory:
    name: Provider-closure memory gate .NET ${{ matrix.dotnet }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        dotnet: ['10.0']
    env:
      DOTNET_MULTILEVEL_LOOKUP: '0'
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure isolated SDK and apphost roots
        run: |
          printf 'DOTNET_INSTALL_DIR=%s/dotnet-compatibility\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'DOTNET_ROOT_X64=%s/dotnet-compatibility\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install isolated .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ matrix.dotnet }}.x

      - name: Test runtime-isolation guard safety
        shell: pwsh
        run: ./scripts/ci/test-select-dotnet-runtime.ps1
      - name: Keep only the selected SDK and shared frameworks
        env:
          EXPECTED_DOTNET: '${{ matrix.dotnet }}'
        shell: pwsh
        run: ./scripts/ci/select-dotnet-runtime.ps1 -ExpectedDotnet $env:EXPECTED_DOTNET
      - name: Require selected SDK and runtime only
        env:
          EXPECTED_DOTNET: ${{ matrix.dotnet }}
        run: |
          set -euo pipefail
          [[ "$(dotnet --version)" == "$EXPECTED_DOTNET".* ]]
          runtimes="$(dotnet --list-runtimes)"
          printf '%s\n' "$runtimes"
          [[ "$runtimes" == *Microsoft.NETCore.App* ]]
          while read -r _framework version _location; do
            [[ "$version" == "$EXPECTED_DOTNET".* ]]
          done <<< "$runtimes"
      - name: Build the provider-closure harness
        run: dotnet build tests/Vouchfx.Engine.Compilation.MemoryHarness -c Release -warnaserror
      - name: Run permanent 5000-iteration memory gate
        run: |
          set -euo pipefail
          dotnet run -c Release --no-build --project tests/Vouchfx.Engine.Compilation.MemoryHarness \
            -- --mode closure --iterations 5000 --threshold-bytes 2000000 \
            | tee "$RUNNER_TEMP/memory-closure.log"
      - name: Retain memory result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dotnet-${{ matrix.dotnet }}-memory-closure
          path: ${{ runner.temp }}/memory-closure.log
          if-no-files-found: error
          retention-days: 7

  tls:
    name: Native TLS .NET ${{ matrix.dotnet }}
    strategy:
      fail-fast: false
      matrix:
        dotnet: ['10.0']
    uses: ./.github/workflows/tls-transport-acceptance.yml
    with:
      reviewed_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      dotnet_sdk: ${{ matrix.dotnet }}
