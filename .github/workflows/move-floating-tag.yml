# .github/workflows/move-floating-tag.yml — maintains the CI-integration
# "convenience tier" floating tags consumers can reference without ever
# resolving a commit SHA themselves.
#
# BACKGROUND (README.md "CI integration with GitHub Actions" / "with GitLab
# CI"): the reusable workflow is normally consumed pinned to a full 40-char
# commit SHA — the correct, immutable choice for production, and unchanged by
# this file. But requiring EVERY adopter to hand-resolve a SHA before their
# first CI run is needless friction for a first try or a low-stakes internal
# repo. This workflow maintains a small set of floating tags that trade
# immutability for zero-setup convenience, exactly mirroring the pattern this
# repo already uses for its OWN non-release workflows' action references (see
# .github/dependabot.yml's header comment: "non-release workflows deliberately
# stay on floating major tags").
#
# TAGS MAINTAINED (v1.x line only — see "Decide the target floating tag"
# below for what happens outside it):
#   v1-alpha   moved to every v1.0.0-alpha.N / -beta.N pre-release (the dotted
#              identifier format this repo's release tags use, e.g.
#              v1.0.0-alpha.4 — see RELEASING.md). Other v1.0.0 pre-release
#              kinds (rc, preview, …) do NOT move it. Retired
#              (simply stops being updated — never deleted) the moment v1.0.0
#              GA ships; consumers should move to `v1` at that point.
#   v1         moved to every v1.y.z GA release once GA exists. Does not
#              exist yet (no v1.0.0 has shipped) — this workflow only starts
#              writing it once a clean (non-pre-release) v1.y.z tag appears.
#
# WHY `release: published`, NOT `push: tags` (RELEASING.md's own two-step
# flow: a pushed tag first creates a DRAFT release the maintainer reviews
# before publishing): gating on `published` guarantees a floating tag only
# ever moves to a release the maintainer actually confirmed — the same
# review gate every other artefact in this repo's release pipeline gets.
#
# WHY A SEPARATE WORKFLOW, NOT A JOB IN release.yml: keeps this decoupled
# from the signed/attested/OIDC-publishing pipeline entirely — no `needs:`
# coupling to that job graph, no risk of this file's failure modes touching
# anything security-sensitive there, and vice versa.
#
# WHY THE FORCE-PUSH IS SAFE HERE (and would NOT be for release.yml's tags):
# these are clearly-labeled, documented-as-mutable convenience refs — never
# used for the signed-artifact pipeline, never the SHA a production consumer
# is told to pin. Moving them is exactly the advertised behaviour, and this
# workflow's own run log is the audit trail for when/why each one moved.
#
# github.sha PITFALL (already called out and worked around identically in
# release.yml's "Determine release version" step): for a `release` event,
# github.sha is NOT reliably the tag's commit. This workflow checks out the
# release's own tag_name and reads the resulting commit via `git rev-parse
# HEAD` rather than ever trusting github.sha directly.

name: Move floating convenience tag

on:
  release:
    types: [published]

# Serialise runs: back-to-back release publications queue instead of racing, so
# publish order — not run-completion order — decides where the floating tags
# land (without this, the LAST-FINISHING of two concurrent runs would win and
# could force-move a tag to the OLDER release). cancel-in-progress stays FALSE
# deliberately: two adjacent releases can target DIFFERENT tags (a beta moves
# v1-alpha, a GA moves v1), and cancelling the in-flight older run would skip
# one tag move entirely. Residual (accepted): with 3+ releases inside one job
# window GitHub supersedes the middle PENDING run — re-run it manually if that
# ever happens; the run log is the audit trail.
concurrency:
  group: move-floating-tag
  cancel-in-progress: false

# Minimum workflow-level permission; the job below declares the write access
# it actually needs.
permissions:
  contents: read

jobs:
  move-tag:
    name: Move v1-alpha / v1 to the published release
    runs-on: ubuntu-latest
    # Canonical-repo guard: a fork's own release event must never move tags
    # here (mirrors release.yml's NuGet Trusted Publishing repository guard).
    if: github.repository == 'tomas-rampas/vouchfx'
    permissions:
      contents: write

    steps:
      - name: Checkout at the published tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 1

      - name: Decide the target floating tag and move it
        # SECURITY: the tag name is attacker-influenceable only in the sense
        # that anyone who can publish a release in THIS repo controls it —
        # already gated above to the canonical repo. Still passed through a
        # quoted env var and validated before use, matching release.yml's
        # "Determine release version" discipline (never interpolate directly
        # into a run: shell via ${{ }}).
        env:
          EV_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          tag="$EV_TAG"
          version="${tag#v}"

          # Semver-accurate validation: MAJOR.MINOR.PATCH, an optional pre-release
          # that MUST begin with '-', and optional '+build' metadata. Deliberately
          # STRICTER than release.yml's pattern (which also tolerates a '.'-led
          # suffix): a mistag like v1.2.3.rc.1 must fail here rather than slip
          # through with no '-' and be routed as a GA release, moving `v1`.
          if [[ ! "$version" =~ ^([0-9]+)\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$tag' is not a valid semver tag — refusing to move any floating tag."
            exit 1
          fi
          major="${BASH_REMATCH[1]}"

          # Routing decisions ignore '+build' metadata (semver: build metadata does
          # not affect precedence or release identity): v1.2.3+build.7 is still GA.
          base_version="${version%%+*}"

          if [[ "$major" != "1" ]]; then
            echo "Release '$tag' is not on the v1.x line (major=$major) — no floating tag is defined for it yet. Skipping."
            exit 0
          fi

          # v1-alpha tracks ONLY the alpha/beta pre-GA line (dotted identifiers,
          # the repo's release-tag format: v1.0.0-alpha.4) — an rc/preview/other
          # pre-release must never move it, per the README's documented contract.
          if [[ "$base_version" == 1.0.0-alpha.* || "$base_version" == 1.0.0-beta.* ]]; then
            target_tag="v1-alpha"
          elif [[ "$base_version" != *-* ]]; then
            target_tag="v1"
          else
            echo "Release '$tag' is a pre-release v1-alpha does not track — v1-alpha follows only v1.0.0-alpha.*/-beta.*, and v1 only tracks GA releases. Skipping."
            exit 0
          fi

          # Never trust github.sha for a release event (see file header) —
          # resolve the real commit from the checkout above, now sitting at
          # the release's own tag.
          resolved_sha="$(git rev-parse HEAD)"

          echo "Moving '$target_tag' -> $resolved_sha (release $tag)"
          git push --force origin "${resolved_sha}:refs/tags/${target_tag}"
          echo "Moved '$target_tag' to $resolved_sha (release $tag)."
