# .github/workflows/move-floating-tag.yml — maintains the CI-integration
# "convenience tier" floating tags consumers can reference without ever
# resolving a commit SHA themselves.
#
# BACKGROUND (docs/ci-integration.md, "The floating convenience tags"): the
# reusable workflow is normally consumed pinned to a full 40-char commit SHA —
# the correct, immutable choice for production, and unchanged by this file. But
# requiring EVERY adopter to hand-resolve a SHA before their first CI run is
# needless friction for a first try or a low-stakes internal repo. This workflow
# maintains a small set of floating tags that trade immutability for zero-setup
# convenience, exactly mirroring the pattern this repo already uses for its OWN
# non-release workflows' action references (see .github/dependabot.yml's header
# comment: "non-release workflows deliberately stay on floating major tags").
#
# TAGS MAINTAINED (v1.x line only — see "Decide the target floating tag"
# below for what happens outside it):
#   v1-alpha   moved to every v1.0.0-alpha.N / -beta.N pre-release (the dotted
#              identifier format this repo's release tags use, e.g.
#              v1.0.0-alpha.4 — see RELEASING.md). Retired (simply stops being
#              updated — never deleted) once the line moves on to release
#              candidates; consumers should move to `v1-rc` at that point.
#   v1-rc      moved to every v1.0.0-rc.N release candidate. Retired the moment
#              v1.0.0 GA ships; consumers should move to `v1` at that point.
#   v1         moved to each v1.y.z GA release once GA exists, after that
#              release's run has published it. Created by the first GA
#              release (v1.0.0).
# In each line, a release run leaves the tag alone when the tag is already on a
# newer release of that line (the no-downgrade guard below).
#
# WHY EACH PRE-GA LINE GETS ITS OWN TAG, rather than one tag absorbing every
# pre-release: a consumer who pinned `v1-alpha` chose the alpha line. Silently
# force-moving them onto a release candidate changes the engine under them
# without a ref change on their side, and leaves the tag name describing
# something it no longer points at. Separate tags make the move an opt-in edit.
#
# WHY THIS RUNS LAST IN release.yml, NOT ON `release: published`: a floating tag
# is what consumers resolve (`vouchfx-run.yml@v1`), so moving it at once on
# publication put `v1` on a release before that release's Docker gate, smoke
# tests, signing and publication had passed. release.yml now calls this
# workflow as its last job (`move-floating-tag`), behind `publish-release` and
# `publish-marketplace` through `needs`, with no status-check function in its
# `if`. A release run that fails, is cancelled or is skipped before then does
# not start this workflow, so the floating tags are expected to stay where they
# were. The contract tests check the wiring, not a live run.
#
# LIMIT: this file cannot stop an older route. For a `release` event GitHub runs
# the workflow files of the tagged commit. The release tags made before this
# change, from v1.0.0-alpha.6 on, carry the old version of this file
# (`on: release: types: [published]`), which moves the floating tag at once,
# with no gate and no guard. A release created or re-published for one of
# those tags, or tagged on a commit that does not contain this change, still
# takes that route. Nothing in this change can prevent it.
#
# WHY A REUSABLE WORKFLOW AND NOT STEPS IN release.yml: the write access this
# needs (`contents: write`, to move a tag) stays in this file's job, and
# release.yml's calling job holds only that one permission. Nothing from the
# signing and publishing jobs (OIDC token, secrets) reaches it: the caller maps
# no secrets. The two files are tied by the `needs` edge and by the inputs below.
#
# INPUTS ON THE CALLED PATH (`workflow_call`):
#   tag           the release tag the run published, as release.yml names it.
#   expected_sha  the commit the release run tested (github.sha there).
# A non-empty `expected_sha` is what marks the called path. It must be 40
# lower-case hex characters, else the job fails and nothing moves. The two
# guards below run when it is set, and nothing here tells the paths apart by
# `github.event_name`: in a called workflow that is the caller's event.
#   Commit guard      the commit the tag resolves to must equal `expected_sha`.
#                     A tag moved after the run started fails the job.
#   No-downgrade guard  compares this release with the release the floating tag
#                     is on now. The remote tags are read with
#                     `git ls-remote --tags origin`, and the version tags of the
#                     same line on the floating tag's commit are found (peeled
#                     `^{}` entries for annotated tags). If the highest of them
#                     is newer than this release, nothing moves and the job
#                     succeeds with a warning. Tag moves follow run-completion
#                     order, so a late "Re-run failed jobs" on an older release
#                     run must not pull a floating tag back. If the floating tag
#                     does not exist, the move goes ahead. If it is on a commit
#                     with no version tag of its line, or the tags cannot be
#                     read, the job fails and nothing moves (a manual run is the
#                     route then). Versions are compared with `sort -V`
#                     (v1.4.10 is newer than v1.4.9), ignoring '+build'.
#
# WHY workflow_dispatch EXISTS TOO: it is the manual recovery route. It is for
# a floating tag introduced after a release was published (the `v1-rc` tag was
# added while v1.0.0-rc.1 was already out), for a run that was cancelled or
# superseded, and for a deliberate move backwards. It has no `expected_sha`,
# so neither guard runs on it and it may move a tag to an older release.
# Both paths check that the release for the tag exists and is not a draft.
#
# WHY THE FORCE-PUSH IS SAFE HERE (and would NOT be for release.yml's tags):
# these are clearly-labeled, documented-as-mutable convenience refs — never
# used for the signed-artifact pipeline, never the SHA a production consumer
# is told to pin. Moving them is exactly the advertised behaviour, and this
# workflow's own run log is the audit trail for when/why each one moved.
#
# github.sha: not used here for the tag's commit. In a called workflow
# `github.sha` is the caller's commit. release.yml passes it as `expected_sha`,
# and GitHub documents it as the tag's commit for a `release` event. This
# workflow checks out the release tag and reads the resulting commit with
# `git rev-parse HEAD`. On the called path that commit must equal `expected_sha`.

name: Move floating convenience tag

on:
  workflow_call:
    inputs:
      tag:
        description: >-
          Release tag the calling run published (e.g. v1.0.0-rc.1).
        required: true
        type: string
      expected_sha:
        description: >-
          Commit the calling release run tested. The tag must resolve to it.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Release tag to route (e.g. v1.0.0-rc.1). Must already exist and
          belong to a PUBLISHED (non-draft) release — the job refuses drafts.
        required: true
        type: string

# Minimum workflow-level permission; the job below declares the write access
# it actually needs.
permissions:
  contents: read

jobs:
  move-tag:
    name: Move v1-alpha / v1-rc / v1 to the published release
    runs-on: ubuntu-latest
    # Canonical-repo guard: a fork's own run must never move tags here (mirrors
    # release.yml's NuGet Trusted Publishing repository guard).
    if: github.repository == 'tomas-rampas/vouchfx'
    permissions:
      contents: write
    # Serialise tag moves across runs, on both triggers. The group is set on this
    # job, not at workflow level. The reusable-workflows docs
    # (docs.github.com/en/actions/reference/workflows-and-actions/reusable-workflows)
    # warn against using the same `jobs.<job_id>.concurrency.group` value in the
    # called and the caller workflows (with `cancel-in-progress: true`, or when it
    # is built from `github.workflow`), which implies job-level concurrency inside
    # a called workflow. That is expected to work here; it has not been seen on
    # GitHub yet. The calling job in release.yml sets no `concurrency` of its own,
    # so the group is not shared. cancel-in-progress is FALSE here so that
    # a running move is never cancelled. Tag moves follow run-completion order. Two
    # adjacent releases can target DIFFERENT tags, so cancelling one would skip a
    # move. Residual (accepted): GitHub keeps at most one PENDING job per group by
    # default, so with three moves at once the middle pending one is superseded.
    # Re-run it (the no-downgrade guard still applies to a re-run) or use
    # workflow_dispatch (no guard: a manual run may move a tag backwards). The run
    # log is the audit trail.
    concurrency:
      group: move-floating-tag
      cancel-in-progress: false

    env:
      # Single resolution point for both trigger shapes: `inputs.tag` is the
      # called path's `tag` and the manual run's `tag`. Every step below reads
      # this, so neither path can drift from the other.
      EV_TAG: ${{ inputs.tag }}
      # Empty on a manual run. Non-empty marks the called path (see the header).
      EXPECTED_SHA: ${{ inputs.expected_sha }}

    steps:
      - name: Checkout at the published tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Reads the job-level EV_TAG rather than repeating its expression:
          # one resolution point, so this step cannot drift from the two below.
          # Full ref: a short name makes actions/checkout prefer a branch of the
          # same name over the tag.
          ref: refs/tags/${{ env.EV_TAG }}
          fetch-depth: 1

      # Both paths check the release explicitly rather than trusting the input:
      # a floating tag only ever moves to a release the maintainer has published.
      - name: Refuse a missing or draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if ! draft="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${EV_TAG}" --jq '.draft' 2>/dev/null)"; then
            echo "::error::No release found for tag '${EV_TAG}'. A floating tag only ever moves to a published release."
            exit 1
          fi

          if [[ "$draft" != "false" ]]; then
            echo "::error::Release '${EV_TAG}' is still a DRAFT. Publish it first — floating tags only move to releases the maintainer has confirmed."
            exit 1
          fi

          echo "Release '${EV_TAG}' is published — proceeding."

      - name: Decide the target floating tag and move it
        # SECURITY: the tag name is attacker-influenceable only in the sense
        # that anyone who can create a release (or run a workflow) in THIS
        # repo controls it — already gated above to the canonical repo. Still
        # passed through a quoted env var and validated before use, matching
        # release.yml's "Determine release version" discipline (never
        # interpolate directly into a run: shell via ${{ }}).
        run: |
          set -euo pipefail

          # The called path is marked by a non-empty EXPECTED_SHA, so a malformed
          # value must stop here rather than switch the guards off.
          if [[ -n "$EXPECTED_SHA" && ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::expected_sha must be 40 lower-case hex characters — refusing to move any floating tag."
            exit 1
          fi

          tag="$EV_TAG"
          version="${tag#v}"

          # Semver-accurate validation: MAJOR.MINOR.PATCH, an optional pre-release
          # that MUST begin with '-', and optional '+build' metadata. Deliberately
          # STRICTER than release.yml's pattern (which also tolerates a '.'-led
          # suffix): a mistag like v1.2.3.rc.1 must fail here rather than slip
          # through with no '-' and be routed as a GA release, moving `v1`.
          if [[ ! "$version" =~ ^([0-9]+)\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$tag' is not a valid semver tag — refusing to move any floating tag."
            exit 1
          fi
          major="${BASH_REMATCH[1]}"

          # Routing decisions ignore '+build' metadata (semver: build metadata does
          # not affect precedence or release identity): v1.2.3+build.7 is still GA.
          base_version="${version%%+*}"

          if [[ "$major" != "1" ]]; then
            echo "Release '$tag' is not on the v1.x line (major=$major) — no floating tag is defined for it yet. Skipping."
            exit 0
          fi

          # Each pre-GA line gets its own tag, matched on the dotted identifier
          # format this repo's release tags use (v1.0.0-alpha.4, v1.0.0-rc.1 —
          # see RELEASING.md). Both are scoped to the 1.0.0 pre-GA line only:
          # a post-GA pre-release (v1.1.0-rc.1) has no floating tag defined and
          # falls through to the skip below, exactly as it does today. Any other
          # pre-release kind (preview, nightly, …) also skips rather than being
          # routed somewhere approximate.
          # `line_pattern` selects the releases that share the target tag's line,
          # for the no-downgrade guard below (versions without a leading 'v' or
          # '+build').
          if [[ "$base_version" == 1.0.0-alpha.* || "$base_version" == 1.0.0-beta.* ]]; then
            target_tag="v1-alpha"
            line_pattern='^1\.0\.0-(alpha|beta)\.'
          elif [[ "$base_version" == 1.0.0-rc.* ]]; then
            target_tag="v1-rc"
            line_pattern='^1\.0\.0-rc\.'
          elif [[ "$base_version" != *-* ]]; then
            target_tag="v1"
            line_pattern='^1\.[0-9]+\.[0-9]+$'
          else
            echo "Release '$tag' is a pre-release no floating tag tracks — v1-alpha follows v1.0.0-alpha.*/-beta.*, v1-rc follows v1.0.0-rc.*, and v1 only tracks GA releases. Skipping."
            exit 0
          fi

          # Resolve the commit from the checkout above, which is at the release's
          # own tag. On the called path the commit guard below compares it with
          # EXPECTED_SHA.
          resolved_sha="$(git rev-parse HEAD)"

          # Commit guard (called path only: EXPECTED_SHA is set by release.yml).
          # The release run tested EXPECTED_SHA; a tag that now resolves
          # elsewhere must not carry a floating tag to untested code.
          if [[ -n "$EXPECTED_SHA" && "$resolved_sha" != "$EXPECTED_SHA" ]]; then
            echo "::error::Release tag '$tag' resolves to $resolved_sha, but the release run tested $EXPECTED_SHA — refusing to move '$target_tag'."
            exit 1
          fi

          # No-downgrade guard (called path only). Tag moves follow run-completion
          # order, so a late re-run of an older release run must not pull the
          # floating tag back. The rule: compare this release with the release the
          # floating tag is on now, read from the remote tags with git only. A
          # manual run skips this on purpose: moving a tag backwards is the
          # documented recovery route. Failing to read the tags, or to place the
          # floating tag on a release, stops the job rather than guessing.
          if [[ -n "$EXPECTED_SHA" ]]; then
            if ! listing="$(git ls-remote --tags origin)"; then
              echo "::error::Could not read the remote tags — refusing to move '$target_tag' without the no-downgrade check."
              exit 1
            fi

            # One line per tag: "<name> <commit>". An annotated tag is listed
            # twice; its peeled `^{}` entry holds the commit, so it wins.
            commits="$(printf '%s\n' "$listing" | awk -F'\t' '
              {
                ref = $2; sub(/^refs\/tags\//, "", ref)
                if (ref ~ /\^\{\}$/) { sub(/\^\{\}$/, "", ref); peeled[ref] = $1 } else { direct[ref] = $1 }
                seen[ref] = 1
              }
              END { for (n in seen) print n, ((n in peeled) ? peeled[n] : direct[n]) }')"

            # `($1 "")` here and `($2 "")` below force string comparisons: awk
            # compares two values that both look numeric (such as an all-digit
            # SHA) as numbers.
            floating_sha="$(awk -v t="$target_tag" '($1 "") == t { print $2 }' <<<"$commits")"

            if [[ -n "$floating_sha" ]]; then
              current=()
              while read -r other; do
                other="${other#v}"
                other="${other%%+*}"
                if [[ "$other" =~ $line_pattern ]]; then
                  current+=("$other")
                fi
              done < <(awk -v c="$floating_sha" '($2 "") == c { print $1 }' <<<"$commits")

              if [[ "${#current[@]}" -eq 0 ]]; then
                echo "::error::'$target_tag' is on $floating_sha, which carries no release tag of its line, so this workflow cannot tell which release '$target_tag' is on — refusing to move it for '$tag'. Run this workflow by hand (workflow_dispatch) if the move is intended."
                exit 1
              fi

              # sort -V orders numeric fields numerically (1.4.10 after 1.4.9).
              current_version="$(printf '%s\n' "${current[@]}" | sort -V | tail -n 1)"
              newest="$(printf '%s\n%s\n' "$current_version" "$base_version" | sort -V | tail -n 1)"
              if [[ "$newest" != "$base_version" ]]; then
                echo "::warning::'$target_tag' is already on the newer release v$current_version — leaving it there for '$tag'."
                exit 0
              fi
            fi
          fi

          echo "Moving '$target_tag' -> $resolved_sha (release $tag)"
          git push --force origin "${resolved_sha}:refs/tags/${target_tag}"
          echo "Moved '$target_tag' to $resolved_sha (release $tag)."
