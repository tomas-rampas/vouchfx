# .github/workflows/pages.yml — vouchfx project site (GitHub Pages)
#
# Publishes the static landing page in `site/` PLUS the repository's markdown
# design docs and delivery plan, rendered to styled HTML by
# `scripts/build_site.py`. The markdown files stay the single source of truth;
# this regenerates their HTML on every run, so the published docs never drift.
#
# One-time setup (repository owner): Settings → Pages → Build and deployment →
# Source: "GitHub Actions".

name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/**'
      - 'plan/**'
      - 'README.md'
      - 'CLAUDE.md'
      - 'scripts/build_site.py'
      - '.github/workflows/pages.yml'
  # Manual runs (any branch) for previewing before a change reaches main.
  workflow_dispatch:

# Allow the deploy job to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One concurrent deployment; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: pip install markdown pygments

      - name: Build site (landing page + rendered docs)
        run: python scripts/build_site.py _site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
