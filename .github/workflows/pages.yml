# .github/workflows/pages.yml — vouchfx project site (GitHub Pages)
#
# Publishes the static marketing/architecture site in `site/` to GitHub Pages.
# The site is plain HTML/CSS — no build step — so the job simply uploads the
# directory as a Pages artifact and deploys it.
#
# One-time setup (repository owner): Settings → Pages → Build and deployment →
# Source: "GitHub Actions". After that, every push to the default branch that
# touches `site/` (or a manual run) publishes the site.

name: Pages

on:
  push:
    # `main` is the production publish. The feature branch is included so the
    # site can be previewed on the live Pages URL before merge — drop it once
    # this lands on main.
    branches: [main, claude/confident-mendel-4MOmW]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Allow the deploy job to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One concurrent deployment; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Enable Pages (Actions build) via the API on first run, so no manual
          # Settings -> Pages toggle is required. Needs `pages: write` (granted).
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
