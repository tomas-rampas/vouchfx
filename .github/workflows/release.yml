# .github/workflows/release.yml — vouchfx signed-release pipeline
# =============================================================================
# Release manifest — signing (cosign keyless), SBOM (CycloneDX),
# SLSA build provenance (actions/attest-build-provenance),
# self-contained per-OS executables + installer skeletons.
#
# Trigger
# -------
# Manual dispatch only (`workflow_dispatch`). No GitHub Release, tag push,
# branch push or pull request starts this workflow. No tag, Release, package,
# attestation or cosign signature is made before the run's tests and builds
# have passed. The build jobs still sign or notarise the installers where those
# secrets are configured, and the run artefacts are visible as in any run.
# Inputs:
#   mode     validate (default)  Any ref. Tests and builds everything. Publishes,
#                                attests and cosign-signs nothing, creates no
#                                Release, draft or tag, and never asks for the
#                                `release` environment.
#            rehearse            `main` only, with `commit` equal to the run's
#                                commit. As validate, then `publish-release`
#                                asks for the `release` environment, creates a
#                                draft Release, uploads the assets to it, runs
#                                the NuGet token exchange, and deletes the draft.
#                                It pushes nothing, publishes nothing and makes
#                                no tag, attestation or cosign signature.
#            publish             `main` only, with `commit` equal to the run's
#                                commit. The real release.
#   version  The semver to build, without a leading "v" (e.g. 1.5.0, 1.5.0-rc.1).
#            It becomes the engine version of the packaged tool. Every mode
#            refuses upper-case letters in the pre-release and any 0.0.0-
#            version. validate takes the next release version followed by
#            -validate.N. rehearse needs X.Y.Z-rehearsal.N. publish refuses a
#            pre-release whose first identifier is `rehearsal` or `validate`,
#            and a stable version below a published stable Release.
#   commit   The full SHA of the commit to release; required by rehearse and
#            publish. It must equal the run's commit (the head of `main` when the
#            run started), which catches a typo or a `main` that has moved on.
# The first job, `prepare`, refuses a request that breaks these rules. In
# publish mode it also requires the newest CHANGELOG.md heading and the
# VouchfxEngineVersion fallback in Directory.Build.props to equal `version`,
# and the CHANGELOG.md section for `version` to be usable as release notes
# (present, not empty, at most 100,000 characters).
#
# Order of publication (publish mode)
# -----------------------------------
# `publish-release` creates a draft Release whose target is the run's full
# commit SHA, uploads the assets to it, pushes the packages to NuGet.org, and
# only then publishes the draft, which is expected to create the lightweight
# tag v<version> at that commit. It then checks that the tag resolves to the
# run's commit. NuGet
# goes before publication of the Release because it is the step most likely to
# fail, and a draft is not public. `publish-marketplace` and `move-floating-tag`
# follow. Nothing in this run pushes a tag with git.
#
# Release gate
# ------------
# Attestation and cosign signing (`sign-and-attest`) and publication
# (`publish-release`, and so `publish-marketplace`) wait for the Docker
# integration lane (the `docker-integration` job) to pass on this run's commit.
# So does the move of the floating tags (`move-floating-tag`, the last job).
# `sign-and-attest` also waits for both smoke-test jobs. Attestations and
# signatures are made before the `release` environment approval: the approval
# protects the draft Release and the NuGet push, not the signing identity.
# The build jobs are not gated: build-msi, build-deb and build-pkg still sign or
# notarise at build time, where those secrets are configured, whatever the
# lane's result. With the lane, a run is expected to take about 80 minutes, plus
# the wait for approval of the `release` environment. The comment on that job
# lists what is and is not withheld.
#
# Keyless signing and publishing model — no long-lived private key or API key stored as a secret
# --------------------------------------------------------------------------------------------------
# Attestation and cosign signing run in publish mode only: an attestation or a
# Rekor entry is a permanent public record, and one made in another mode would
# verify as if it came from a release. They are made before the `release`
# environment approval (see `sign-and-attest`).
#   1. SLSA provenance (actions/attest-build-provenance, SHA-pinned below)
#      GitHub OIDC token → signed attestation stored with the repo.
#      Verify:  gh attestation verify <file> --repo tomas-rampas/vouchfx
#
#   2. cosign keyless (sigstore/cosign-installer, SHA-pinned below)
#      GitHub OIDC token → Fulcio short-lived cert → Rekor transparency log.
#      Verify:  cosign verify-blob <file> \
#                 --bundle <file>.cosign.bundle \
#                 --certificate-identity-regexp \
#                   '^https://github\.com/tomas-rampas/vouchfx/\.github/workflows/release\.yml@.*' \
#                 --certificate-oidc-issuer https://token.actions.githubusercontent.com
#
#   What these two checks prove: the `gh` command shows only that some
#   workflow run in this repository attested the file, on any ref; the
#   `cosign` command shows that some run of release.yml in this repository
#   signed it, on any branch or tag and from any trigger. Older manual runs of
#   release.yml on main also made attestations (not cosign signatures), with
#   the same workflow, ref and trigger as a release made by this flow. For a
#   release made by this flow, also pin the commit the tag points at. A pass
#   still accepts a publish run at that commit that failed after signing:
#      gh attestation verify <file> --repo tomas-rampas/vouchfx \
#        --signer-workflow github.com/tomas-rampas/vouchfx/.github/workflows/release.yml \
#        --source-ref refs/heads/main --source-digest <full commit SHA of the tag>
#      cosign verify-blob <file> --bundle <file>.cosign.bundle \
#        --certificate-identity https://github.com/tomas-rampas/vouchfx/.github/workflows/release.yml@refs/heads/main \
#        --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#        --certificate-github-workflow-trigger workflow_dispatch \
#        --certificate-github-workflow-sha <full commit SHA of the tag>
#
#   3. NuGet Trusted Publishing (NuGet/login, SHA-pinned)
#      single-use GitHub OIDC token → nuget.org token exchange → short-lived
#      API key (valid ~1 hour, reusable within that window, minted
#      immediately before push).
#      Gated by a Trusted Publishing policy on nuget.org (Package Owner
#      "Tomas.R"): Repository tomas-rampas/vouchfx, Workflow File
#      release.yml; RELEASING.md records its Environment setting. The job
#      that exchanges the token runs in the `release` environment. No
#      NUGET_API_KEY secret is stored. Rehearse mode runs the exchange and
#      pushes nothing.
#
#      Publishes six packages per release, all built into artifacts/nuget/:
#        - vouchfx                       (CLI global tool — primary distribution)
#        - Vouchfx.Sdk                  (frozen v1 provider contract)
#        - Vouchfx.Sdk.Testing          (out-of-repo provider test harness)
#        - Vouchfx.Engine.Abstractions  (Verdict/StepOutcome/ScriptGlobalVariables)
#        - Vouchfx.Engine.Authoring     (YAML parser + AST builder)
#        - Vouchfx.Engine.Compilation   (DocumentValidator, RoslynScriptCompiler)
#      A bounded NuGet index lookup skips versions already public before
#      upload; --skip-duplicate handles races. Published packages are IMMUTABLE. A bad artifact is never
#      fixed by re-running or re-releasing the same version: ship a new patch
#      version instead.
#      PRE-FLIGHT before the first release that publishes the five new SDK
#      package IDs: confirm on nuget.org that the Trusted Publishing policy
#      permits first-time creation of new IDs from this repo/workflow, and
#      that no third party has registered or prefix-reserved the IDs. A 403
#      on one ID publishes nothing for that ID, and the Release stays a draft;
#      fix the policy and use "Re-run failed jobs" on the same run — the
#      presence check and --skip-duplicate complete the missing pushes. A new
#      dispatch of the same version is refused by `prepare` once any package
#      of it is on NuGet.org. A new patch version is only needed if a
#      genuinely broken artifact already shipped.
#
# Secret-gated optional steps (SKIPPED, not failed, when secret is absent)
# -------------------------------------------------------------------------
#   Authenticode (Windows)  CODESIGN_PFX_BASE64 + CODESIGN_PFX_PASSWORD
#   GPG signing (nupkg)     GPG_SIGNING_KEY + GPG_PASSPHRASE (publish mode only)
#   Apple notarisation      APPLE_ID + APPLE_TEAM_ID + APPLE_APP_SPECIFIC_PASSWORD
#   VS Code Marketplace     VSCE_PAT (publisher "vouchfx" — see #121; until the
#                           secret exists the extension ships only as the .vsix
#                           attached to the GitHub Release, and the skip is
#                           announced loudly in the run log)
#
# DCP distribution contract
# --------------------------------------------------------------------------
# The .NET 10 tool carries full native trees for win-x64, linux-x64, osx-x64 and
# osx-arm64; archives/installers carry only their own RID. At topology start,
# DcpPathResolver selects the version-matched bundle beside the HOST assembly
# before stale build-cache metadata. ASPIRE_DCP_PATH remains an explicit override.
# Source builds and custom AppHosts retain their own metadata/cache resolution.
# No checkout or Aspire restore is a prerequisite for an installed candidate.
# Native-tree checks, size checks, platform launch preflights and a clean-cache
# installed-tool Docker smoke gate every public channel. PublishSingleFile stays off:
# provider discovery requires usable Assembly.Location values.
# =============================================================================

name: Release (signed, provenance)

on:
  # The only trigger. The header describes the three modes.
  workflow_dispatch:
    inputs:
      mode:
        description: "validate: test and build only. rehearse: also draft, upload and delete (main only). publish: release (main only)."
        required: true
        default: validate
        type: choice
        options:
          - validate
          - rehearse
          - publish
      version:
        description: "Version without the leading v. publish: the release version. rehearse: X.Y.Z-rehearsal.N. validate: the next release version followed by -validate.N, for example 1.5.0-validate.1. Every mode refuses upper-case letters in the pre-release and any 0.0.0- version (below every provider's minimum engine version)."
        required: true
        type: string
      commit:
        description: "Full SHA of the commit to release (rehearse and publish): the head of main"
        required: false
        default: ""
        type: string

# Minimum workflow-level permissions; each job declares its own overrides.
permissions:
  contents: read

# Rehearse and publish runs on refs/heads/main share one group, so two of them
# never run at once. Every other run (validate, or a rehearse or publish
# dispatch from another ref, which `prepare` refuses) has a group of its own,
# so it cannot take the place of a pending release run. Never cancel a run
# mid-flight. GitHub keeps at most one pending run per group: a third rehearse
# or publish dispatch on main is expected to replace the one still waiting.
concurrency:
  group: ${{ (inputs.mode == 'rehearse' || inputs.mode == 'publish') && github.ref == 'refs/heads/main' && 'release-publish' || format('release-run-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  # ===========================================================================
  # prepare
  # Checks the dispatch request before anything is built, and is the single
  # source of the version and tag for every later job. In every mode: `version`
  # is strict semver (MAJOR.MINOR.PATCH, optional pre-release led by "-" whose
  # numeric parts have no leading zero, no "+build", no "."-led suffix), its
  # pre-release has no upper-case letter, and it does not start with 0.0.0-.
  # In rehearse and publish: the run is on refs/heads/main of
  # tomas-rampas/vouchfx, `commit` is the run's own commit, and the tag, a
  # published Release and every NuGet package ID of this version are all
  # absent. In publish: a stable version is not below a published stable
  # Release, CHANGELOG.md and Directory.Build.props are prepared for the
  # version, and the CHANGELOG.md section for it can be used as release notes.
  # It reads with the job token only; no secrets, no environment.
  # ===========================================================================
  prepare:
    name: Check the release request
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      version: ${{ steps.request.outputs.version }}
      tag: ${{ steps.request.outputs.tag }}
      mode: ${{ steps.request.outputs.mode }}

    steps:
      - name: Checkout (release metadata and helper scripts)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Test the release helper scripts
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/tests -p test_release_metadata.py -v
          python3 -m unittest discover -s scripts/tests -p test_check_nuget_presence.py -v

      # SECURITY: the dispatch inputs are passed through env: and used only as
      # quoted shell variables, never interpolated into run: via ${{ }}.
      - name: Check the version, ref, commit and what already exists
        id: request
        env:
          MODE: ${{ inputs.mode }}
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$MODE" in
            validate|rehearse|publish) ;;
            *) echo "::error::Unknown mode '$MODE'."; exit 1 ;;
          esac

          # Strict semver: MAJOR.MINOR.PATCH and an optional pre-release that
          # begins with "-". A numeric pre-release part has no leading zero
          # (1.2.3-01 is refused). No "+build" and no "."-led suffix (1.2.3.rc.1
          # would otherwise be released as a GA version).
          number='(0|[1-9][0-9]*)'
          part='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          semver="^${number}\.${number}\.${number}(-${part}(\.${part})*)?$"
          # The value is printed in shell-quoted form (`printf '%q'`), so that a
          # newline in it cannot start a line of its own, which the runner
          # would read as a workflow command.
          if [[ ! "$VERSION" =~ $semver ]]; then
            echo "::error::Refusing to release: version $(printf '%q' "$VERSION") is not MAJOR.MINOR.PATCH with an optional '-' pre-release (the value is shown shell-quoted)."
            exit 1
          fi
          tag="v$VERSION"

          # Upper-case letters in the pre-release are refused in every mode.
          # The .NET tool store keeps the version in lower case: on Linux with
          # the .NET 10 SDK, a probe tool packed as 1.0.0-RC.1 was installed
          # under .store/<tool>/1.0.0-rc.1/. The packaged-tool smoke test and
          # the Linux preflight build that path from the version as given, so
          # on Linux they are expected to look in the wrong place and fail
          # after the build. NuGet compares versions without regard to case,
          # so the lower-case form loses nothing. Only the pre-release can
          # hold letters once the version is strict semver.
          if [[ "$VERSION" != "${VERSION,,}" ]]; then
            echo "::error::Refusing '$VERSION': its pre-release has upper-case letters. Use '${VERSION,,}' instead. The .NET tool store keeps the version in lower case, so the smoke tests would fail after the build."
            exit 1
          fi
          # 0.0.0- versions are refused in every mode. They are below every
          # provider's minimum engine version, so the packaged-tool smoke test
          # would fail them after the build.
          if [[ "$VERSION" == 0.0.0-* ]]; then
            echo "::error::Refusing '$VERSION': a 0.0.0- version is below every provider's minimum engine version, so the packaged-tool smoke test would fail it after the build. For validate use the next release version followed by -validate.N, for example 1.5.0-validate.1; for rehearse, the next release version followed by -rehearsal.N."
            exit 1
          fi

          # A rehearsal makes a draft with placeholder notes. If its clean-up
          # failed, the draft would stay. Only a version with a -rehearsal.N
          # pre-release may be rehearsed, and publish refuses that pre-release,
          # so a later publish cannot reuse the version.
          if [[ "$MODE" == "rehearse" && ! "$VERSION" =~ ^${number}\.${number}\.${number}-rehearsal\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::A rehearsal must use a version of the form X.Y.Z-rehearsal.N (for example the next release version followed by -rehearsal.1), not '$VERSION'."
            exit 1
          fi
          # Publish refuses the forms for validation and rehearsal.
          if [[ "$MODE" == "publish" ]]; then
            pre="${VERSION#*-}"
            if [[ "$VERSION" == *-* && "$pre" =~ ^(rehearsal|validate)(\.|$) ]]; then
              echo "::error::Refusing to publish '$VERSION': versions with a -rehearsal or -validate pre-release are reserved for rehearsal and validation."
              exit 1
            fi
          fi

          if [[ "$MODE" != "validate" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
              echo "::error::Mode '$MODE' runs only on refs/heads/main; this run is on '$GITHUB_REF'."
              exit 1
            fi
            if [[ ! "$COMMIT" =~ ^[0-9a-f]{40}$ || "$COMMIT" != "$GITHUB_SHA" ]]; then
              echo "::error::Input commit $(printf '%q' "$COMMIT") must be the full SHA of this run's commit, $GITHUB_SHA (the head of main when the run started; the value is shown shell-quoted)."
              exit 1
            fi
            if [[ "$GITHUB_REPOSITORY" != "tomas-rampas/vouchfx" ]]; then
              echo "::error::Mode '$MODE' runs only in tomas-rampas/vouchfx, not '$GITHUB_REPOSITORY'."
              exit 1
            fi

            if ! listing="$(git ls-remote --tags origin)"; then
              echo "::error::Could not read the remote tags."
              exit 1
            fi
            if awk -F'\t' -v ref="refs/tags/$tag" '$2 == ref || $2 == ref "^{}" { found = 1 } END { exit !found }' <<<"$listing"; then
              echo "::error::Tag '$tag' already exists. A version is released once."
              exit 1
            fi

            if ! published="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[] | select(.draft == false) | .tag_name')"; then
              echo "::error::Could not read the releases."
              exit 1
            fi
            if grep -Fxq -- "$tag" <<<"$published"; then
              echo "::error::A published Release for '$tag' already exists."
              exit 1
            fi
            # The rule that `publish-release` applies again in its step
            # `Classify the release state`, for a late re-run. The block between
            # the two marker lines is the same text in both steps; a contract
            # test compares them.
            if [[ "$MODE" == "publish" && "$VERSION" != *-* ]]; then
              # BEGIN rule: a stable version is not below a published stable Release
              # A stable Release is marked "Latest". Publishing an older stable
              # version would take "Latest" from a newer one, so it is refused.
              # `sort -V` orders plain X.Y.Z versions numerically. A pre-release
              # is never marked "Latest". `published` lists the tags of the
              # published Releases, one per line.
              highest="$(awk '/^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/ { print substr($0, 2) }' <<<"$published" | sort -V | tail -n 1)"
              if [[ -n "$highest" && "$(printf '%s\n%s\n' "$highest" "$VERSION" | sort -V | tail -n 1)" != "$VERSION" ]]; then
                echo "::error::Refusing to publish 'v$VERSION': the published Release 'v$highest' is a higher stable version, and 'v$VERSION' would be marked Latest in its place. Release a stable version above $highest instead (see RELEASING.md, case 9)."
                exit 1
              fi
              # END rule
            fi

            for id in vouchfx Vouchfx.Sdk Vouchfx.Sdk.Testing Vouchfx.Engine.Abstractions Vouchfx.Engine.Authoring Vouchfx.Engine.Compilation; do
              rc=0
              python3 scripts/check_nuget_presence.py --id "$id" --version "$VERSION" || rc=$?
              if [[ "$rc" -eq 0 ]]; then
                echo "::error::$id $VERSION is already on NuGet.org. A version is released once."
                exit 1
              elif [[ "$rc" -ne 3 ]]; then
                echo "::error::Could not check $id $VERSION on NuGet.org."
                exit 1
              fi
            done
          fi

          if [[ "$MODE" == "publish" ]]; then
            if ! python3 scripts/release_metadata.py check --changelog CHANGELOG.md --props Directory.Build.props --version "$VERSION"; then
              echo "::error::Merge the release pull request for $VERSION first: the newest CHANGELOG.md heading and the VouchfxEngineVersion fallback must both be $VERSION."
              exit 1
            fi
            # The same extraction `publish-release` uses for the Release notes,
            # so a missing, empty or too long section fails here, not at the end.
            if ! python3 scripts/release_metadata.py notes --changelog CHANGELOG.md --version "$VERSION" > /dev/null; then
              echo "::error::The CHANGELOG.md section for $VERSION cannot be used as the Release notes: it must exist once, not be empty, and be at most 100,000 characters."
              exit 1
            fi
          fi

          {
            echo "version=$VERSION"
            echo "tag=$tag"
            echo "mode=$MODE"
          } >> "$GITHUB_OUTPUT"
          echo "Release request: mode=$MODE version=$VERSION tag=$tag commit=$GITHUB_SHA"

  tls-transport:
    name: TLS transport
    needs: prepare
    uses: ./.github/workflows/tls-transport-acceptance.yml
    with:
      reviewed_sha: ${{ github.sha }}

  # ===========================================================================
  # docker-integration — release gate
  # The Docker / Aspire integration lane must pass on this run's commit before
  # anything is attested, cosign-signed or published. It needs only `prepare`,
  # so it starts beside the TLS transport lane, before the builds. It passed
  # in about 75 minutes in CI, so a release run is expected to take about 80
  # minutes.
  #
  # WITHHELD when the lane is red, cancelled, timed out or skipped (the two jobs
  # `sign-and-attest` and `publish-release` list it in `needs`, so they and
  # everything after them are skipped): build-provenance attestations, cosign
  # signatures, the NuGet package GPG signature, the draft and the GitHub
  # Release, the tag, the NuGet pushes and the Marketplace extension.
  #
  # ALSO WITHHELD: the floating tags (v1-alpha, v1-rc, v1). The last job,
  # `move-floating-tag`, calls move-floating-tag.yml and lists `publish-release`
  # and `publish-marketplace` in `needs`, so it is skipped with them when the lane
  # fails. A release run that is skipped, cancelled or red before then leaves the
  # floating tags where they were. That is the expected behaviour on GitHub; the
  # contract tests check the job's `needs`, `if`, `permissions` and `with`, not a
  # live run.
  # LIMIT: a GitHub Release made by hand for a tag made before this change still
  # starts that tag's own release.yml and move-floating-tag.yml, which listened
  # on `release: published` (for a `release` event GitHub runs the workflow
  # files of the tagged commit). Nothing in this file can prevent that.
  #
  # NOT WITHHELD: the run artefacts. The build jobs are deliberately not gated.
  # Whatever the lane result, the installers are still built and, where those
  # secrets are configured, signed with the project's keys (Authenticode, the
  # .deb GPG signature) or, for the .pkg, submitted to Apple for notarisation. They
  # stay downloadable as run artefacts (msi-installer, deb-package, pkg-installer,
  # 30 days) by anyone who can see this run, which for this public repository
  # is anyone signed in to GitHub. The other build outputs (nuget-package,
  # publish-archives, sbom, vsix, signing-material) are run artefacts in the
  # same way, with no attestation or cosign signature. Apart from them, a red
  # run leaves nothing public: no tag, no Release, no package, no extension.
  #
  # A flaky lane is expected to be recoverable with "Re-run failed jobs" on this
  # run (not yet exercised on a release run); there is no bypass input, variable
  # or label. Validate and rehearse runs call the lane too (no `if` here), so a
  # candidate is checked before it is released.
  #
  # Calling it is safe because the called workflow has exactly one job and that
  # job has no `if`: a reusable-workflow call whose inner jobs are all skipped
  # can report success, which would open the gate. Keep it that way.
  # ===========================================================================
  docker-integration:
    name: Docker integration
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/docker-integration.yml
    with:
      reviewed_sha: ${{ github.sha }}

  # ===========================================================================
  # build-dotnet
  # Produces: nupkg (primary distribution), per-RID self-contained archives,
  # CycloneDX JSON SBOM, and separate publish dirs for installer jobs.
  # ===========================================================================
  build-dotnet:
    name: Build .NET artifacts (nupkg, per-RID publish, SBOM)
    needs: [prepare, tls-transport]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    # Passed through from `prepare`, which checked them, so the later jobs that
    # read build-dotnet's outputs get the same values.
    outputs:
      version: ${{ needs.prepare.outputs.version }}
      tag:     ${{ needs.prepare.outputs.tag }}

    steps:
      - name: Checkout (full history for version embedding)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Keep the product build on an isolated .NET 10 SDK, the line global.json
      # selects, so no other preinstalled SDK or runtime on the hosted image can
      # take part in the build.
      - name: Configure isolated product SDK
        run: printf 'DOTNET_INSTALL_DIR=%s/vouchfx-release-dotnet\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"

      - name: Test runtime-isolation guard safety
        shell: pwsh
        run: ./scripts/ci/test-select-dotnet-runtime.ps1
      - name: Keep only the selected SDK and shared frameworks
        env:
          EXPECTED_DOTNET: '10.0'
        shell: pwsh
        run: ./scripts/ci/select-dotnet-runtime.ps1 -ExpectedDotnet $env:EXPECTED_DOTNET

      - name: Require the isolated .NET 10 product SDK
        run: |
          set -euo pipefail
          test "$(dirname "$(command -v dotnet)")" = "$DOTNET_INSTALL_DIR"
          [[ "$(dotnet --version)" == 10.0.* ]]
          dotnet --info

      - name: Restore dependencies
        run: dotnet restore vouchfx.sln

      - name: Build (Release, 0-warning gate)
        run: dotnet build vouchfx.sln -c Release --no-restore

      # The version comes from `prepare`, which validated it as strict semver.
      # Pack the dotnet global tool nupkg (primary distribution).
      # PackAsTool=true and IsPublishable=true are set in the csproj.
      - name: Pack nupkg (global tool — primary distribution)
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          dotnet pack src/Cli/Vouchfx.Cli/Vouchfx.Cli.csproj \
            -c Release \
            -p:Version="$VERSION" \
            -o artifacts/nuget

      - name: Validate complete tool payload and conservative NuGet size ceiling
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python -m unittest discover -s scripts/tests -p test_package_compression.py -v
          python -m unittest discover -s scripts/tests -p test_check_distribution.py -v
          python scripts/check_distribution.py --package "artifacts/nuget/vouchfx.${VERSION}.nupkg" \
            --nuget-cache "$HOME/.nuget/packages"

      # Pack the SDK-closure nupkgs (provider-authoring surface) so provider
      # authors can restore Vouchfx.Sdk et al. straight from NuGet.org
      # instead of vendoring engine source (mirrors the local-feed pack in
      # vouchfx-providers/.github/workflows/conformance.yml, which packs the
      # same five projects from a pinned engine SHA as a bootstrap workaround
      # until this step existed).
      # Dependency order: Abstractions and Sdk are leaves; Authoring and
      # Compilation each ProjectReference Abstractions+Sdk; Sdk.Testing
      # ProjectReferences all four.  dotnet pack builds each project's own
      # ProjectReferences regardless of loop order, but packing leaves first
      # keeps the loop readable and matches the emitted <dependency> graph.
      - name: Pack nupkg (SDK closure — Vouchfx.Sdk, Vouchfx.Sdk.Testing, Vouchfx.Engine.*)
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          for csproj in \
            src/Engine/Vouchfx.Engine.Abstractions/Vouchfx.Engine.Abstractions.csproj \
            src/Sdk/Vouchfx.Sdk/Vouchfx.Sdk.csproj \
            src/Engine/Vouchfx.Engine.Authoring/Vouchfx.Engine.Authoring.csproj \
            src/Engine/Vouchfx.Engine.Compilation/Vouchfx.Engine.Compilation.csproj \
            src/Sdk/Vouchfx.Sdk.Testing/Vouchfx.Sdk.Testing.csproj ; do
            echo "Packing: $csproj"
            dotnet pack "$csproj" \
              -c Release \
              -p:Version="$VERSION" \
              -o artifacts/nuget
          done

      # SDK documentation is a published package contract. Check the actual ZIP
      # members after the complete closure is packed, before any artifact upload.
      # Planning remains a separately audited packable library, outside this closure.
      - name: Validate SDK XML publication boundary and CLI XML exclusions
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          python -m unittest discover -s scripts/tests -p test_check_sdk_xml.py -v
          python scripts/check_sdk_xml.py --packages-dir artifacts/nuget --version "$VERSION"

      # Self-contained multi-file publish for each RID.
      # PublishSingleFile is NOT used (Assembly.Location → IL3000 build errors).
      # Each publish carries its own RID-specific DCP tools tree beside the CLI.
      - name: Publish self-contained (linux-x64)
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          dotnet publish src/Cli/Vouchfx.Cli/Vouchfx.Cli.csproj \
            -c Release -r linux-x64 --self-contained \
            -p:Version="$VERSION" \
            -o artifacts/publish/linux-x64

      - name: Publish self-contained (win-x64)
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          dotnet publish src/Cli/Vouchfx.Cli/Vouchfx.Cli.csproj \
            -c Release -r win-x64 --self-contained \
            -p:Version="$VERSION" \
            -o artifacts/publish/win-x64

      - name: Publish self-contained (osx-x64)
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          dotnet publish src/Cli/Vouchfx.Cli/Vouchfx.Cli.csproj \
            -c Release -r osx-x64 --self-contained \
            -p:Version="$VERSION" \
            -o artifacts/publish/osx-x64

      - name: Publish self-contained (osx-arm64)
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          dotnet publish src/Cli/Vouchfx.Cli/Vouchfx.Cli.csproj \
            -c Release -r osx-arm64 --self-contained \
            -p:Version="$VERSION" \
            -o artifacts/publish/osx-arm64

      # Archive each publish directory into a distributable tarball.
      - name: Archive publish outputs (tar.gz per RID)
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          v="$VERSION"
          mkdir -p artifacts/archives
          for rid in linux-x64 win-x64 osx-x64 osx-arm64; do
            if [ "$rid" != win-x64 ]; then
              chmod 755 "artifacts/publish/$rid/vouchfx"
              find "artifacts/publish/$rid/dcp" -type f \( -name dcp -o -name dcptun_c \) -exec chmod 755 {} +
            fi
            python scripts/check_distribution.py --publish "artifacts/publish/$rid" --rid "$rid" \
              --nuget-cache "$HOME/.nuget/packages"
            tar -czf "artifacts/archives/vouchfx-${v}-${rid}.tar.gz" \
              -C artifacts/publish "${rid}/"
            echo "Archived: vouchfx-${v}-${rid}.tar.gz"
          done

      # CycloneDX SBOM — install, run, uninstall (no residual global tool).
      - name: Generate SBOM (CycloneDX JSON, spec 1.7)
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          dotnet tool install --global CycloneDX --allow-roll-forward
          dotnet-CycloneDX vouchfx.sln \
            -o artifacts/sbom \
            --set-version "$VERSION" \
            --filename "vouchfx-${VERSION}.bom.json"
          python scripts/check_release_sbom.py "artifacts/sbom/vouchfx-${VERSION}.bom.json" --version "$VERSION"
          dotnet tool uninstall --global CycloneDX
          ls -lh artifacts/sbom/

      - name: Upload nupkg
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuget-package
          path: |
            artifacts/nuget/*.nupkg
            artifacts/nuget/*.snupkg
          if-no-files-found: error
          retention-days: 30

      - name: Upload publish archives (all RIDs)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publish-archives
          path: artifacts/archives/*.tar.gz
          if-no-files-found: error
          retention-days: 30

      # Separate per-OS publish dirs so installer jobs can grab just their RID.
      # build-msi publishes its own win-x64 directory before harvesting the full tree.
      - name: Upload linux-x64 publish dir (for .deb)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publish-linux-x64-dir
          path: artifacts/publish/linux-x64/
          if-no-files-found: error
          retention-days: 7

      - name: Upload osx-arm64 publish dir (for .pkg)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publish-osx-arm64-dir
          path: artifacts/publish/osx-arm64/
          if-no-files-found: error
          retention-days: 7

      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: artifacts/sbom/*.bom.json
          if-no-files-found: error
          retention-days: 30

  # Native launch preflights cover every advertised RID without assuming Docker
  # is available on macOS/Windows hosted runners. Real topology proof is below.
  smoke-test-distribution-platforms:
    name: Native distribution preflight (${{ matrix.rid }})
    needs: build-dotnet
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: windows-latest, rid: win-x64 }
          - { os: macos-15-intel, rid: osx-x64 }
          - { os: macos-15, rid: osx-arm64 }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.build-dotnet.outputs.version }}
      RID: ${{ matrix.rid }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nuget-package
          path: release-nuget/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: publish-archives
          path: release-archives/
      - name: Install exact tool and launch native DCP plus archive CLI
        run: |
          $ErrorActionPreference = 'Stop'
          $feed = (Resolve-Path release-nuget).Path
          $archive = (Resolve-Path "release-archives/vouchfx-$env:VERSION-$env:RID.tar.gz").Path
          $scratch = Join-Path $env:RUNNER_TEMP 'distribution-preflight'
          $toolPath = Join-Path $scratch 'tool'
          $env:NUGET_PACKAGES = Join-Path $env:RUNNER_TEMP 'distribution-empty-cache'
          New-Item -ItemType Directory -Path $scratch -Force | Out-Null
          Set-Location $scratch
          Remove-Item Env:ASPIRE_DCP_PATH -ErrorAction SilentlyContinue
          $config = Join-Path $scratch 'candidate-only.config'
          $source = [System.Security.SecurityElement]::Escape($feed)
          Set-Content -LiteralPath $config -Encoding utf8 -Value "<configuration><packageSources><clear/><add key='candidate' value='$source'/></packageSources></configuration>"
          dotnet tool install --tool-path $toolPath --configfile $config --version $env:VERSION vouchfx
          if ($LASTEXITCODE -ne 0) { throw "Candidate install exited $LASTEXITCODE" }
          $stored = Join-Path $toolPath ".store/vouchfx/$env:VERSION/vouchfx/$env:VERSION/vouchfx.$env:VERSION.nupkg"
          $expected = (Get-FileHash (Join-Path $feed "vouchfx.$env:VERSION.nupkg") -Algorithm SHA256).Hash
          if (-not (Test-Path $stored) -or (Get-FileHash $stored -Algorithm SHA256).Hash -ne $expected) { throw 'Installed package differs from downloaded candidate' }
          Write-Output "Installed candidate SHA256: $expected"
          $exe = if ($IsWindows) { 'vouchfx.exe' } else { 'vouchfx' }
          $dcpExe = if ($IsWindows) { 'dcp.exe' } else { 'dcp' }
          $toolVersion = & (Join-Path $toolPath $exe) --version
          if ($LASTEXITCODE -ne 0 -or -not $toolVersion.StartsWith($env:VERSION + '+')) { throw "Wrong installed version: $toolVersion" }
          $hostDir = Join-Path $toolPath ".store/vouchfx/$env:VERSION/vouchfx/$env:VERSION/tools/net10.0/any"
          $dcpRoot = Get-ChildItem (Join-Path $hostDir 'dcp') -Directory
          if (@($dcpRoot).Count -ne 1) { throw 'Expected one pinned DCP version' }
          $native = Join-Path $dcpRoot.FullName "$env:RID/tools/$dcpExe"
          # Direct native preflight bypasses topology startup's Unix permission repair.
          if (-not $IsWindows) { chmod +x $native; if ($LASTEXITCODE -ne 0) { throw 'chmod failed' } }
          $toolDcp = & $native version
          if ($LASTEXITCODE -ne 0) { throw "Bundled native DCP exited $LASTEXITCODE" }
          if (-not ($toolDcp | ConvertFrom-Json).version) { throw 'DCP version evidence missing' }
          tar -xzf $archive
          if ($LASTEXITCODE -ne 0) { throw 'Archive extraction failed' }
          $archiveRoot = Join-Path $scratch $env:RID
          $archiveVersion = & (Join-Path $archiveRoot $exe) --version
          if ($LASTEXITCODE -ne 0 -or $archiveVersion -ne $toolVersion) { throw "Wrong archive version: $archiveVersion" }
          $archiveDcp = & (Join-Path $archiveRoot "dcp/$($dcpRoot.Name)/$env:RID/tools/$dcpExe") version
          if ($LASTEXITCODE -ne 0 -or $archiveDcp -ne $toolDcp) { throw 'Archive DCP differs from installed tool' }
          if (Get-ChildItem $env:NUGET_PACKAGES -Directory -Filter 'aspire.hosting.orchestration.*' -ErrorAction SilentlyContinue) { throw 'Unexpected restored Aspire package' }
          Write-Output "Native preflight: $env:RID, CLI $toolVersion, DCP $toolDcp"

  # ===========================================================================
  # smoke-test-packaged-tool
  # Install the exact packed candidate, hide the build-cache path, and run the
  # reference fixture outside the checkout with an EMPTY alternate NuGet cache.
  # Do not restore a source AppHost here: that masks a missing native bundle.
  # Require real passing scenarios and zero new containers/networks; never prune.
  # ===========================================================================
  smoke-test-packaged-tool:
    name: Smoke-test packaged tool on a simulated user machine
    runs-on: ubuntu-latest
    needs: build-dotnet

    permissions:
      contents: read

    env:
      VERSION: ${{ needs.build-dotnet.outputs.version }}

    steps:
      - name: Checkout (for reference fixtures only; no source project restore)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: examples/ci-reference

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"

      - name: Download nupkg
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nuget-package
          path: release-nuget/

      # Install only from the downloaded candidate feed through an isolated config
      # and fresh cache. Bind tool-store package bytes to the artifact's SHA256.
      #
      # PATH robustness (MINOR 3, gatekeeper review): `dotnet tool install --global` places
      # the shim under ~/.dotnet/tools, which is NOT guaranteed to already be on PATH for
      # every step's shell on every runner image — relying on a bare `vouchfx` later in this
      # job would be fragile. Append it to $GITHUB_PATH (applies to every SUBSEQUENT step)
      # right here, and invoke the just-installed shim by its full path for the immediate
      # --version smoke check within THIS SAME step (a $GITHUB_PATH append never affects the
      # step that wrote it).
      - name: Install packed vouchfx tool (global, from the release nupkg)
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = ET.Element('configuration')
          sources = ET.SubElement(root, 'packageSources')
          ET.SubElement(sources, 'clear')
          ET.SubElement(sources, 'add', key='candidate', value=str(Path('release-nuget').resolve()))
          ET.ElementTree(root).write(Path(os.environ['RUNNER_TEMP']) / 'candidate-only.config')
          PY
          NUGET_PACKAGES="$RUNNER_TEMP/candidate-install-cache" dotnet tool install --global \
            --configfile "$RUNNER_TEMP/candidate-only.config" --version "$VERSION" vouchfx
          candidate=$(sha256sum "release-nuget/vouchfx.$VERSION.nupkg" | cut -d' ' -f1)
          stored="$HOME/.dotnet/tools/.store/vouchfx/$VERSION/vouchfx/$VERSION/vouchfx.$VERSION.nupkg"
          test "$(sha256sum "$stored" | cut -d' ' -f1)" = "$candidate"
          echo "Installed candidate SHA256: $candidate"
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
          "$HOME/.dotnet/tools/vouchfx" --version

      - name: Prepare empty user cache and fixtures outside the checkout
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/user-cache"
          mkdir -p "$RUNNER_TEMP/installed-reference"
          cp -R examples/ci-reference "$RUNNER_TEMP/installed-reference/suite"
          docker ps -aq | sort > "$RUNNER_TEMP/before-containers"
          docker network ls -q | sort > "$RUNNER_TEMP/before-networks"

      # Kill the baked-in path for real (see the job header comment for why this is
      # necessary even on the "same" runner image as build-dotnet).
      - name: Hide the default NuGet cache (simulate a machine that never built vouchfx)
        run: |
          set -euo pipefail
          if [ -d "$HOME/.nuget/packages" ]; then
            mv "$HOME/.nuget/packages" "$RUNNER_TEMP/original-nuget-packages"
          fi

      # Pre-warm the one image the smoke suite needs (mirrors build.yml / vouchfx-run.yml).
      - name: Pre-pull traefik/whoami (best-effort, non-fatal)
        continue-on-error: true
        run: docker pull traefik/whoami:latest

      # Strict flags and the independent JUnit check reject missing execution,
      # environment errors and inconclusive results. Resolution must use the bundle.
      - name: Run reference suite via the installed tool (simulated user machine)
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/user-cache
        run: |
          set -euo pipefail
          unset ASPIRE_DCP_PATH
          test -z "$(find "$NUGET_PACKAGES" -mindepth 1 -print -quit)"
          cd "$RUNNER_TEMP/installed-reference"
          "$HOME/.dotnet/tools/vouchfx" run suite \
            --junit "$RUNNER_TEMP/smoke-results.xml" \
            --html "$RUNNER_TEMP/smoke-report.html" \
            --fail-on-env-error \
            --fail-on-inconclusive

      - name: Verify no restored Aspire packages or new Docker residue
        if: always()
        run: |
          set -euo pipefail
          if find "$RUNNER_TEMP/user-cache" -maxdepth 1 -name 'aspire.hosting.orchestration.*' -print -quit | grep -q .; then
            echo "::error::Installed-tool smoke unexpectedly populated an Aspire orchestration cache"
            exit 1
          fi
          docker ps -aq | sort > "$RUNNER_TEMP/after-containers"
          docker network ls -q | sort > "$RUNNER_TEMP/after-networks"
          for resource in containers networks; do
            residue=$(comm -13 "$RUNNER_TEMP/before-$resource" "$RUNNER_TEMP/after-$resource")
            if [ -n "$residue" ]; then
              echo "::error::Installed-tool smoke left new Docker $resource: $residue"
              exit 1
            fi
          done

      # Independently verify a GENUINE pass (BLOCKER 1, gatekeeper review) — belt-and-braces
      # beyond the exit code above. Two exit-0 paths could otherwise slip through even with
      # the --fail-on-* flags: (a) a future flag/verdict-mapping regression in the CLI
      # itself, and (b) `vouchfx run` printing "No *.e2e.yaml scenarios found under '<path>'"
      # and exiting 0 WITHOUT ever writing a JUnit file at all when scenario discovery finds
      # nothing (e.g. a typo'd path) — see RunCommand.cs's discovered.Count == 0 branch.
      # Parse the JUnit root <testsuites> aggregate attributes that JunitXmlRenderer always
      # writes on one line (tests="N" failures="N" errors="N" skipped="N") and require
      # tests>0, failures=0, errors=0, skipped=0. A missing/unparseable file fails this step
      # outright, which is exactly what case (b) needs guarded.
      - name: Verify the smoke suite genuinely passed (parse JUnit XML)
        run: |
          set -euo pipefail
          results="$RUNNER_TEMP/smoke-results.xml"
          if [ ! -f "$results" ]; then
            echo "::error::$results was not written — the run produced no report (see the 'no scenarios found' exit-0 path in RunCommand.cs)."
            exit 1
          fi
          root_line=$(grep -m1 '<testsuites ' "$results" || true)
          if [ -z "$root_line" ]; then
            echo "::error::No <testsuites> root element found in $results"
            exit 1
          fi
          tests=$(echo "$root_line" | sed -nE 's/.*tests="([0-9]+)".*/\1/p')
          failures=$(echo "$root_line" | sed -nE 's/.*failures="([0-9]+)".*/\1/p')
          errors=$(echo "$root_line" | sed -nE 's/.*errors="([0-9]+)".*/\1/p')
          skipped=$(echo "$root_line" | sed -nE 's/.*skipped="([0-9]+)".*/\1/p')
          if [ -z "$tests" ] || [ -z "$failures" ] || [ -z "$errors" ] || [ -z "$skipped" ]; then
            echo "::error::Could not parse tests/failures/errors/skipped attributes from $results"
            exit 1
          fi
          echo "JUnit summary: tests=$tests failures=$failures errors=$errors skipped=$skipped"
          if [ "$tests" -eq 0 ] || [ "$failures" -ne 0 ] || [ "$errors" -ne 0 ] || [ "$skipped" -ne 0 ]; then
            echo "::error::Smoke suite did not genuinely pass (tests=$tests failures=$failures errors=$errors skipped=$skipped) — see $results"
            exit 1
          fi
          echo "Smoke suite genuinely passed: $tests test(s), 0 failures, 0 errors, 0 skipped."

      # Restore the original cache in case a later step (now, or added in future) needs
      # it — keeps this job side-effect-free beyond its own working directory.
      - name: Restore original NuGet cache
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/original-nuget-packages" ]; then
            rm -rf "$HOME/.nuget/packages"
            mv "$RUNNER_TEMP/original-nuget-packages" "$HOME/.nuget/packages"
          fi

      - name: Upload smoke-test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-test-packaged-tool-reports
          path: |
            ${{ runner.temp }}/smoke-results.xml
            ${{ runner.temp }}/smoke-report.html
          retention-days: 7
          if-no-files-found: warn

  # ===========================================================================
  # build-vsix
  # Builds the tag-versioned VSIX once. Publication consumes this exact artifact.
  # Development package.json/package-lock.json remain at their source versions.
  # ===========================================================================
  build-vsix:
    name: Build VSCode extension (.vsix)
    runs-on: ubuntu-latest
    needs: build-dotnet
    permissions:
      contents: read

    outputs:
      sha256: ${{ steps.package-digest.outputs.sha256 }}

    env:
      VERSION: ${{ needs.build-dotnet.outputs.version }}

    defaults:
      run:
        working-directory: tools/vscode-vouchfx

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js (LTS 22)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: tools/vscode-vouchfx/package-lock.json

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Stamp release version without committing or tagging
        run: npm version "$VERSION" --no-git-tag-version --ignore-scripts

      # The existing vscode:prepublish hook compiles once during packaging.
      - name: Package extension (vsce package)
        run: npm run package -- --out "vouchfx-${VERSION}.vsix"

      - name: Verify both packaged version manifests and record artifact digest
        id: package-digest
        run: |
          set -euo pipefail
          package="vouchfx-${VERSION}.vsix"
          python ../../scripts/check_vsix.py --package "$package" --version "$VERSION"
          digest=$(sha256sum "$package")
          echo "sha256=${digest%% *}" >> "$GITHUB_OUTPUT"

      - name: Upload .vsix
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix
          path: tools/vscode-vouchfx/vouchfx-${{ env.VERSION }}.vsix
          if-no-files-found: error
          retention-days: 30

  # ===========================================================================
  # publish-marketplace (#121)
  # Publish mode only. No build or version bump occurs here. Require both smoke
  # gates, signing, and completed GitHub/NuGet publication (`publish-release`
  # has published the Release and checked that its tag is at this run's commit)
  # before publishing the verified VSIX. The checkout is the run's commit, the
  # same commit the tag points at.
  # A failed/skipped dependency skips this job; do not add always() to its guard.
  # ===========================================================================
  publish-marketplace:
    name: Publish verified VSIX to VS Code Marketplace
    runs-on: ubuntu-latest
    needs: [build-dotnet, build-vsix, sign-and-attest, smoke-test-packaged-tool, smoke-test-distribution-platforms, publish-release]
    if: inputs.mode == 'publish' && github.repository == 'tomas-rampas/vouchfx'
    permissions:
      contents: read

    env:
      VERSION: ${{ needs.build-dotnet.outputs.version }}
      EXPECTED_VSIX_SHA256: ${{ needs.build-vsix.outputs.sha256 }}
      HAS_VSCE_PAT: ${{ secrets.VSCE_PAT != '' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download the built and attested .vsix
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix
          path: ${{ runner.temp }}/marketplace/

      - name: Verify exact artifact digest and release identity before publication
        run: |
          python scripts/check_vsix.py \
            --package "$RUNNER_TEMP/marketplace/vouchfx-${VERSION}.vsix" \
            --version "$VERSION" --sha256 "$EXPECTED_VSIX_SHA256"

      - name: Set up Node.js (LTS 22)
        if: ${{ env.HAS_VSCE_PAT == 'true' && !contains(env.VERSION, '-') }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: tools/vscode-vouchfx/package-lock.json

      - name: Install locked publication tools without build scripts
        if: ${{ env.HAS_VSCE_PAT == 'true' && !contains(env.VERSION, '-') }}
        working-directory: tools/vscode-vouchfx
        run: npm ci --ignore-scripts

      # Marketplace supports only major.minor.patch, not SemVer RC suffixes.
      # RC VSIX files still carry the exact RC version on the GitHub Release.
      # Per-version publication is immutable; never replace a broken version.
      - name: Publish to VS Code Marketplace (vsce publish)
        if: ${{ env.HAS_VSCE_PAT == 'true' && !contains(env.VERSION, '-') }}
        working-directory: tools/vscode-vouchfx
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --no-install vsce publish --packagePath "$RUNNER_TEMP/marketplace/vouchfx-${VERSION}.vsix"

      - name: Marketplace publication skipped
        if: ${{ env.HAS_VSCE_PAT != 'true' || contains(env.VERSION, '-') }}
        run: |
          if [[ "$VERSION" == *-* ]]; then
            echo "::notice title=VS Code Marketplace publish SKIPPED::Marketplace does not support SemVer prerelease suffixes. The exact ${VERSION} VSIX is attached to the GitHub Release; a stable tag publishes the matching extension version."
          else
            echo "::notice title=VS Code Marketplace publish SKIPPED::VSCE_PAT is not configured. The verified VSIX is attached to the GitHub Release. To activate the Marketplace channel (#121), create the 'vouchfx' publisher, mint a Marketplace-scoped PAT, and configure the VSCE_PAT repository secret."
          fi

  # ===========================================================================
  # sign-and-attest
  # In publish mode: applies SLSA build provenance + cosign keyless signing to
  # every artifact, and optionally GPG-signs the nupkg. In validate and rehearse
  # modes the job still runs (it downloads every artefact, so a missing one
  # fails it), but each attestation and signing step is skipped: an attestation
  # or a Rekor entry is a permanent public record, and a test artefact must not
  # get one. Its `signing-material` artefact always exists and records the mode.
  # The job has no `environment`: in publish mode the attestations and
  # signatures are made before the `release` environment approval of
  # `publish-release`. That approval protects the draft Release and the NuGet
  # push, not the signing identity. This order is deliberate.
  # ===========================================================================
  sign-and-attest:
    name: Attest (SLSA provenance) and sign (cosign keyless, GPG)
    runs-on: ubuntu-latest
    # docker-integration is the release gate, and both smoke tests must pass
    # too: no attestation or signature is made for a commit whose Docker lane
    # or packaged-tool smoke tests have not passed.
    needs: [docker-integration, build-dotnet, build-vsix, build-msi, build-deb, build-pkg, smoke-test-packaged-tool, smoke-test-distribution-platforms]

    permissions:
      id-token: write      # mint GitHub OIDC token for Fulcio + cosign
      attestations: write  # store SLSA provenance attestation via GitHub API
      contents: read

    env:
      VERSION: ${{ needs.build-dotnet.outputs.version }}
      MODE: ${{ inputs.mode }}
      HAS_GPG: ${{ secrets.GPG_SIGNING_KEY != '' }}

    steps:
      - name: Download nupkg
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nuget-package
          path: artifacts/nuget/

      - name: Download publish archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: publish-archives
          path: artifacts/

      - name: Download SBOM
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: artifacts/sbom/

      - name: Download .vsix
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix
          path: artifacts/vsix/

      - name: Download MSI installer (for attestation)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: msi-installer
          path: artifacts/installers/

      - name: Download .deb package (for attestation)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deb-package
          path: artifacts/installers/

      - name: Download .pkg installer (for attestation)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pkg-installer
          path: artifacts/installers/

      # SLSA provenance attestations — one per artifact group, publish mode only.
      # Verification: gh attestation verify <file> --repo tomas-rampas/vouchfx
      - name: Attest nupkg (SLSA build provenance)
        if: inputs.mode == 'publish'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            artifacts/nuget/*.nupkg
            artifacts/nuget/*.snupkg

      - name: Attest publish archives (SLSA build provenance)
        if: inputs.mode == 'publish'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/vouchfx-*.tar.gz

      - name: Attest SBOM (SLSA build provenance)
        if: inputs.mode == 'publish'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/sbom/*.bom.json

      - name: Attest .vsix (SLSA build provenance)
        if: inputs.mode == 'publish'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/vsix/*.vsix

      - name: Attest installers (SLSA build provenance)
        if: inputs.mode == 'publish'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/installers/*

      # cosign keyless signing — produces a self-contained .cosign.bundle
      # (signature + Fulcio cert chain + Rekor inclusion proof) per artifact.
      # Pinned to a full commit SHA for supply-chain integrity.
      # Publish mode only: signing a test artifact mints a real, permanent Rekor
      # transparency-log entry that verifies as if it came from a release.
      - name: Install cosign
        if: inputs.mode == 'publish'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign artifacts (cosign keyless)
        if: inputs.mode == 'publish'
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          v="$VERSION"
          for f in \
            artifacts/nuget/*.nupkg \
            artifacts/nuget/*.snupkg \
            "artifacts/vouchfx-${v}-linux-x64.tar.gz" \
            "artifacts/vouchfx-${v}-win-x64.tar.gz" \
            "artifacts/vouchfx-${v}-osx-x64.tar.gz" \
            "artifacts/vouchfx-${v}-osx-arm64.tar.gz" \
            "artifacts/sbom/vouchfx-${v}.bom.json" \
            artifacts/vsix/*.vsix \
            artifacts/installers/*.msi \
            artifacts/installers/*.deb \
            artifacts/installers/*.pkg ; do
            if [[ -f "$f" ]]; then
              echo "Signing: $f"
              cosign sign-blob --yes \
                --bundle "${f}.cosign.bundle" \
                "$f"
              echo "  -> ${f}.cosign.bundle"
            fi
          done

      # GPG signing for the nupkg — SECRET-GATED, publish mode only.
      # Required secrets: GPG_SIGNING_KEY (base64-encoded armoured private key)
      #                   GPG_PASSPHRASE
      - name: Sign nupkg (GPG) — secret-gated
        if: ${{ inputs.mode == 'publish' && env.HAS_GPG == 'true' }}
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_PASSPHRASE:  ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          echo "$GPG_SIGNING_KEY" | base64 -d | gpg --batch --import
          for nupkg in artifacts/nuget/*.nupkg; do
            echo "GPG-signing: $nupkg"
            echo "$GPG_PASSPHRASE" | gpg --batch --yes --passphrase-fd 0 \
              --armor --detach-sign "$nupkg"
            echo "  -> ${nupkg}.asc"
          done

      # The signing-material artefact has a known shape in every mode, so the
      # publishing job never has to tolerate a missing one. In publish mode each
      # artifact must have its cosign bundle; in the other modes there must be no
      # cosign bundle and no nupkg signature. The mode is recorded beside them.
      - name: Check the signing material for this mode
        run: |
          set -euo pipefail
          shopt -s nullglob
          subjects=(artifacts/nuget/*.nupkg artifacts/nuget/*.snupkg artifacts/vouchfx-*.tar.gz
                    artifacts/sbom/*.bom.json artifacts/vsix/*.vsix artifacts/installers/*.msi
                    artifacts/installers/*.deb artifacts/installers/*.pkg)
          if [[ "${#subjects[@]}" -eq 0 ]]; then
            echo "::error::No artifacts were downloaded."
            exit 1
          fi
          if [[ "$MODE" == "publish" ]]; then
            for f in "${subjects[@]}"; do
              if [[ ! -s "${f}.cosign.bundle" ]]; then
                echo "::error::$f has no cosign bundle."
                exit 1
              fi
            done
          else
            unexpected="$(find artifacts -type f \( -name '*.cosign.bundle' -o -path 'artifacts/nuget/*.asc' \) -print)"
            if [[ -n "$unexpected" ]]; then
              echo "::error::Mode '$MODE' must not sign; found: $unexpected"
              exit 1
            fi
          fi
          printf '%s\n' "$MODE" > artifacts/signing-mode
          echo "Signing material checked for mode $MODE (${#subjects[@]} artifacts)."

      # Only the nupkg signatures made here: the .deb signature reaches the
      # Release through the deb-package artefact, and a second copy would clash.
      - name: Upload cosign bundles + GPG signatures
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signing-material
          path: |
            artifacts/signing-mode
            artifacts/**/*.cosign.bundle
            artifacts/nuget/*.asc
          if-no-files-found: error
          retention-days: 30

  # ===========================================================================
  # build-msi (windows-latest)
  # Publishes win-x64 with the complete native bundle for recursive WiX harvesting.
  # Builds a WiX v4 MSI installer.  Optionally signs with Authenticode.
  #
  # Secret-gated Authenticode:
  #   CODESIGN_PFX_BASE64   — base64-encoded PKCS#12 (.pfx) certificate
  #   CODESIGN_PFX_PASSWORD — password for the certificate
  # ===========================================================================
  build-msi:
    name: Build Windows MSI installer (WiX v4, win-x64)
    runs-on: windows-latest
    needs: build-dotnet

    permissions:
      contents: read

    env:
      VERSION: ${{ needs.build-dotnet.outputs.version }}
      HAS_CODESIGN: ${{ secrets.CODESIGN_PFX_BASE64 != '' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"

      # Native publish includes DCP; installer users need no NuGet cache.
      - name: Restore dependencies
        run: dotnet restore vouchfx.sln

      - name: Publish win-x64 self-contained (Windows — bundled DCP)
        run: |
          dotnet publish src/Cli/Vouchfx.Cli/Vouchfx.Cli.csproj `
            -c Release `
            -r win-x64 `
            --self-contained `
            "-p:Version=$env:VERSION" `
            -o publish\win-x64

      # Sign vouchfx.exe before it is packaged into the MSI — SECRET-GATED.
      # signtool.exe is available on windows-latest runners.
      - name: Sign vouchfx.exe (Authenticode) — secret-gated
        if: ${{ env.HAS_CODESIGN == 'true' }}
        env:
          CODESIGN_PFX_BASE64:   ${{ secrets.CODESIGN_PFX_BASE64 }}
          CODESIGN_PFX_PASSWORD: ${{ secrets.CODESIGN_PFX_PASSWORD }}
        run: |
          # Resolve signtool.exe explicitly — it is not reliably on PATH on
          # github-hosted windows-latest runners even though the Windows SDK is
          # present.  Pick the highest-versioned x64 build.
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
            -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.Directory.Name -eq 'x64' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { Write-Error "signtool.exe not found in Windows Kits\10\bin"; exit 1 }
          Write-Host "Using: $signtool"
          $pfxPath = "$env:RUNNER_TEMP\codesign.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:CODESIGN_PFX_BASE64))
          & $signtool sign `
            /f  $pfxPath `
            /p  $env:CODESIGN_PFX_PASSWORD `
            /tr http://timestamp.digicert.com `
            /td sha256 /fd sha256 `
            /d  "vouchfx" `
            /du "https://github.com/tomas-rampas/vouchfx" `
            publish\win-x64\vouchfx.exe
          Remove-Item $pfxPath -Force

      # Install WiX v4 dotnet tool if not already available.
      # In dev environments, wix is typically installed globally.
      - name: Ensure WiX v4 tool is available
        run: |
          # Pin the minor version so the WXS schema namespace stays stable.
          # Advance deliberately when upgrading from WiX 4.0.x.
          if (-not (Get-Command wix -ErrorAction SilentlyContinue)) {
            dotnet tool install --global wix --version 4.0.*
          }
          wix --version

      # WiX v4.0.x does not support the Files/glob harvesting element.
      # Invoke-Harvest.ps1 enumerates all files in the publish directory and
      # generates a WXS Fragment (AppFiles.wxs) with one Component per file.
      # The generated file is combined with vouchfx.wxs in the wix build step.
      - name: Harvest publish directory into WXS fragment
        run: |
          pwsh installer\windows\Invoke-Harvest.ps1 `
            -SourceDir publish\win-x64 `
            -OutputFile installer\windows\AppFiles.wxs

      # Build the MSI from the skeleton + harvested fragment.
      # -d Version= injects the version; MSI requires W.X.Y (no pre-release suffix).
      # So a pre-release MSI has the number of its stable release (1.5.0-rc.1
      # gives 1.5.0). Windows Installer compares only the first three fields,
      # so a fourth field cannot tell them apart. vouchfx.wxs sets
      # AllowSameVersionUpgrades: an MSI of the same number replaces the
      # installed one. The file name keeps the full version.
      - name: Build MSI (wix build)
        run: |
          $msiVersion = $env:VERSION -replace '-.*$', ''
          New-Item -ItemType Directory -Force artifacts\installer | Out-Null
          wix build installer\windows\vouchfx.wxs installer\windows\AppFiles.wxs `
            "-d" "Version=$msiVersion" `
            -arch x64 `
            -o "artifacts\installer\vouchfx-$env:VERSION-win-x64.msi"
          Write-Host "Built MSI: vouchfx-$env:VERSION-win-x64.msi"

      - name: Verify extracted MSI native payload and candidate version
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = (Resolve-Path "artifacts/installer/vouchfx-$env:VERSION-win-x64.msi").Path
          $scratch = Join-Path $env:RUNNER_TEMP 'msi-payload-check'
          $arguments = '/a "{0}" /qn TARGETDIR="{1}"' -f $msi, $scratch
          $process = Start-Process msiexec.exe -ArgumentList $arguments -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "MSI extraction exited $($process.ExitCode)" }
          $hosts = @(Get-ChildItem $scratch -Recurse -Filter vouchfx.dll)
          if ($hosts.Count -ne 1) { throw "Expected one extracted host, found $($hosts.Count)" }
          $installed = $hosts[0].Directory.FullName
          python scripts/check_distribution.py --publish $installed --rid win-x64 --nuget-cache "$env:USERPROFILE/.nuget/packages"
          if ($LASTEXITCODE -ne 0) { throw 'Extracted MSI payload validation failed' }
          $version = & (Join-Path $installed 'vouchfx.exe') --version
          if ($LASTEXITCODE -ne 0 -or -not $version.StartsWith($env:VERSION + '+')) { throw "Wrong MSI CLI version: $version" }
          $native = @(Get-ChildItem (Join-Path $installed 'dcp') -Recurse -Filter dcp.exe)
          if ($native.Count -ne 1) { throw 'Expected one extracted native DCP' }
          & $native[0].FullName version
          if ($LASTEXITCODE -ne 0) { throw 'Extracted MSI DCP failed to launch' }

      # Sign the MSI after it is built — SECRET-GATED.
      - name: Sign MSI (Authenticode) — secret-gated
        if: ${{ env.HAS_CODESIGN == 'true' }}
        env:
          CODESIGN_PFX_BASE64:   ${{ secrets.CODESIGN_PFX_BASE64 }}
          CODESIGN_PFX_PASSWORD: ${{ secrets.CODESIGN_PFX_PASSWORD }}
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
            -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.Directory.Name -eq 'x64' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { Write-Error "signtool.exe not found in Windows Kits\10\bin"; exit 1 }
          Write-Host "Using: $signtool"
          $pfxPath = "$env:RUNNER_TEMP\codesign.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:CODESIGN_PFX_BASE64))
          & $signtool sign `
            /f  $pfxPath `
            /p  $env:CODESIGN_PFX_PASSWORD `
            /tr http://timestamp.digicert.com `
            /td sha256 /fd sha256 `
            /d  "vouchfx" `
            /du "https://github.com/tomas-rampas/vouchfx" `
            "artifacts\installer\vouchfx-$env:VERSION-win-x64.msi"
          Remove-Item $pfxPath -Force

      - name: Verify native MSI installation, PATH discovery and removal
        run: |
          python -m unittest discover -s scripts/tests -p test_check_native_installer.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Installer policy tests failed' }
          python scripts/check_native_installer.py `
            --package "artifacts/installer/vouchfx-$env:VERSION-win-x64.msi" `
            --publish publish/win-x64 --version "$env:VERSION" `
            --report-directory "$env:RUNNER_TEMP/native-installer-acceptance"
          if ($LASTEXITCODE -ne 0) { throw 'Native MSI installation acceptance failed' }

      - name: Preserve native MSI acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-installer-acceptance-win-x64
          path: ${{ runner.temp }}/native-installer-acceptance/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload MSI installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msi-installer
          path: artifacts/installer/*.msi
          if-no-files-found: error
          retention-days: 30

  # ===========================================================================
  # build-deb (ubuntu-latest)
  # Builds a Debian .deb package from the linux-x64 publish output.
  # Optional GPG signing: GPG_SIGNING_KEY + GPG_PASSPHRASE.
  # ===========================================================================
  build-deb:
    name: Build Debian package (.deb, linux-x64)
    runs-on: ubuntu-latest
    needs: build-dotnet
    permissions:
      contents: read

    env:
      VERSION: ${{ needs.build-dotnet.outputs.version }}
      HAS_GPG: ${{ secrets.GPG_SIGNING_KEY != '' }}

    steps:
      - name: Checkout installer acceptance helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download linux-x64 publish dir
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: publish-linux-x64-dir
          path: publish/linux-x64/

      - name: Build .deb package
        run: |
          set -euo pipefail
          v="$VERSION"
          pkgroot="deb-build/vouchfx_${v}_amd64"

          mkdir -p "$pkgroot/DEBIAN"
          mkdir -p "$pkgroot/usr/lib/vouchfx"
          mkdir -p "$pkgroot/usr/local/bin"

          # All published files land under /usr/lib/vouchfx/
          cp -r publish/linux-x64/. "$pkgroot/usr/lib/vouchfx/"
          chmod +x "$pkgroot/usr/lib/vouchfx/vouchfx"

          # Symlink the binary into $PATH.
          ln -sf /usr/lib/vouchfx/vouchfx "$pkgroot/usr/local/bin/vouchfx"

          installed_kb=$(du -sk "$pkgroot/usr" | awk '{print $1}')

          # The Debian Version field. A stable release is X.Y.Z. A pre-release
          # is X.Y.Z~<pre-release> (1.5.0-rc.1 gives 1.5.0~rc.1): dpkg sorts
          # "~" before the end of the string, so 1.5.0~rc.1 is below 1.5.0 and
          # the stable package is an upgrade of its pre-releases. A hyphen in
          # the Version field starts the Debian revision, so a hyphen inside
          # the pre-release becomes "." (1.5.0-rc-1 gives 1.5.0~rc.1). The file
          # name keeps the full version. scripts/check_native_installer.py
          # expects the same value (debian_version).
          deb_version="$v"
          if [[ "$v" == *-* ]]; then
            pre="${v#*-}"
            deb_version="${v%%-*}~${pre//-/.}"
          fi

          cat > "$pkgroot/DEBIAN/control" <<EOF
          Package: vouchfx
          Version: ${deb_version}
          Architecture: amd64
          Maintainer: vouchfx contributors <https://github.com/tomas-rampas/vouchfx>
          Installed-Size: ${installed_kb}
          Depends: libc6 (>= 2.17)
          Section: devel
          Priority: optional
          Homepage: https://github.com/tomas-rampas/vouchfx
          Description: vouchfx e2e integration test runner
           Compiles declarative .e2e.yaml integration tests into C# (Roslyn),
           orchestrates the required container topology via .NET Aspire,
           and executes steps covering REST, PostgreSQL, Kafka, webhooks,
           and custom scripting.
           .
           Includes the matching Aspire DCP tools; Docker with Linux containers
           is required to start container topologies.
          EOF

          find "$pkgroot" -type d -exec chmod 755 {} +
          find "$pkgroot" -type f -exec chmod 644 {} +
          chmod 755 "$pkgroot/usr/lib/vouchfx/vouchfx"
          find "$pkgroot/usr/lib/vouchfx/dcp" -type f \( -name dcp -o -name dcptun_c \) -exec chmod 755 {} +

          mkdir -p artifacts/installer
          dpkg-deb --build "$pkgroot" \
            "artifacts/installer/vouchfx-${v}-linux-x64.deb"
          ls -lh "artifacts/installer/vouchfx-${v}-linux-x64.deb"

      - name: Verify extracted Debian native payload and executable permissions
        run: |
          set -euo pipefail
          extracted="$RUNNER_TEMP/deb-payload-check"
          dpkg-deb --extract "artifacts/installer/vouchfx-${VERSION}-linux-x64.deb" "$extracted"
          installed="$extracted/usr/lib/vouchfx"
          diff -rq publish/linux-x64/dcp "$installed/dcp"
          test -x "$installed/vouchfx"
          find "$installed/dcp" -type f \( -name dcp -o -name dcptun_c \) | while read -r native; do test -x "$native"; done
          version=$("$installed/vouchfx" --version)
          [[ "$version" == "$VERSION+"* ]]
          native=$(find "$installed/dcp" -type f -name dcp)
          test -n "$native"
          "$native" version

      - name: Sign .deb (GPG detached signature) — secret-gated
        if: ${{ env.HAS_GPG == 'true' }}
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_PASSPHRASE:  ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          echo "$GPG_SIGNING_KEY" | base64 -d | gpg --batch --import
          deb="artifacts/installer/vouchfx-${VERSION}-linux-x64.deb"
          echo "$GPG_PASSPHRASE" | gpg --batch --yes --passphrase-fd 0 \
            --armor --detach-sign "$deb"
          echo "Signed: ${deb}.asc"

      - name: Verify native Debian installation, PATH discovery and removal
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/tests -p test_check_native_installer.py -v
          python3 scripts/check_native_installer.py \
            --package "artifacts/installer/vouchfx-${VERSION}-linux-x64.deb" \
            --publish publish/linux-x64 --version "$VERSION" \
            --report-directory "$RUNNER_TEMP/native-installer-acceptance"

      - name: Preserve native Debian acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-installer-acceptance-linux-x64
          path: ${{ runner.temp }}/native-installer-acceptance/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload .deb package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deb-package
          path: artifacts/installer/*.deb*
          if-no-files-found: error
          retention-days: 30

  # ===========================================================================
  # build-pkg (macos-latest)
  # Builds macOS .pkg from the osx-arm64 publish output.
  # Apple notarisation: APPLE_ID + APPLE_TEAM_ID + APPLE_APP_SPECIFIC_PASSWORD.
  # ===========================================================================
  build-pkg:
    name: Build macOS package installer (.pkg, osx-arm64)
    runs-on: macos-latest
    needs: build-dotnet
    permissions:
      contents: read

    env:
      VERSION: ${{ needs.build-dotnet.outputs.version }}
      HAS_APPLE: ${{ secrets.APPLE_ID != '' }}

    steps:
      - name: Checkout installer acceptance helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download osx-arm64 publish dir
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: publish-osx-arm64-dir
          path: publish/osx-arm64/

      - name: Build .pkg (osx-arm64)
        run: |
          set -euo pipefail
          v="$VERSION"
          pkgroot="pkg-build/vouchfx-arm64"
          mkdir -p "$pkgroot/usr/local/lib/vouchfx"
          mkdir -p "$pkgroot/usr/local/bin"

          cp -r publish/osx-arm64/. "$pkgroot/usr/local/lib/vouchfx/"
          chmod +x "$pkgroot/usr/local/lib/vouchfx/vouchfx"
          find "$pkgroot/usr/local/lib/vouchfx/dcp" -type f \( -name dcp -o -name dcptun_c \) -exec chmod 755 {} +
          ln -sf /usr/local/lib/vouchfx/vouchfx "$pkgroot/usr/local/bin/vouchfx"

          mkdir -p artifacts/installer
          pkgbuild \
            --root "$pkgroot" \
            --identifier com.vouchfx.cli \
            --version "$v" \
            --install-location / \
            "artifacts/installer/vouchfx-${v}-osx-arm64.pkg"
          echo "Built: artifacts/installer/vouchfx-${v}-osx-arm64.pkg"

      - name: Verify expanded macOS payload and executable permissions
        run: |
          set -euo pipefail
          expanded="$RUNNER_TEMP/pkg-payload-check"
          pkgutil --expand-full "artifacts/installer/vouchfx-${VERSION}-osx-arm64.pkg" "$expanded"
          installed="$expanded/Payload/usr/local/lib/vouchfx"
          diff -rq publish/osx-arm64/dcp "$installed/dcp"
          test -x "$installed/vouchfx"
          find "$installed/dcp" -type f \( -name dcp -o -name dcptun_c \) | while read -r native; do test -x "$native"; done
          test "$(readlink "$expanded/Payload/usr/local/bin/vouchfx")" = /usr/local/lib/vouchfx/vouchfx
          version=$("$installed/vouchfx" --version)
          [[ "$version" == "$VERSION+"* ]]
          native=$(find "$installed/dcp" -type f -name dcp)
          test -n "$native"
          "$native" version

      # Apple notarisation — SECRET-GATED.
      # Required secrets: APPLE_ID, APPLE_TEAM_ID, APPLE_APP_SPECIFIC_PASSWORD
      # Apple's servers scan the pkg and return a ticket; xcrun stapler attaches
      # it so Gatekeeper trusts the installer without an internet connection.
      - name: Notarise .pkg (Apple Notary Service) — secret-gated
        if: ${{ env.HAS_APPLE == 'true' }}
        env:
          APPLE_ID:                    ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID:               ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          pkg="artifacts/installer/vouchfx-${VERSION}-osx-arm64.pkg"
          echo "Submitting for notarisation: $pkg"
          xcrun notarytool submit "$pkg" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait \
            --timeout 600
          echo "Stapling ticket..."
          xcrun stapler staple "$pkg"
          echo "Notarisation complete."

      - name: Verify native macOS installation, PATH discovery and removal
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/tests -p test_check_native_installer.py -v
          python3 scripts/check_native_installer.py \
            --package "artifacts/installer/vouchfx-${VERSION}-osx-arm64.pkg" \
            --publish publish/osx-arm64 --version "$VERSION" \
            --report-directory "$RUNNER_TEMP/native-installer-acceptance"

      - name: Preserve native macOS acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-installer-acceptance-osx-arm64
          path: ${{ runner.temp }}/native-installer-acceptance/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload .pkg installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pkg-installer
          path: artifacts/installer/*.pkg
          if-no-files-found: error
          retention-days: 30

  # ===========================================================================
  # publish-release
  # The only job that creates, changes or deletes a GitHub Release, logs in to
  # NuGet.org or pushes a package. It runs in rehearse and publish modes only,
  # on refs/heads/main of the canonical repository, in the `release`
  # environment (main only, one required reviewer, no administrator bypass), so
  # it waits for approval. Its `if` uses no status-check function: a failed,
  # cancelled or skipped dependency skips it.
  #
  # Steps, in this order, each safe to run again so that "Re-run failed jobs"
  # completes a partial run:
  #   1. Classify v<version>: nothing exists, a draft exists, or a published
  #      Release exists. A tag, a draft target or a published Release at any
  #      other commit than this run's fails the job. In publish mode, when no
  #      Release is published yet, it also fails when a higher stable version
  #      is already published (for a stable version), and, when nothing exists,
  #      when a package of this version is already on NuGet.org. It also
  #      chooses the starting tag of the generated notes.
  #   2. Create the draft (target: the run's full commit SHA, never a branch;
  #      the generated notes start at the tag chosen in step 1, when there is
  #      one) and upload the assets. An earlier draft at this commit is
  #      deleted and made again, so its notes, title, pre-release flag and
  #      assets all come
  #      from this run. After the upload, the draft is read by its id (still a
  #      draft, at the run's commit, with the uploaded asset names). For a
  #      Release already published, its asset names must equal this run's,
  #      and nothing is uploaded.
  #   3. NuGet login (token exchange).
  #   4. Rehearse mode: delete the draft and stop.
  #   5. Publish mode: push the packages, read the draft again by its id
  #      (the same check as after the upload), publish it (which is expected
  #      to create the tag at the run's commit), then check that the tag
  #      resolves to the run's commit and the Release is no longer a draft.
  # NuGet goes before publication of the Release: it is the step most likely to
  # fail, and a failure there leaves only a draft, which is not public.
  # ===========================================================================
  publish-release:
    name: Publish artifacts to GitHub Release and NuGet
    runs-on: ubuntu-latest
    # docker-integration is the release gate: no draft, asset or NuGet push for a
    # commit whose Docker lane has not passed. Listed here as well as through
    # sign-and-attest so the gate does not depend on the transitive edge.
    needs: [prepare, docker-integration, tls-transport, build-dotnet, sign-and-attest, smoke-test-packaged-tool, smoke-test-distribution-platforms]
    if: inputs.mode != 'validate' && github.ref == 'refs/heads/main' && github.repository == 'tomas-rampas/vouchfx'
    environment: release
    # A bound on a call that hangs; the default is 360 minutes. The wait for
    # approval of the environment comes before the job starts and does not
    # count. The limit is many times the longest run of this job so far.
    timeout-minutes: 30

    permissions:
      contents: write   # create, upload to, publish and delete the Release
      id-token: write   # mint GitHub OIDC token for NuGet Trusted Publishing
      # id-token is necessarily job-scoped (Actions has no step-level
      # permissions), so every step in this job could technically mint an
      # OIDC token; accepted — splitting a minimal publish job was judged
      # riskier than this residual surface.

    env:
      MODE:    ${{ inputs.mode }}
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG:     ${{ needs.prepare.outputs.tag }}
      # GitHub's list of releases can lag behind a write by a second or more
      # (seen in the first rehearsal: the list showed no draft just after the
      # draft was created). The steps that read the list, a release or the tag
      # after a write try this many times in all, this many seconds apart: about
      # a minute at most. The steps that use these two values check them first
      # (a whole number from 1 to 99 and one from 0 to 99). The contract tests
      # set the delay to 0.
      RELEASE_READ_ATTEMPTS: "12"
      RELEASE_READ_DELAY_SECONDS: "5"

    steps:
      - name: Checkout the run's commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Test the release helper scripts
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/tests -p test_check_nuget_presence.py -v
          python3 -m unittest discover -s scripts/tests -p test_release_metadata.py -v

      # Reads the tag with git and the releases (drafts included, which needs
      # this job's contents: write) with the API. Writes `state`: none, draft or
      # published, `draft_id` for a draft, and `notes_start_tag`, the starting
      # tag of the generated notes (empty when there is none). A rehearsal
      # needs a clean slate, so that its clean-up step can only ever delete the
      # draft this job made.
      # The id comes before the target in each line: the target may be empty,
      # and `read` with a tab separator would merge two tabs in a row.
      - name: Classify the release state
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! listing="$(git ls-remote --tags origin)"; then
            echo "::error::Could not read the remote tags."
            exit 1
          fi
          tag_sha="$(awk -F'\t' -v ref="refs/tags/$TAG" '$2 == ref "^{}" { peeled = $1 } $2 == ref { direct = $1 } END { print (peeled != "" ? peeled : direct) }' <<<"$listing")"
          if ! releases="$(gh api --paginate "repos/${GH_REPO}/releases?per_page=100" --jq '.[] | [.tag_name, (.draft | tostring), (.id | tostring), .target_commitish] | @tsv')"; then
            echo "::error::Could not read the releases."
            exit 1
          fi
          matches="$(awk -F'\t' -v tag="$TAG" '$1 == tag' <<<"$releases")"
          count="$(grep -c . <<<"$matches" || true)"

          if [[ -n "$tag_sha" && "$tag_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::Tag '$TAG' resolves to $tag_sha, not to this run's commit $GITHUB_SHA."
            exit 1
          fi
          if [[ "$count" -gt 1 ]]; then
            echo "::error::$count releases or drafts exist for '$TAG'. Delete the extra drafts by hand."
            exit 1
          fi

          state=none
          draft_id=""
          if [[ "$count" -eq 1 ]]; then
            IFS=$'\t' read -r _ draft id target <<<"$matches"
            if [[ "$draft" == "true" ]]; then
              draft_id="$id"
              if [[ "$target" != "$GITHUB_SHA" ]]; then
                echo "::error::The draft for '$TAG' targets '$target', not this run's commit $GITHUB_SHA. Delete the draft by hand."
                exit 1
              fi
              state=draft
            else
              if [[ -z "$tag_sha" ]]; then
                echo "::error::A published Release for '$TAG' exists but its tag cannot be found."
                exit 1
              fi
              state=published
            fi
          fi

          if [[ "$MODE" == "rehearse" && ( "$state" != "none" || -n "$tag_sha" ) ]]; then
            echo "::error::A rehearsal needs no existing tag, draft or Release for '$TAG' (found state '$state'). Rehearse another version."
            exit 1
          fi

          # `prepare` applies the same rule before the build. It is checked
          # again here for a late re-run of an old run, after a newer stable
          # release. The block between the two marker lines is the same text
          # in both steps; a contract test compares them.
          if [[ "$MODE" == "publish" && "$VERSION" != *-* && ( "$state" == "none" || "$state" == "draft" ) ]]; then
            published="$(awk -F'\t' '$2 == "false" { print $1 }' <<<"$releases")"
            # BEGIN rule: a stable version is not below a published stable Release
            # A stable Release is marked "Latest". Publishing an older stable
            # version would take "Latest" from a newer one, so it is refused.
            # `sort -V` orders plain X.Y.Z versions numerically. A pre-release
            # is never marked "Latest". `published` lists the tags of the
            # published Releases, one per line.
            highest="$(awk '/^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/ { print substr($0, 2) }' <<<"$published" | sort -V | tail -n 1)"
            if [[ -n "$highest" && "$(printf '%s\n%s\n' "$highest" "$VERSION" | sort -V | tail -n 1)" != "$VERSION" ]]; then
              echo "::error::Refusing to publish 'v$VERSION': the published Release 'v$highest' is a higher stable version, and 'v$VERSION' would be marked Latest in its place. Release a stable version above $highest instead (see RELEASING.md, case 9)."
              exit 1
            fi
            # END rule
          fi

          # This job makes the draft before it pushes to NuGet.org, so packages
          # of this version on NuGet.org with no draft or Release mean that a
          # draft was deleted after a partial push, or that a re-run deleted
          # its own draft and failed before making a new one. Publishing now
          # could pair another commit's packages with this commit's Release.
          # Only exit 3 means absent; any other failure stops the run.
          if [[ "$MODE" == "publish" && "$state" == "none" ]]; then
            for package in vouchfx Vouchfx.Sdk Vouchfx.Sdk.Testing Vouchfx.Engine.Abstractions Vouchfx.Engine.Authoring Vouchfx.Engine.Compilation; do
              rc=0
              python3 scripts/check_nuget_presence.py --id "$package" --version "$VERSION" || rc=$?
              if [[ "$rc" -eq 0 ]]; then
                echo "::error::$package $VERSION is already on NuGet.org, but no draft or Release exists for '$TAG'. Either an earlier run pushed it and its draft was deleted, or a re-run deleted its own draft and failed before making a new one (see RELEASING.md, case 7)."
                exit 1
              elif [[ "$rc" -ne 3 ]]; then
                echo "::error::Could not check $package $VERSION on NuGet.org."
                exit 1
              fi
            done
          fi

          # The starting tag of GitHub's generated notes: the tag of the highest
          # published stable Release whose X.Y.Z is strictly below this
          # version's X.Y.Z. `1.5.0`, `1.5.0-rc.2` and `1.5.0-rehearsal.3` all
          # start at `v1.4.0` when that is the highest such Release. A draft, a
          # pre-release and a stable Release of the same or a higher number are
          # never chosen. Stable means the strict `vX.Y.Z` pattern of the rule
          # above, and `sort -V` orders the plain X.Y.Z versions as there. This
          # version's X.Y.Z joins the sorted list, and the line before its first
          # copy is the answer. Empty when there is none: the create step then
          # names no starting tag. Without one, GitHub chooses where the notes
          # start, and for the first pre-release it chose an older stable
          # Release than the newest one.
          core="${VERSION%%-*}"
          notes_start_tag="$({ awk -F'\t' '$2 == "false" && $1 ~ /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/ { print substr($1, 2) }' <<<"$releases"; printf '%s\n' "$core"; } | sort -V | awk -v core="$core" 'done { next } $0 == core { if (previous != "") print "v" previous; done = 1; next } { previous = $0 }')"

          {
            echo "state=$state"
            echo "draft_id=$draft_id"
            echo "notes_start_tag=$notes_start_tag"
          } >> "$GITHUB_OUTPUT"
          echo "Release state for $TAG: $state (mode $MODE, commit $GITHUB_SHA)"

      - name: Download nupkg
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nuget-package
          path: release-upload/

      - name: Download publish archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: publish-archives
          path: release-upload/

      - name: Download SBOM
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: release-upload/

      - name: Download .vsix
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix
          path: release-upload/

      # sign-and-attest always uploads this artefact; it holds `signing-mode`
      # and, in publish mode, the cosign bundles and GPG signatures. It goes to
      # its own directory so that `signing-mode` is never uploaded as an asset.
      - name: Download signing material (cosign bundles, GPG signatures)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signing-material
          path: signing-material/

      - name: Download MSI installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: msi-installer
          path: release-upload/

      - name: Download .deb package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deb-package
          path: release-upload/

      - name: Download .pkg installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pkg-installer
          path: release-upload/

      - name: List release artifacts
        run: |
          echo "Artifacts to attach to the release $TAG:"
          find release-upload/ signing-material/ -type f | sort

      # Creates the draft when nothing exists. When a draft at this commit
      # exists (an earlier attempt of this run, or an earlier run), reads it
      # again by its id, deletes it only if it is still that draft, and creates
      # a new one, so that the notes, title, pre-release flag and every asset
      # come from this run. For a Release that is already
      # published (a re-run after publication), uploads nothing and fails
      # unless its asset names are exactly the names this run would upload.
      # The draft's target is the run's full commit SHA, so publishing it later
      # is expected to create the tag at the tested commit. Notes: the
      # CHANGELOG.md section for the version, then GitHub's generated notes
      # (`--notes-file` with `--generate-notes`: the file's text is put in
      # front of them). The generated notes start at `NOTES_START_TAG`, which
      # the classification chose (`--notes-start-tag`); when it is empty, the
      # option is left out. The step prints the draft's `Full Changelog` line
      # at its end, as evidence of where the notes start. `attempted=true` is
      # written just before the create call:
      # that call can fail after GitHub stored the draft, so it tells the
      # rehearsal clean-up that a draft may exist. `created=true` tells it that
      # this step made a draft. `new_draft_id` is the id of the new draft, once
      # the release tool has found it. After the upload this step reads the
      # draft by that id until it holds the uploaded assets, before any NuGet
      # push; the publication step reads it again by that id.
      - name: Create the draft release and upload the assets
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          STATE: ${{ steps.state.outputs.state }}
          DRAFT_ID: ${{ steps.state.outputs.draft_id }}
          NOTES_START_TAG: ${{ steps.state.outputs.notes_start_tag }}
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_READ_ATTEMPTS:-}" =~ ^[1-9][0-9]?$ || ! "${RELEASE_READ_DELAY_SECONDS:-}" =~ ^[0-9]{1,2}$ ]]; then
            echo "::error::The read bounds are not usable: RELEASE_READ_ATTEMPTS is '${RELEASE_READ_ATTEMPTS:-}' (a whole number from 1 to 99 is needed) and RELEASE_READ_DELAY_SECONDS is '${RELEASE_READ_DELAY_SECONDS:-}' (a whole number from 0 to 99 is needed). Nothing was read, created, uploaded or verified by this step."
            exit 1
          fi
          if [[ "$(cat signing-material/signing-mode)" != "$MODE" ]]; then
            echo "::error::The signing material was made for another mode."
            exit 1
          fi
          mapfile -d '' files < <(find release-upload/ signing-material/ -type f ! -name signing-mode -print0 | sort -z)
          # A failure inside the process substitution is not seen by `set -e`,
          # and an empty list would compare equal to a Release with no assets.
          if [[ "${#files[@]}" -eq 0 ]]; then
            echo "::error::No release files were found."
            exit 1
          fi
          duplicates="$(printf '%s\n' "${files[@]##*/}" | sort | uniq -d)"
          if [[ -n "$duplicates" ]]; then
            echo "::error::Two assets share a name: $duplicates"
            exit 1
          fi

          # The notes, the pre-release flag and the starting tag of the
          # generated notes are made and checked before any earlier draft is
          # deleted, so that a failure here leaves that draft in place. A
          # published Release needs none of them.
          notes="$RUNNER_TEMP/release-notes.md"
          prerelease=()
          notes_start=()
          if [[ "$STATE" == "none" || "$STATE" == "draft" ]]; then
            if [[ "$MODE" == "publish" ]]; then
              python3 scripts/release_metadata.py notes --changelog CHANGELOG.md --version "$VERSION" > "$notes"
            else
              printf '%s\n' "Rehearsal draft made by the release workflow. It is deleted when the rehearsal ends and is never published." > "$notes"
            fi
            if [[ "$VERSION" == *-* ]]; then
              prerelease=(--prerelease)
            fi
            # The classification chose the starting tag of the generated notes,
            # or none when no stable Release is below this version.
            if [[ -z "$NOTES_START_TAG" ]]; then
              echo "No published stable Release is below $TAG, so no starting tag is passed: GitHub chooses where the generated notes start."
            elif [[ "$NOTES_START_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              notes_start=(--notes-start-tag "$NOTES_START_TAG")
              echo "The generated notes start at $NOTES_START_TAG (--notes-start-tag)."
            else
              echo "::error::The starting tag for the generated notes is $(printf '%q' "$NOTES_START_TAG") (shown shell-quoted), not of the form vX.Y.Z. This is a defect in the workflow. Nothing was deleted, created or uploaded by this step."
              exit 1
            fi
          fi

          case "$STATE" in
            none) ;;
            draft)
              if [[ ! "$DRAFT_ID" =~ ^[0-9]+$ ]]; then
                echo "::error::The draft for $TAG has no usable id ('$DRAFT_ID')."
                exit 1
              fi
              # The releases were listed earlier in this job. The draft may have
              # been published, or moved to another tag or commit, since. This
              # read narrows that window;
              # it does not close it, as the release can still change between
              # the read and the delete.
              if ! current="$(gh api "repos/${GH_REPO}/releases/${DRAFT_ID}" --jq '[.tag_name, (.draft | tostring), .target_commitish] | @tsv')" \
                 || [[ "$current" != "$TAG"$'\t'"true"$'\t'"$GITHUB_SHA" ]]; then
                echo "::error::Release $DRAFT_ID could not be read, or is no longer the draft for $TAG at $GITHUB_SHA; nothing was deleted."
                exit 1
              fi
              gh api -X DELETE "repos/${GH_REPO}/releases/${DRAFT_ID}"
              echo "Deleted the earlier draft $DRAFT_ID for $TAG; this run replaces it with a new draft."
              ;;
            published)
              if ! published="$(gh api "repos/${GH_REPO}/releases/tags/${TAG}" --jq '.assets[].name')"; then
                echo "::error::Could not read the assets of the published Release $TAG."
                exit 1
              fi
              if [[ "$(sort <<<"$published")" != "$(printf '%s\n' "${files[@]##*/}" | sort)" ]]; then
                echo "::error::The published Release $TAG does not hold this run's assets: its asset names differ from the ${#files[@]} files this run would upload. This run uploads nothing and pushes nothing to NuGet.org."
                exit 1
              fi
              echo "The Release $TAG is already published with an asset of each name this run would upload; nothing is uploaded."
              exit 0
              ;;
            *)
              echo "::error::Unknown release state '$STATE'."
              exit 1
              ;;
          esac

          echo "attempted=true" >> "$GITHUB_OUTPUT"
          gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "$TAG" \
            --notes-file "$notes" --generate-notes "${notes_start[@]}" "${prerelease[@]}"
          echo "created=true" >> "$GITHUB_OUTPUT"

          # Read the new draft back before anything is uploaded or pushed. The
          # classification can compare a draft's target with this run's commit
          # only on a later attempt. This proves the round trip in a rehearsal,
          # before any NuGet push. GitHub returns the full SHA for a draft made
          # with a full SHA as its target (seen in the second rehearsal and in
          # the first release). That the list of releases lags
          # behind the create is observed: it showed no draft just after the
          # create. So the read is tried again, up to RELEASE_READ_ATTEMPTS
          # times, while the list fails or shows nothing for the tag. The
          # earlier draft deleted above (state `draft`) is left out, because a
          # lagging list can still show it. One entry is judged at once, and so
          # are several: a wrong target or draft flag is not lag, and the list
          # does not invent entries.
          skip_id=""
          if [[ "$STATE" == "draft" ]]; then
            skip_id="$DRAFT_ID"
          fi
          readback_done=false
          readback_listed=false
          for ((attempt = 1; attempt <= RELEASE_READ_ATTEMPTS; attempt++)); do
            if [[ "$attempt" -gt 1 ]]; then
              sleep "$RELEASE_READ_DELAY_SECONDS"
            fi
            if ! readback="$(gh api --paginate "repos/${GH_REPO}/releases?per_page=100" --jq '.[] | [.tag_name, (.draft | tostring), (.id | tostring), .target_commitish] | @tsv')"; then
              readback_listed=false
              continue
            fi
            readback_listed=true
            readback_matches="$(awk -F'\t' -v tag="$TAG" -v skip="$skip_id" '$1 == tag && $3 != skip' <<<"$readback")"
            readback_count="$(grep -c . <<<"$readback_matches" || true)"
            if [[ "$readback_count" -eq 0 ]]; then
              continue
            fi
            readback_draft=""
            readback_id=""
            readback_target=""
            if [[ "$readback_count" -eq 1 ]]; then
              IFS=$'\t' read -r _ readback_draft readback_id readback_target <<<"$readback_matches"
            fi
            if [[ "$readback_count" -ne 1 || "$readback_draft" != "true" || "$readback_target" != "$GITHUB_SHA" ]]; then
              echo "::error::The new draft for $TAG did not read back as expected: entries found for the tag: $readback_count, draft flag '$readback_draft', target '$readback_target'; expected exactly one draft with target $GITHUB_SHA. Nothing was uploaded and nothing was pushed to NuGet.org."
              exit 1
            fi
            readback_done=true
            echo "The list of releases shows the new draft for $TAG on attempt $attempt of $RELEASE_READ_ATTEMPTS."
            break
          done
          if [[ "$readback_done" != "true" ]]; then
            if [[ "$readback_listed" != "true" ]]; then
              echo "::error::Could not read the releases back after creating the draft for $TAG. Nothing was uploaded and nothing was pushed to NuGet.org."
            else
              echo "::error::The list of releases did not show the new draft for $TAG after $RELEASE_READ_ATTEMPTS attempts. Nothing was uploaded and nothing was pushed to NuGet.org. In publish mode the draft may exist: wait a few minutes, check that the Releases page lists exactly one draft for $TAG, then \"Re-run failed jobs\" replaces it. A rehearsal deletes its draft in the clean-up step."
            fi
            exit 1
          fi
          # The upload tool looks a draft up by its tag, through its own lookup,
          # and that lookup may not find a draft a few seconds old. So, within
          # the same bounds as the read-back, this waits until the tool finds a
          # release for the tag. It also checks that the tool resolves the tag to
          # the very draft that was read back (its id, still a draft, at this
          # run's commit): a different release is not lag, and it fails at once.
          # The upload then runs once. An upload error is not tried again,
          # because it may not be lag (an existing asset, a file that is too
          # large) and a repeat could upload the whole set again.
          view_done=false
          for ((attempt = 1; attempt <= RELEASE_READ_ATTEMPTS; attempt++)); do
            if [[ "$attempt" -gt 1 ]]; then
              sleep "$RELEASE_READ_DELAY_SECONDS"
            fi
            if ! found="$(gh release view "$TAG" --json databaseId,isDraft,targetCommitish --jq '[(.databaseId | tostring), (.isDraft | tostring), .targetCommitish] | @tsv')"; then
              continue
            fi
            # The tool's lookup can lag in the same way as the list and still
            # answer with the draft this step deleted. That release is gone, so
            # nothing can be uploaded to it: this counts as an attempt.
            if [[ -n "$skip_id" && "${found%%$'\t'*}" == "$skip_id" ]]; then
              continue
            fi
            expected="$readback_id"$'\t'"true"$'\t'"$GITHUB_SHA"
            if [[ "$found" != "$expected" ]]; then
              echo "::error::The release the tool finds for $TAG is not the draft this run created and read back. It found (id, draft flag, target) '${found//$'\t'/ }' but expected '${expected//$'\t'/ }'. Nothing was uploaded and nothing was pushed to NuGet.org."
              exit 1
            fi
            view_done=true
            echo "The release tool finds the draft for $TAG on attempt $attempt of $RELEASE_READ_ATTEMPTS."
            break
          done
          if [[ "$view_done" != "true" ]]; then
            echo "::error::The tool did not find the draft for $TAG after $RELEASE_READ_ATTEMPTS attempts, although the list of releases shows it. Nothing was uploaded and nothing was pushed to NuGet.org. In publish mode the draft is left in place: wait a few minutes, check that the Releases page lists exactly one draft for $TAG, then \"Re-run failed jobs\" replaces it. A rehearsal deletes its draft in the clean-up step."
            exit 1
          fi
          echo "new_draft_id=$readback_id" >> "$GITHUB_OUTPUT"
          echo "Uploading ${#files[@]} files to the draft $TAG..."
          if ! gh release upload "$TAG" "${files[@]}" --clobber; then
            echo "::error::The upload to the draft for $TAG failed. Nothing was pushed to NuGet.org. In publish mode the draft is left in place: \"Re-run failed jobs\" replaces it. A rehearsal deletes its draft in the clean-up step."
            exit 1
          fi
          # Read the draft by its id once the upload has ended, in both modes and
          # before any NuGet push, so that a failure here costs nothing. The step
          # `Publish the draft release` runs the same check again just before the
          # publishing call. The block between the two marker lines is the same
          # text in both steps; a contract test compares them.
          new_draft_id="$readback_id"
          recovery="Nothing was pushed to NuGet.org. In publish mode the draft is left in place: look at it on the Releases page before you use \"Re-run failed jobs\" (see RELEASING.md); it replaces a draft, not a published Release. A rehearsal deletes its draft in the clean-up step."
          # BEGIN check: the draft holds the assets this run uploaded
          # The draft is read by its id: it must still be the draft for the tag,
          # at this run's commit, with the asset name of each file this run
          # uploaded and no other. A read that fails, or asset names that are
          # a strict subset of the uploaded ones, may be lag, so the read is
          # tried again up to RELEASE_READ_ATTEMPTS times. Another tag, draft
          # flag or target, or a name this run did not upload, is not lag: it
          # stops at once. `files`, `new_draft_id` and `recovery` are set
          # before this block.
          if [[ ! "$new_draft_id" =~ ^[0-9]+$ ]]; then
            echo "::error::The draft for $TAG has no usable id ('$new_draft_id'), so it cannot be read again. This is a defect in the workflow: do not re-run before it is understood. $recovery"
            exit 1
          fi
          uploaded="$(printf '%s\n' "${files[@]##*/}" | sort)"
          expected="$TAG"$'\t'"true"$'\t'"$GITHUB_SHA"
          draft_checked=false
          draft_problem="not-checked"
          for ((attempt = 1; attempt <= RELEASE_READ_ATTEMPTS; attempt++)); do
            if [[ "$attempt" -gt 1 ]]; then
              sleep "$RELEASE_READ_DELAY_SECONDS"
            fi
            if ! current="$(gh api "repos/${GH_REPO}/releases/${new_draft_id}" --jq '([.tag_name, (.draft | tostring), .target_commitish] | @tsv), .assets[].name')"; then
              draft_problem="unreadable"
              continue
            fi
            found="$(head -n 1 <<<"$current")"
            if [[ "$found" != "$expected" ]]; then
              echo "::error::Release $new_draft_id is no longer the draft for $TAG at this run's commit: it reads (tag, draft flag, target) '${found//$'\t'/ }' where '${expected//$'\t'/ }' was expected. $recovery"
              exit 1
            fi
            assets="$(tail -n +2 <<<"$current" | sort)"
            if [[ "$assets" == "$uploaded" ]]; then
              draft_checked=true
              echo "Release $new_draft_id is the draft for $TAG at this run's commit, with the ${#files[@]} uploaded assets, on attempt $attempt of $RELEASE_READ_ATTEMPTS."
              break
            fi
            # Each asset name that is not one of the uploaded names, counted
            # as often as it is listed beyond the uploaded ones.
            foreign="$(awk 'NR == FNR { if ($0 != "") wanted[$0]++; next } $0 != "" && !(wanted[$0]-- > 0)' <(printf '%s\n' "$uploaded") <(printf '%s\n' "$assets"))"
            if [[ -n "$foreign" ]]; then
              echo "::error::The draft $new_draft_id for $TAG holds asset names that this run did not upload ($(grep -c . <<<"$foreign") of them). $recovery"
              exit 1
            fi
            draft_problem="assets-missing"
          done
          if [[ "$draft_checked" != "true" ]]; then
            case "$draft_problem" in
              unreadable)
                echo "::error::Could not read the draft $new_draft_id for $TAG on the last of $RELEASE_READ_ATTEMPTS attempts. $recovery"
                ;;
              assets-missing)
                echo "::error::The draft $new_draft_id for $TAG still lacks assets this run uploaded after $RELEASE_READ_ATTEMPTS attempts: it has $(grep -c . <<<"$assets" || true) of the ${#files[@]} asset names. $recovery"
                ;;
              *)
                echo "::error::Nothing was checked: no attempt read the draft $new_draft_id for $TAG. $recovery"
                ;;
            esac
            exit 1
          fi
          # END check
          # Evidence of where the generated notes start, after every check
          # above has passed. A rehearsal deletes its draft, so its log is the
          # only record. GitHub ends the generated notes with a line that
          # begins `**Full Changelog**:` and links `compare/<start>...<tag>`.
          # Only that line is printed, after a prefix, so that no other text
          # of the body (pull request titles) reaches the log. Nothing here
          # fails the step: the draft is already checked.
          if ! body="$(gh api "repos/${GH_REPO}/releases/${new_draft_id}" --jq '.body')"; then
            echo "::warning::Could not read the notes of the draft $new_draft_id for $TAG, so where the generated notes start is not shown. Read the Full Changelog link on the Release page."
          else
            changelog_line="$(grep -E '^\*\*Full Changelog\*\*: ' <<<"${body//$'\r'/}" | tail -n 1 || true)"
            if [[ -z "$changelog_line" ]]; then
              echo "The notes of the draft $new_draft_id for $TAG have no Full Changelog line."
            else
              echo "Full Changelog line of the draft $new_draft_id: $changelog_line"
            fi
            if [[ "${#notes_start[@]}" -gt 0 && "$changelog_line" != *"compare/${NOTES_START_TAG}..."* ]]; then
              echo "::warning::The notes of the draft for $TAG were made with --notes-start-tag $NOTES_START_TAG, but their Full Changelog line does not link compare/${NOTES_START_TAG}... Read the notes on the Release page and correct them by hand if they start elsewhere (see RELEASING.md)."
            fi
          fi
          echo "Done."

      # Exchange the single-use GitHub OIDC token for a short-lived
      # (~1 hour), reusable NuGet.org API key via the Trusted Publishing
      # policy configured on nuget.org (Package Owner "Tomas.R"): Repository
      # tomas-rampas/vouchfx, Workflow File release.yml. It runs in rehearse
      # mode too, which proves the exchange without pushing anything. Forks
      # never reach it: the job's `if` names this repository.
      - name: NuGet login (OIDC → short-lived API key)
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: Tomas.R

      # Rehearse mode ends here. `always()` is deliberate and is the only
      # status-check function on a step of this job: the rehearsal draft must
      # be deleted even when a step after its creation failed or the run was
      # cancelled. It runs only when the classification found nothing for the
      # tag (state `none`), so any draft for the tag was made by this job.
      # It lists the releases again after the deletion and fails if anything
      # for the tag remains. When the draft step reported that it started the
      # creation of a draft (`attempted`; `created` says it finished) but the
      # list shows none, the list may lag behind: it reads again. If the draft
      # was created and still does not show, it fails rather than end green. If
      # the creation was started but did not finish, it ends green with a
      # warning to check by hand, because GitHub may or may not have stored the
      # draft. The list can equally still show the draft after its deletion, so
      # that read is repeated too. This step is the safety net, so bounds that
      # are not usable do not stop it: it warns and makes one read, with no
      # delay.
      - name: Rehearsal — delete the draft release
        if: always() && inputs.mode == 'rehearse' && steps.state.outputs.state == 'none'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CREATED: ${{ steps.create.outputs.created }}
          ATTEMPTED: ${{ steps.create.outputs.attempted }}
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_READ_ATTEMPTS:-}" =~ ^[1-9][0-9]?$ || ! "${RELEASE_READ_DELAY_SECONDS:-}" =~ ^[0-9]{1,2}$ ]]; then
            echo "::warning::The read bounds are not usable: RELEASE_READ_ATTEMPTS is '${RELEASE_READ_ATTEMPTS:-}' (a whole number from 1 to 99 is needed) and RELEASE_READ_DELAY_SECONDS is '${RELEASE_READ_DELAY_SECONDS:-}' (a whole number from 0 to 99 is needed). This step makes one attempt and waits for nothing."
            RELEASE_READ_ATTEMPTS=1
            RELEASE_READ_DELAY_SECONDS=0
          fi
          list_releases() {
            gh api --paginate "repos/${GH_REPO}/releases?per_page=100" --jq '.[] | [.tag_name, (.draft | tostring), (.id | tostring)] | @tsv'
          }
          # One read, as a rule. When the draft step started the creation of a
          # draft, the list may lag behind that write, so it is read up to
          # RELEASE_READ_ATTEMPTS times until it shows a draft for the tag; a
          # failed read is tried again too.
          reads=1
          if [[ "$ATTEMPTED" == "true" ]]; then
            reads="$RELEASE_READ_ATTEMPTS"
          fi
          ids=""
          listed=false
          for ((attempt = 1; attempt <= reads; attempt++)); do
            if [[ "$attempt" -gt 1 ]]; then
              sleep "$RELEASE_READ_DELAY_SECONDS"
            fi
            if ! releases="$(list_releases)"; then
              listed=false
              continue
            fi
            listed=true
            if awk -F'\t' -v tag="$TAG" '$1 == tag && $2 != "true" { found = 1 } END { exit !found }' <<<"$releases"; then
              echo "::error::A published Release for '$TAG' exists; a rehearsal never publishes. Investigate."
              exit 1
            fi
            ids="$(awk -F'\t' -v tag="$TAG" '$1 == tag && $2 == "true" { print $3 }' <<<"$releases")"
            if [[ -n "$ids" ]]; then
              echo "The list of releases shows a rehearsal draft for $TAG on attempt $attempt of $reads."
              break
            fi
          done
          if [[ "$listed" != "true" ]]; then
            echo "::error::Could not read the releases; delete the rehearsal draft for '$TAG' by hand."
            exit 1
          fi
          if [[ -z "$ids" ]]; then
            if [[ "$CREATED" == "true" ]]; then
              echo "::error::This job created a rehearsal draft for '$TAG', but the list of releases does not show it. Look for the draft by hand and delete it."
              exit 1
            fi
            if [[ "$ATTEMPTED" == "true" ]]; then
              echo "::warning::This job started the creation of a rehearsal draft for '$TAG' and the creation failed. The list of releases shows no draft for '$TAG' after $reads attempts. Check the Releases page by hand for a draft for '$TAG' and delete it if there is one."
              exit 0
            fi
            echo "No rehearsal draft for $TAG to delete."
            exit 0
          fi
          for id in $ids; do
            gh api -X DELETE "repos/${GH_REPO}/releases/${id}"
            echo "Deleted the rehearsal draft $id for $TAG."
          done
          # The list can still show the draft just after its deletion, so read it
          # again, up to RELEASE_READ_ATTEMPTS times, until nothing remains.
          clean=false
          listed=false
          for ((attempt = 1; attempt <= RELEASE_READ_ATTEMPTS; attempt++)); do
            if [[ "$attempt" -gt 1 ]]; then
              sleep "$RELEASE_READ_DELAY_SECONDS"
            fi
            if ! releases="$(list_releases)"; then
              listed=false
              continue
            fi
            listed=true
            if ! awk -F'\t' -v tag="$TAG" '$1 == tag { found = 1 } END { exit !found }' <<<"$releases"; then
              clean=true
              echo "The list of releases shows nothing for $TAG on attempt $attempt of $RELEASE_READ_ATTEMPTS after the deletion."
              break
            fi
          done
          if [[ "$clean" != "true" ]]; then
            if [[ "$listed" != "true" ]]; then
              echo "::error::Could not read the releases after the deletion; check by hand that no draft for '$TAG' remains."
            else
              echo "::error::A release or draft for '$TAG' remains after the deletion. Delete it by hand."
            fi
            exit 1
          fi

      # Publish the nupkg to NuGet.org — TRUSTED-PUBLISHING-GATED, publish mode only.
      # Install: dotnet tool install -g vouchfx
      # Package: https://www.nuget.org/packages/vouchfx/
      - name: Publish nupkg to NuGet.org — Trusted Publishing
        if: inputs.mode == 'publish'
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          # A second line of defence behind `prepare` and this step's `if`:
          # only publish mode pushes, and never a version reserved for
          # validation or rehearsal (a -rehearsal or -validate pre-release, in
          # any letter case, or a 0.0.0- version).
          reserved_pre="${VERSION#*-}"
          reserved_pre="${reserved_pre,,}"
          if [[ "$MODE" != "publish" || "$VERSION" == 0.0.0-* || ( "$VERSION" == *-* && "$reserved_pre" =~ ^(rehearsal|validate)(\.|$) ) ]]; then
            echo "::error::Refusing to push mode '$MODE', version '$VERSION': only publish mode pushes, and never a version reserved for validation or rehearsal. Nothing was pushed to NuGet.org."
            exit 1
          fi
          # Non-fatal per package: glob order pushes the five Vouchfx.* SDK
          # packages BEFORE vouchfx, and a first-time 403 on a new ID (policy
          # scope, prefix squat) must not hold the primary CLI publish hostage.
          # Every failure is still reported and fails the step at the end, so
          # the Release stays a draft; "Re-run failed jobs" completes the
          # missing pushes via the presence check and --skip-duplicate once the
          # policy issue is fixed.
          rc=0
          for nupkg in release-upload/*.nupkg; do
            # Avoid uploading an immutable version again (the large CLI can
            # time out before NuGet returns its duplicate response).
            if python3 scripts/check_nuget_presence.py "$nupkg"; then
              echo "Skipping existing primary package: $nupkg"
            else
              check_rc=$?
              if [[ "$check_rc" -ne 3 ]]; then
                echo "::error::Presence check failed for $nupkg — refusing its push."
                rc=1
                continue
              fi
              echo "Pushing: $nupkg"
              if ! dotnet nuget push "$nupkg" \
                --api-key "$NUGET_API_KEY" \
                --source https://api.nuget.org/v3/index.json \
                --no-symbols --skip-duplicate; then
                echo "::error::Push failed for $nupkg — continuing with remaining packages."
                rc=1
                continue
              fi
            fi
            # Symbols may still need recovery even when the primary is public.
            # Publish only this package's matching archive, after its primary.
            symbols="${nupkg%.nupkg}.snupkg"
            if [[ -f "$symbols" ]]; then
              echo "Pushing symbols: $symbols"
              if ! dotnet nuget push "$symbols" \
                --api-key "$NUGET_API_KEY" \
                --source https://api.nuget.org/v3/index.json \
                --skip-duplicate; then
                echo "::error::Symbol push failed for $symbols — continuing with remaining packages."
                rc=1
              fi
            fi
          done
          exit $rc

      # Publish mode only, after every NuGet push succeeded. Publishing the
      # draft is expected to create the lightweight tag at the draft's target,
      # this run's commit; the next step checks it. Only a stable version is
      # marked "latest". On a re-run after publication there is nothing to do.
      # Just before the publishing call, the draft that the upload step found
      # is read again by its id: it must still be a draft for the tag, at this
      # run's commit, with the asset names this run uploaded. That read is
      # tried again within the job's read bounds, which this step checks
      # first, before any call. The publishing call itself still names the
      # tag: it is the call the first release used, and a call by id cannot
      # be tried before the next real release.
      - name: Publish the draft release
        if: inputs.mode == 'publish'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          STATE: ${{ steps.state.outputs.state }}
          NEW_DRAFT_ID: ${{ steps.create.outputs.new_draft_id }}
        run: |
          set -euo pipefail
          recovery="Nothing was published to GitHub Releases. The packages of $VERSION may already be on NuGet.org: see RELEASING.md, case 4."
          if [[ ! "${RELEASE_READ_ATTEMPTS:-}" =~ ^[1-9][0-9]?$ || ! "${RELEASE_READ_DELAY_SECONDS:-}" =~ ^[0-9]{1,2}$ ]]; then
            echo "::error::The read bounds are not usable: RELEASE_READ_ATTEMPTS is '${RELEASE_READ_ATTEMPTS:-}' (a whole number from 1 to 99 is needed) and RELEASE_READ_DELAY_SECONDS is '${RELEASE_READ_DELAY_SECONDS:-}' (a whole number from 0 to 99 is needed). $recovery"
            exit 1
          fi
          case "$STATE" in
            published)
              echo "The Release $TAG is already published."
              exit 0
              ;;
            none|draft) ;;
            *)
              echo "::error::Unknown release state '$STATE'."
              exit 1
              ;;
          esac
          # Look at the tag once more. The classify step read it earlier; a tag
          # made at another commit since then would be kept by the publication,
          # and the Release would point at that commit. This narrows the window;
          # it does not close it.
          if ! listing="$(git ls-remote --tags origin)"; then
            echo "::error::Could not read the remote tags; nothing was published."
            exit 1
          fi
          tag_sha="$(awk -F'\t' -v ref="refs/tags/$TAG" '$2 == ref "^{}" { peeled = $1 } $2 == ref { direct = $1 } END { print (peeled != "" ? peeled : direct) }' <<<"$listing")"
          if [[ -n "$tag_sha" && "$tag_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::Tag '$TAG' now resolves to $tag_sha, not to this run's commit $GITHUB_SHA; nothing was published."
            exit 1
          fi
          # Read the draft again by its id. The pushes took time, and the
          # release can change in that time. This narrows the window; it does
          # not close it. The asset names are those of the files the upload
          # step sent, found the same way. The step that made the draft ran the
          # same check after its upload. The block between the two marker
          # lines is the same text in both steps; a contract test compares
          # them.
          mapfile -d '' files < <(find release-upload/ signing-material/ -type f ! -name signing-mode -print0 | sort -z)
          if [[ "${#files[@]}" -eq 0 ]]; then
            echo "::error::No release files were found. $recovery"
            exit 1
          fi
          new_draft_id="$NEW_DRAFT_ID"
          # BEGIN check: the draft holds the assets this run uploaded
          # The draft is read by its id: it must still be the draft for the tag,
          # at this run's commit, with the asset name of each file this run
          # uploaded and no other. A read that fails, or asset names that are
          # a strict subset of the uploaded ones, may be lag, so the read is
          # tried again up to RELEASE_READ_ATTEMPTS times. Another tag, draft
          # flag or target, or a name this run did not upload, is not lag: it
          # stops at once. `files`, `new_draft_id` and `recovery` are set
          # before this block.
          if [[ ! "$new_draft_id" =~ ^[0-9]+$ ]]; then
            echo "::error::The draft for $TAG has no usable id ('$new_draft_id'), so it cannot be read again. This is a defect in the workflow: do not re-run before it is understood. $recovery"
            exit 1
          fi
          uploaded="$(printf '%s\n' "${files[@]##*/}" | sort)"
          expected="$TAG"$'\t'"true"$'\t'"$GITHUB_SHA"
          draft_checked=false
          draft_problem="not-checked"
          for ((attempt = 1; attempt <= RELEASE_READ_ATTEMPTS; attempt++)); do
            if [[ "$attempt" -gt 1 ]]; then
              sleep "$RELEASE_READ_DELAY_SECONDS"
            fi
            if ! current="$(gh api "repos/${GH_REPO}/releases/${new_draft_id}" --jq '([.tag_name, (.draft | tostring), .target_commitish] | @tsv), .assets[].name')"; then
              draft_problem="unreadable"
              continue
            fi
            found="$(head -n 1 <<<"$current")"
            if [[ "$found" != "$expected" ]]; then
              echo "::error::Release $new_draft_id is no longer the draft for $TAG at this run's commit: it reads (tag, draft flag, target) '${found//$'\t'/ }' where '${expected//$'\t'/ }' was expected. $recovery"
              exit 1
            fi
            assets="$(tail -n +2 <<<"$current" | sort)"
            if [[ "$assets" == "$uploaded" ]]; then
              draft_checked=true
              echo "Release $new_draft_id is the draft for $TAG at this run's commit, with the ${#files[@]} uploaded assets, on attempt $attempt of $RELEASE_READ_ATTEMPTS."
              break
            fi
            # Each asset name that is not one of the uploaded names, counted
            # as often as it is listed beyond the uploaded ones.
            foreign="$(awk 'NR == FNR { if ($0 != "") wanted[$0]++; next } $0 != "" && !(wanted[$0]-- > 0)' <(printf '%s\n' "$uploaded") <(printf '%s\n' "$assets"))"
            if [[ -n "$foreign" ]]; then
              echo "::error::The draft $new_draft_id for $TAG holds asset names that this run did not upload ($(grep -c . <<<"$foreign") of them). $recovery"
              exit 1
            fi
            draft_problem="assets-missing"
          done
          if [[ "$draft_checked" != "true" ]]; then
            case "$draft_problem" in
              unreadable)
                echo "::error::Could not read the draft $new_draft_id for $TAG on the last of $RELEASE_READ_ATTEMPTS attempts. $recovery"
                ;;
              assets-missing)
                echo "::error::The draft $new_draft_id for $TAG still lacks assets this run uploaded after $RELEASE_READ_ATTEMPTS attempts: it has $(grep -c . <<<"$assets" || true) of the ${#files[@]} asset names. $recovery"
                ;;
              *)
                echo "::error::Nothing was checked: no attempt read the draft $new_draft_id for $TAG. $recovery"
                ;;
            esac
            exit 1
          fi
          # END check
          latest=(--latest)
          if [[ "$VERSION" == *-* ]]; then
            latest=(--latest=false)
          fi
          gh release edit "$TAG" --draft=false --target "$GITHUB_SHA" "${latest[@]}"
          echo "Published the Release $TAG."

      # Publish mode only. Fails the job, and so skips the Marketplace and the
      # floating tag, unless the tag resolves to this run's commit and the
      # Release is published.
      - name: Verify the tag and the published release
        if: inputs.mode == 'publish'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_READ_ATTEMPTS:-}" =~ ^[1-9][0-9]?$ || ! "${RELEASE_READ_DELAY_SECONDS:-}" =~ ^[0-9]{1,2}$ ]]; then
            echo "::error::The read bounds are not usable: RELEASE_READ_ATTEMPTS is '${RELEASE_READ_ATTEMPTS:-}' (a whole number from 1 to 99 is needed) and RELEASE_READ_DELAY_SECONDS is '${RELEASE_READ_DELAY_SECONDS:-}' (a whole number from 0 to 99 is needed). Nothing was read, created, uploaded or verified by this step."
            exit 1
          fi
          # This step runs straight after the publication, and the tag and the
          # Release can show up a little late. So both are read again, up to
          # RELEASE_READ_ATTEMPTS times, until the tag is at this run's commit and
          # the Release is published. A tag at another commit is not lag: it
          # fails at once. After the last attempt the step fails with what was
          # still wrong. `problem` starts as a failure, so that the step cannot
          # report success unless an attempt read the tag at this run's commit
          # and the Release as published.
          problem="not-checked"
          for ((attempt = 1; attempt <= RELEASE_READ_ATTEMPTS; attempt++)); do
            if [[ "$attempt" -gt 1 ]]; then
              sleep "$RELEASE_READ_DELAY_SECONDS"
            fi
            if ! listing="$(git ls-remote --tags origin)"; then
              problem="tags-unreadable"
              continue
            fi
            tag_sha="$(awk -F'\t' -v ref="refs/tags/$TAG" '$2 == ref "^{}" { peeled = $1 } $2 == ref { direct = $1 } END { print (peeled != "" ? peeled : direct) }' <<<"$listing")"
            if [[ -n "$tag_sha" && "$tag_sha" != "$GITHUB_SHA" ]]; then
              echo "::error::Tag '$TAG' resolves to '$tag_sha', not to this run's commit $GITHUB_SHA."
              exit 1
            fi
            if [[ -z "$tag_sha" ]]; then
              problem="tag-absent"
              continue
            fi
            # This endpoint returns published releases only; a draft gives a 404.
            if ! draft="$(gh api "repos/${GH_REPO}/releases/tags/${TAG}" --jq '.draft')" || [[ "$draft" != "false" ]]; then
              problem="not-published"
              continue
            fi
            problem=""
            echo "The tag and the published Release for $TAG were read on attempt $attempt of $RELEASE_READ_ATTEMPTS."
            break
          done
          case "$problem" in
            "") ;;
            not-checked)
              echo "::error::Nothing was checked: no attempt read the tag and the Release for $TAG."
              exit 1
              ;;
            tags-unreadable)
              echo "::error::Could not read the remote tags."
              exit 1
              ;;
            tag-absent)
              echo "::error::Tag '$TAG' was not found after $RELEASE_READ_ATTEMPTS reads. Publishing the Release should have created it at this run's commit $GITHUB_SHA."
              exit 1
              ;;
            *)
              echo "::error::The Release $TAG is not published."
              exit 1
              ;;
          esac
          echo "Verified: $TAG is at $GITHUB_SHA and its Release is published."

  # ===========================================================================
  # move-floating-tag
  # Moves the floating convenience tags (v1-alpha, v1-rc, v1) to this release,
  # as the last job of the run, in publish mode only. `needs` puts it behind
  # publication; its `if` uses no status-check function, so a failed, cancelled
  # or skipped dependency skips it. Do not add always() or similar to its guard.
  # `tag` is prepare's output, the same value publish-release published under.
  # `expected_sha` is the commit this run tested. The called workflow refuses to
  # move a tag whose release resolves to a different commit, and leaves a tag
  # alone when the floating tag already sits on a newer release of its line (a
  # late re-run of an older run). Which tag a release routes to is decided there.
  # The job holds only `contents: write`, which the called workflow needs to
  # move a tag, and maps no secrets. The called workflow sets the `concurrency`
  # group that serialises tag moves; this job sets none.
  # ===========================================================================
  move-floating-tag:
    name: Move floating tag
    needs: [prepare, publish-release, publish-marketplace]
    if: inputs.mode == 'publish'
    permissions:
      contents: write
    uses: ./.github/workflows/move-floating-tag.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
      expected_sha: ${{ github.sha }}
