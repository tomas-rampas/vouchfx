# .github/workflows/release.yml — vouchfx signed-release pipeline
# =============================================================================
# Release manifest — signing (cosign keyless), SBOM (CycloneDX),
# SLSA build provenance (actions/attest-build-provenance),
# self-contained per-OS executables + installer skeletons.
#
# Triggers
# --------
#   release: [published]   A GitHub Release is published in the UI.
#   push: tags: v*         A version tag (e.g. v1.2.3) is pushed directly.
# NEVER fires on push to a branch or pull_request.
#
# Keyless signing and publishing model — no long-lived private key or API key stored as a secret
# --------------------------------------------------------------------------------------------------
#   1. SLSA provenance (actions/attest-build-provenance@v4.1.1, SHA-pinned)
#      GitHub OIDC token → signed attestation stored with the repo.
#      Verify:  gh attestation verify <file> --repo tomas-rampas/vouchfx
#
#   2. cosign keyless (sigstore/cosign-installer@v3)
#      GitHub OIDC token → Fulcio short-lived cert → Rekor transparency log.
#      Verify:  cosign verify-blob <file> \
#                 --bundle <file>.cosign.bundle \
#                 --certificate-identity-regexp \
#                   '^https://github\.com/tomas-rampas/vouchfx/\.github/workflows/release\.yml@.*' \
#                 --certificate-oidc-issuer https://token.actions.githubusercontent.com
#
#   3. NuGet Trusted Publishing (NuGet/login, SHA-pinned)
#      single-use GitHub OIDC token → nuget.org token exchange → short-lived
#      API key (valid ~1 hour, reusable within that window, minted
#      immediately before push).
#      Gated by a Trusted Publishing policy on nuget.org (Package Owner
#      "Tomas.R"): Repository tomas-rampas/vouchfx, Workflow File
#      release.yml, no Environment. No NUGET_API_KEY secret is stored.
#
#      Publishes six packages per release, all built into artifacts/nuget/:
#        - vouchfx                       (CLI global tool — primary distribution)
#        - Vouchfx.Sdk                  (frozen v1 provider contract)
#        - Vouchfx.Sdk.Testing          (out-of-repo provider test harness)
#        - Vouchfx.Engine.Abstractions  (Verdict/StepOutcome/ScriptGlobalVariables)
#        - Vouchfx.Engine.Authoring     (YAML parser + AST builder)
#        - Vouchfx.Engine.Compilation   (DocumentValidator, RoslynScriptCompiler)
#      --skip-duplicate means a version already live on nuget.org is left
#      untouched — published packages are IMMUTABLE. A bad artifact is never
#      fixed by re-running or re-tagging the same version: ship a new patch
#      version instead.
#      PRE-FLIGHT before the first release that publishes the five new SDK
#      package IDs: confirm on nuget.org that the Trusted Publishing policy
#      permits first-time creation of new IDs from this repo/workflow, and
#      that no third party has registered or prefix-reserved the IDs. A 403
#      on one ID publishes nothing for that ID; fix the policy and re-run the
#      SAME tag — --skip-duplicate completes the missing pushes. A new patch
#      version is only needed if a genuinely broken artifact already shipped.
#
# Secret-gated optional steps (SKIPPED, not failed, when secret is absent)
# -------------------------------------------------------------------------
#   Authenticode (Windows)  CODESIGN_PFX_BASE64 + CODESIGN_PFX_PASSWORD
#   GPG signing (nupkg)     GPG_SIGNING_KEY + GPG_PASSPHRASE
#   Apple notarisation      APPLE_ID + APPLE_TEAM_ID + APPLE_APP_SPECIFIC_PASSWORD
#   VS Code Marketplace     VSCE_PAT (publisher "vouchfx" — see #121; until the
#                           secret exists the extension ships only as the .vsix
#                           attached to the GitHub Release, and the skip is
#                           announced loudly in the run log)
#
# DCP portability caveat — read before expecting self-contained exes to work
# --------------------------------------------------------------------------
# The vouchfx CLI carries Aspire.AppHost.Sdk 13.4.2, which embeds the DCP
# binary path (dcpclipath AssemblyMetadata) at build time from the runner's
# NuGet cache.  The embedded path is ABSOLUTE and machine-specific — e.g.
# /home/runner/.nuget/packages/aspire.hosting.orchestration.linux-x64/13.4.2/tools/dcp
# on this pipeline's runner — and that literal path does NOT exist on a
# user's machine (wrong absolute root and, on non-Linux, the wrong RID too).
#
# FIXED at runtime (fix/packaged-tool-dcp-resolution):
# HeadlessTopology.StartAsync (Vouchfx.Engine.Orchestration) now self-heals
# this before DistributedApplication.Build() — it probes whether the embedded
# path exists on the CURRENT machine and, if not, recomputes the same
# package/version under the current machine's own NuGet cache (NUGET_PACKAGES,
# else ~/.nuget/packages) and RuntimeInformation.RuntimeIdentifier, then
# overrides DcpPublisher:CliPath via IConfiguration. See DcpPathResolver for
# the decision logic and the smoke-test-packaged-tool job above for the CI
# proof (installs the packed nupkg, then runs it against a SECOND, non-default
# NuGet cache with the default cache moved out of the way, to genuinely
# simulate a different machine rather than coincidentally reusing this
# runner's own default cache path).
#
# - nupkg (primary distribution): now works on ANY machine whose NuGet cache
#   (NUGET_PACKAGES, or the default ~/.nuget/packages) contains
#   aspire.hosting.orchestration.<their-rid>/<matching-version> ANYWHERE —
#   any developer who has previously built/restored an Aspire project. A
#   machine that has NEVER restored the matching Aspire.AppHost.Sdk package
#   still needs one restore first (see DcpPathResolver's actionable error
#   message) or the ASPIRE_DCP_PATH environment variable.
#
# - Self-contained exes (secondary): include the .NET runtime but NOT the DCP
#   binary. The same runtime self-heal applies — the embedded DCP path is
#   resolved the same way regardless of which distribution channel launched
#   the assembly.
#
# - PublishSingleFile is NEVER set: Assembly.Location returns an empty string
#   for embedded assemblies; Vouchfx.Engine.Compilation uses it to discover
#   provider DLLs for Roslyn (hard engine invariant, CLAUDE.md).
#
# See docs/decisions/dotnet-tool-packaging.md for the full analysis.
# =============================================================================

name: Release (signed, provenance)

on:
  release:
    types: [published]
  push:
    tags:
      - "v*"
  # workflow_dispatch lets maintainers smoke-test the build/publish/harvest
  # jobs without cutting a real tag.  Release upload and NuGet push are
  # ALWAYS skipped on dispatch runs (see "Smoke-test" comments throughout).
  workflow_dispatch:
    inputs:
      version:
        description: "Semver string to build, e.g. 0.0.0-test (no release upload)"
        required: true
        default: "0.0.0-test"
        type: string

# Minimum workflow-level permissions; each job declares its own overrides.
permissions:
  contents: read

# One release per ref; never cancel a signing job mid-flight.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:

  # ===========================================================================
  # build-dotnet
  # Produces: nupkg (primary distribution), per-RID self-contained archives,
  # CycloneDX JSON SBOM, and separate publish dirs for installer jobs.
  # ===========================================================================
  build-dotnet:
    name: Build .NET artifacts (nupkg, per-RID publish, SBOM)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      version: ${{ steps.version.outputs.version }}
      tag:     ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout (full history for version embedding)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore vouchfx.sln

      - name: Build (Release, 0-warning gate)
        run: dotnet build vouchfx.sln -c Release --no-restore

      # Extract semver from the triggering ref.
      # release event:         github.event.release.tag_name → "v1.2.3"
      # push-tag event:        GITHUB_REF_NAME               → "v1.2.3"
      # workflow_dispatch:     inputs.version                → "0.0.0-test"
      - name: Determine release version
        id: version
        # SECURITY: attacker-influenceable context values (tag name, dispatch
        # input) are passed through the env: map and referenced only as quoted
        # shell variables — never interpolated directly inside run: via ${{ }}.
        env:
          EV_TAG:   ${{ github.event.release.tag_name }}
          EV_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            tag="$EV_TAG"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="v$EV_INPUT"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          version="${tag#v}"   # strip leading "v" for dotnet -p:Version
          # Fail-closed: reject anything that is not a clean semver before it
          # reaches $GITHUB_OUTPUT and gets spliced into downstream run: shells.
          # Pattern: MAJOR.MINOR.PATCH with an optional pre-release/build suffix
          # composed of alphanumerics, hyphens, and dots (e.g. 1.2.3-rc.1).
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Refusing to release: version '$version' is not a valid semver"
            exit 1
          fi
          echo "tag=$tag"         >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing: tag=$tag  version=$version (event: $GITHUB_EVENT_NAME)"

      # Pack the dotnet global tool nupkg (primary distribution).
      # PackAsTool=true and IsPublishable=true are set in the csproj.
      - name: Pack nupkg (global tool — primary distribution)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          dotnet pack src/Cli/Vouchfx.Cli/Vouchfx.Cli.csproj \
            -c Release \
            -p:Version="$VERSION" \
            -o artifacts/nuget

      # Pack the SDK-closure nupkgs (provider-authoring surface) so provider
      # authors can restore Vouchfx.Sdk et al. straight from NuGet.org
      # instead of vendoring engine source (mirrors the local-feed pack in
      # vouchfx-providers/.github/workflows/conformance.yml, which packs the
      # same five projects from a pinned engine SHA as a bootstrap workaround
      # until this step existed).
      # Dependency order: Abstractions and Sdk are leaves; Authoring and
      # Compilation each ProjectReference Abstractions+Sdk; Sdk.Testing
      # ProjectReferences all four.  dotnet pack builds each project's own
      # ProjectReferences regardless of loop order, but packing leaves first
      # keeps the loop readable and matches the emitted <dependency> graph.
      - name: Pack nupkg (SDK closure — Vouchfx.Sdk, Vouchfx.Sdk.Testing, Vouchfx.Engine.*)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          for csproj in \
            src/Engine/Vouchfx.Engine.Abstractions/Vouchfx.Engine.Abstractions.csproj \
            src/Sdk/Vouchfx.Sdk/Vouchfx.Sdk.csproj \
            src/Engine/Vouchfx.Engine.Authoring/Vouchfx.Engine.Authoring.csproj \
            src/Engine/Vouchfx.Engine.Compilation/Vouchfx.Engine.Compilation.csproj \
            src/Sdk/Vouchfx.Sdk.Testing/Vouchfx.Sdk.Testing.csproj ; do
            echo "Packing: $csproj"
            dotnet pack "$csproj" \
              -c Release \
              -p:Version="$VERSION" \
              -o artifacts/nuget
          done

      # Self-contained multi-file publish for each RID.
      # PublishSingleFile is NOT used (Assembly.Location → IL3000 build errors).
      # Each publish embeds the CI runner's NuGet cache path for DCP.
      # The build-msi job re-publishes win-x64 on Windows for a usable DCP path.
      - name: Publish self-contained (linux-x64)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          dotnet publish src/Cli/Vouchfx.Cli/Vouchfx.Cli.csproj \
            -c Release -r linux-x64 --self-contained \
            -p:Version="$VERSION" \
            -o artifacts/publish/linux-x64

      - name: Publish self-contained (win-x64)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          dotnet publish src/Cli/Vouchfx.Cli/Vouchfx.Cli.csproj \
            -c Release -r win-x64 --self-contained \
            -p:Version="$VERSION" \
            -o artifacts/publish/win-x64
        # DCP path baked in here is a Linux path; users on Windows should
        # install the MSI (build-msi, windows-latest) which re-publishes natively.

      - name: Publish self-contained (osx-x64)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          dotnet publish src/Cli/Vouchfx.Cli/Vouchfx.Cli.csproj \
            -c Release -r osx-x64 --self-contained \
            -p:Version="$VERSION" \
            -o artifacts/publish/osx-x64

      - name: Publish self-contained (osx-arm64)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          dotnet publish src/Cli/Vouchfx.Cli/Vouchfx.Cli.csproj \
            -c Release -r osx-arm64 --self-contained \
            -p:Version="$VERSION" \
            -o artifacts/publish/osx-arm64

      # Archive each publish directory into a distributable tarball.
      - name: Archive publish outputs (tar.gz per RID)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          v="$VERSION"
          mkdir -p artifacts/archives
          for rid in linux-x64 win-x64 osx-x64 osx-arm64; do
            tar -czf "artifacts/archives/vouchfx-${v}-${rid}.tar.gz" \
              -C artifacts/publish "${rid}/"
            echo "Archived: vouchfx-${v}-${rid}.tar.gz"
          done

      # CycloneDX SBOM — install, run, uninstall (no residual global tool).
      - name: Generate SBOM (CycloneDX JSON, spec 1.7)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          dotnet tool install --global CycloneDX
          dotnet-CycloneDX vouchfx.sln \
            -o artifacts/sbom \
            --filename "vouchfx-${VERSION}.bom.json"
          dotnet tool uninstall --global CycloneDX
          ls -lh artifacts/sbom/

      - name: Upload nupkg
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuget-package
          path: |
            artifacts/nuget/*.nupkg
            artifacts/nuget/*.snupkg
          if-no-files-found: error
          retention-days: 30

      - name: Upload publish archives (all RIDs)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publish-archives
          path: artifacts/archives/*.tar.gz
          if-no-files-found: error
          retention-days: 30

      # Separate per-OS publish dirs so installer jobs can grab just their RID.
      # NOTE: win-x64 dir is NOT uploaded here — build-msi re-publishes win-x64
      # natively on windows-latest so the embedded DCP path is a Windows absolute
      # path rather than the Linux runner's NuGet cache path.
      - name: Upload linux-x64 publish dir (for .deb)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publish-linux-x64-dir
          path: artifacts/publish/linux-x64/
          if-no-files-found: error
          retention-days: 7

      - name: Upload osx-arm64 publish dir (for .pkg)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publish-osx-arm64-dir
          path: artifacts/publish/osx-arm64/
          if-no-files-found: error
          retention-days: 7

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: artifacts/sbom/*.bom.json
          if-no-files-found: error
          retention-days: 30

  # ===========================================================================
  # smoke-test-packaged-tool
  # Proves the packaged-tool DCP path self-heal (fix/packaged-tool-dcp-resolution) on a
  # SIMULATED user machine — not the machine that packed the tool.
  #
  # WHY the previous approach proved nothing
  # -----------------------------------------
  # There was no job that actually installed the packed nupkg as a `dotnet tool` and ran
  # it; the closest thing was build-dotnet building/testing from source, which never
  # exercises the packaging step at all. Even a naive "install the nupkg and run it" smoke
  # test on ubuntu-latest would still be misleading: build-dotnet ALSO runs on
  # ubuntu-latest, so the ABSOLUTE dcpclipath baked into the tool
  # (/home/runner/.nuget/packages/aspire.hosting.orchestration.linux-x64/13.4.2/tools/dcp)
  # uses the SAME conventional $HOME as every other ubuntu-latest job. A plain `dotnet
  # restore` anywhere in this job would silently repopulate that exact path and the smoke
  # test would pass whether or not the self-heal fix worked — the DCP portability bug
  # (reproduced locally with NUGET_PACKAGES=D:\nuget-alt and the real cache hidden) would
  # never be caught here.
  #
  # WHAT this job actually does
  # ----------------------------
  #   1. Installs the EXACT nupkg build-dotnet just packed as a real global tool
  #      (`dotnet tool install --global`), not `dotnet run --project` (every other
  #      workflow in this repo builds-from-source, which cannot exercise this bug).
  #   2. Restores an Aspire.AppHost.Sdk-carrying project into a SECOND, non-default NuGet
  #      cache (NUGET_PACKAGES=$RUNNER_TEMP/user-cache) — standing in for "the user's own
  #      machine cache", which DOES hold the matching orchestration package on any machine
  #      that has ever restored an Aspire project.
  #   3. Moves the DEFAULT NuGet cache (~/.nuget/packages) out of the way — killing the
  #      baked-in path for real, so only the runtime fallback (DcpPathResolver, probing
  #      NUGET_PACKAGES / the user-profile default) can make the run succeed.
  #   4. Runs the reference suite (examples/ci-reference) through the INSTALLED tool with
  #      NUGET_PACKAGES pointed at the second cache. Before the fix this reproduced the
  #      reported FileNotFoundException even though the package WAS present, just at a
  #      different path than the one baked into the assembly metadata.
  #   5. Restores the original cache afterwards (defensive; nothing currently follows this
  #      job on the same runner, but keeps it side-effect-free for future edits).
  #
  # Gates the actual publish: added to publish-release's `needs` below, so a packaged-tool
  # portability regression blocks the NuGet/GitHub Release publish, not just a from-source
  # build.
  # ===========================================================================
  smoke-test-packaged-tool:
    name: Smoke-test packaged tool on a simulated user machine
    runs-on: ubuntu-latest
    needs: build-dotnet

    permissions:
      contents: read

    env:
      VERSION: ${{ needs.build-dotnet.outputs.version }}

    steps:
      - name: Checkout (for examples/ci-reference and the Aspire.AppHost.Sdk project to restore)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: "8.0.x"

      - name: Download nupkg
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuget-package
          path: release-nuget/

      # Install the EXACT packed tool as a real end user would — from a local feed built
      # from the just-packed nupkg. Mirrors the pattern documented and empirically
      # verified in docs/decisions/dotnet-tool-packaging.md ("dotnet tool install
      # --tool-path <dir> --add-source <feed> vouchfx").
      #
      # PATH robustness (MINOR 3, gatekeeper review): `dotnet tool install --global` places
      # the shim under ~/.dotnet/tools, which is NOT guaranteed to already be on PATH for
      # every step's shell on every runner image — relying on a bare `vouchfx` later in this
      # job would be fragile. Append it to $GITHUB_PATH (applies to every SUBSEQUENT step)
      # right here, and invoke the just-installed shim by its full path for the immediate
      # --version smoke check within THIS SAME step (a $GITHUB_PATH append never affects the
      # step that wrote it).
      - name: Install packed vouchfx tool (global, from the release nupkg)
        run: |
          set -euo pipefail
          dotnet tool install --global --add-source "$PWD/release-nuget" --version "$VERSION" vouchfx
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
          "$HOME/.dotnet/tools/vouchfx" --version

      # Populate the stand-in for "the user's own machine cache" BEFORE hiding the
      # default cache below — restoring the CLI project (it carries Aspire.AppHost.Sdk)
      # is sufficient to pull aspire.hosting.orchestration.linux-x64 into this alternate,
      # non-default location.
      - name: Restore an Aspire.AppHost.Sdk project into a SECOND NuGet cache
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/user-cache"
          NUGET_PACKAGES="$RUNNER_TEMP/user-cache" dotnet restore src/Cli/Vouchfx.Cli/Vouchfx.Cli.csproj

      # Kill the baked-in path for real (see the job header comment for why this is
      # necessary even on the "same" runner image as build-dotnet).
      - name: Hide the default NuGet cache (simulate a machine that never built vouchfx)
        run: |
          set -euo pipefail
          if [ -d "$HOME/.nuget/packages" ]; then
            mv "$HOME/.nuget/packages" "$RUNNER_TEMP/original-nuget-packages"
          fi

      # Pre-warm the one image the smoke suite needs (mirrors build.yml / vouchfx-run.yml).
      - name: Pre-pull traefik/whoami (best-effort, non-fatal)
        continue-on-error: true
        run: docker pull traefik/whoami:latest

      # Run the reference suite through the INSTALLED global tool — NOT `dotnet run` —
      # with NUGET_PACKAGES pointed at the second cache. This is what exercises
      # DcpPathResolver's fallback inside HeadlessTopology.StartAsync: the embedded
      # dcpclipath metadata is dead (step above), so the tool must recompute the DCP path
      # from NUGET_PACKAGES and find it there instead.
      #
      # --fail-on-env-error / --fail-on-inconclusive (BLOCKER 1, gatekeeper review): by
      # DEFAULT `vouchfx run` exits 0 for an EnvironmentError or Inconclusive verdict — only
      # a genuine product Fail breaks CI without opting in (§12.1, ExitCodes.FromVerdict).
      # Without these flags, a REGRESSED DcpPathResolver (topology never starts → the
      # suite's own verdict is EnvironmentError, NOT this step failing) would still exit 0,
      # the gate would stay green, and a broken packaged tool would publish. These flags
      # make ANY non-Pass verdict fail this step outright, so a DCP-resolution regression
      # actually blocks the release.
      - name: Run reference suite via the installed tool (simulated user machine)
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/user-cache
        run: |
          set -euo pipefail
          vouchfx run examples/ci-reference \
            --junit "$RUNNER_TEMP/smoke-results.xml" \
            --html "$RUNNER_TEMP/smoke-report.html" \
            --fail-on-env-error \
            --fail-on-inconclusive

      # Independently verify a GENUINE pass (BLOCKER 1, gatekeeper review) — belt-and-braces
      # beyond the exit code above. Two exit-0 paths could otherwise slip through even with
      # the --fail-on-* flags: (a) a future flag/verdict-mapping regression in the CLI
      # itself, and (b) `vouchfx run` printing "No *.e2e.yaml scenarios found under '<path>'"
      # and exiting 0 WITHOUT ever writing a JUnit file at all when scenario discovery finds
      # nothing (e.g. a typo'd path) — see RunCommand.cs's discovered.Count == 0 branch.
      # Parse the JUnit root <testsuites> aggregate attributes that JunitXmlRenderer always
      # writes on one line (tests="N" failures="N" errors="N" skipped="N") and require
      # tests>0, failures=0, errors=0, skipped=0. A missing/unparseable file fails this step
      # outright, which is exactly what case (b) needs guarded.
      - name: Verify the smoke suite genuinely passed (parse JUnit XML)
        run: |
          set -euo pipefail
          results="$RUNNER_TEMP/smoke-results.xml"
          if [ ! -f "$results" ]; then
            echo "::error::$results was not written — the run produced no report (see the 'no scenarios found' exit-0 path in RunCommand.cs)."
            exit 1
          fi
          root_line=$(grep -m1 '<testsuites ' "$results" || true)
          if [ -z "$root_line" ]; then
            echo "::error::No <testsuites> root element found in $results"
            exit 1
          fi
          tests=$(echo "$root_line" | sed -nE 's/.*tests="([0-9]+)".*/\1/p')
          failures=$(echo "$root_line" | sed -nE 's/.*failures="([0-9]+)".*/\1/p')
          errors=$(echo "$root_line" | sed -nE 's/.*errors="([0-9]+)".*/\1/p')
          skipped=$(echo "$root_line" | sed -nE 's/.*skipped="([0-9]+)".*/\1/p')
          if [ -z "$tests" ] || [ -z "$failures" ] || [ -z "$errors" ] || [ -z "$skipped" ]; then
            echo "::error::Could not parse tests/failures/errors/skipped attributes from $results"
            exit 1
          fi
          echo "JUnit summary: tests=$tests failures=$failures errors=$errors skipped=$skipped"
          if [ "$tests" -eq 0 ] || [ "$failures" -ne 0 ] || [ "$errors" -ne 0 ] || [ "$skipped" -ne 0 ]; then
            echo "::error::Smoke suite did not genuinely pass (tests=$tests failures=$failures errors=$errors skipped=$skipped) — see $results"
            exit 1
          fi
          echo "Smoke suite genuinely passed: $tests test(s), 0 failures, 0 errors, 0 skipped."

      # Restore the original cache in case a later step (now, or added in future) needs
      # it — keeps this job side-effect-free beyond its own working directory.
      - name: Restore original NuGet cache
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/original-nuget-packages" ]; then
            rm -rf "$HOME/.nuget/packages"
            mv "$RUNNER_TEMP/original-nuget-packages" "$HOME/.nuget/packages"
          fi

      - name: Upload smoke-test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-test-packaged-tool-reports
          path: |
            ${{ runner.temp }}/smoke-results.xml
            ${{ runner.temp }}/smoke-report.html
          retention-days: 7
          if-no-files-found: warn

  # ===========================================================================
  # build-vsix
  # Packages the VSCode extension using vsce.
  # ===========================================================================
  build-vsix:
    name: Build VSCode extension (.vsix)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    # Secret presence is surfaced as a job-level env bool rather than testing
    # the secrets context inside the step `if:` directly — matching this
    # pipeline's established HAS_CODESIGN / HAS_GPG pattern so every
    # secret-gated step reads the same way.
    env:
      HAS_VSCE_PAT: ${{ secrets.VSCE_PAT != '' }}

    defaults:
      run:
        working-directory: tools/vscode-vouchfx

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js (LTS 22)
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: tools/vscode-vouchfx/package-lock.json

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Compile TypeScript
        run: npm run compile

      - name: Package extension (vsce package)
        run: npm run package

      - name: Upload .vsix
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vsix
          path: tools/vscode-vouchfx/*.vsix
          if-no-files-found: error
          retention-days: 30

      # ── VS Code Marketplace publish (#121) ─────────────────────────────────
      # Publishes the .vsix built above; vsce reads the PAT from the VSCE_PAT
      # environment variable. Guarded three ways: the secret must exist, the
      # run must be a real release/tag event (workflow_dispatch is the
      # non-publishing smoke lane), and only the canonical repo may publish
      # (forks with a stray VSCE_PAT must not). Marketplace publishes are
      # idempotent per version — re-running a tag whose version is already
      # live fails this step rather than silently double-publishing; ship a
      # new extension version instead.
      - name: Publish to VS Code Marketplace (vsce publish)
        if: ${{ env.HAS_VSCE_PAT == 'true' && github.event_name != 'workflow_dispatch' && github.repository == 'tomas-rampas/vouchfx' }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --packagePath ./*.vsix

      - name: Marketplace publish skipped (VSCE_PAT not configured)
        if: ${{ env.HAS_VSCE_PAT != 'true' }}
        run: |
          echo "::notice title=VS Code Marketplace publish SKIPPED::VSCE_PAT is not configured. On release/tag runs the extension ships only as the .vsix attached to the GitHub Release (on workflow_dispatch smoke runs it is only a workflow artifact). To activate the Marketplace channel (#121): create the 'vouchfx' publisher on marketplace.visualstudio.com, mint a Marketplace-scoped PAT, and add it as the VSCE_PAT repo secret."

  # ===========================================================================
  # sign-and-attest
  # Applies SLSA build provenance + cosign keyless signing to every artifact,
  # and optionally GPG-signs the nupkg.
  # ===========================================================================
  sign-and-attest:
    name: Attest (SLSA provenance) and sign (cosign keyless, GPG)
    runs-on: ubuntu-latest
    needs: [build-dotnet, build-vsix, build-msi, build-deb, build-pkg]

    permissions:
      id-token: write      # mint GitHub OIDC token for Fulcio + cosign
      attestations: write  # store SLSA provenance attestation via GitHub API
      contents: read

    env:
      VERSION: ${{ needs.build-dotnet.outputs.version }}
      HAS_GPG: ${{ secrets.GPG_SIGNING_KEY != '' }}

    steps:
      - name: Download nupkg
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuget-package
          path: artifacts/nuget/

      - name: Download publish archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: publish-archives
          path: artifacts/

      - name: Download SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
          path: artifacts/sbom/

      - name: Download .vsix
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vsix
          path: artifacts/vsix/

      - name: Download MSI installer (for attestation)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: msi-installer
          path: artifacts/installers/

      - name: Download .deb package (for attestation)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deb-package
          path: artifacts/installers/

      - name: Download .pkg installer (for attestation)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pkg-installer
          path: artifacts/installers/

      # SLSA provenance attestations — one per artifact group.
      # Verification: gh attestation verify <file> --repo tomas-rampas/vouchfx
      - name: Attest nupkg (SLSA build provenance)
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            artifacts/nuget/*.nupkg
            artifacts/nuget/*.snupkg

      - name: Attest publish archives (SLSA build provenance)
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: artifacts/vouchfx-*.tar.gz

      - name: Attest SBOM (SLSA build provenance)
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: artifacts/sbom/*.bom.json

      - name: Attest .vsix (SLSA build provenance)
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: artifacts/vsix/*.vsix

      - name: Attest installers (SLSA build provenance)
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: artifacts/installers/*

      # cosign keyless signing — produces a self-contained .cosign.bundle
      # (signature + Fulcio cert chain + Rekor inclusion proof) per artifact.
      # Pinned to a full commit SHA for supply-chain integrity.
      # workflow_dispatch smoke-test runs are excluded: signing a throwaway
      # 0.0.0-test artifact mints a real, permanent Rekor transparency-log
      # entry — noisy and misleading.  All other steps in this job are
      # unaffected by this gate.
      - name: Install cosign
        if: github.event_name != 'workflow_dispatch'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign artifacts (cosign keyless)
        if: github.event_name != 'workflow_dispatch'
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          v="$VERSION"
          for f in \
            artifacts/nuget/*.nupkg \
            artifacts/nuget/*.snupkg \
            "artifacts/vouchfx-${v}-linux-x64.tar.gz" \
            "artifacts/vouchfx-${v}-win-x64.tar.gz" \
            "artifacts/vouchfx-${v}-osx-x64.tar.gz" \
            "artifacts/vouchfx-${v}-osx-arm64.tar.gz" \
            "artifacts/sbom/vouchfx-${v}.bom.json" \
            artifacts/vsix/*.vsix \
            artifacts/installers/*.msi \
            artifacts/installers/*.deb \
            artifacts/installers/*.pkg ; do
            if [[ -f "$f" ]]; then
              echo "Signing: $f"
              cosign sign-blob --yes \
                --bundle "${f}.cosign.bundle" \
                "$f"
              echo "  -> ${f}.cosign.bundle"
            fi
          done

      # GPG signing for the nupkg — SECRET-GATED.
      # Required secrets: GPG_SIGNING_KEY (base64-encoded armoured private key)
      #                   GPG_PASSPHRASE
      - name: Sign nupkg (GPG) — secret-gated
        if: ${{ env.HAS_GPG == 'true' }}
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_PASSPHRASE:  ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          echo "$GPG_SIGNING_KEY" | base64 -d | gpg --batch --import
          for nupkg in artifacts/nuget/*.nupkg; do
            echo "GPG-signing: $nupkg"
            echo "$GPG_PASSPHRASE" | gpg --batch --yes --passphrase-fd 0 \
              --armor --detach-sign "$nupkg"
            echo "  -> ${nupkg}.asc"
          done

      - name: Upload cosign bundles + GPG signatures
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signing-material
          path: |
            artifacts/**/*.cosign.bundle
            artifacts/**/*.asc
          if-no-files-found: warn
          retention-days: 30

  # ===========================================================================
  # build-msi (windows-latest)
  # Re-publishes win-x64 on Windows so the DCP path baked in by
  # Aspire.AppHost.Sdk is a Windows NuGet cache path (C:\Users\...), making
  # the installed binary usable for Windows users who have Aspire packages.
  # Builds a WiX v4 MSI installer.  Optionally signs with Authenticode.
  #
  # Secret-gated Authenticode:
  #   CODESIGN_PFX_BASE64   — base64-encoded PKCS#12 (.pfx) certificate
  #   CODESIGN_PFX_PASSWORD — password for the certificate
  # ===========================================================================
  build-msi:
    name: Build Windows MSI installer (WiX v4, win-x64)
    runs-on: windows-latest
    needs: build-dotnet

    permissions:
      contents: read

    env:
      VERSION: ${{ needs.build-dotnet.outputs.version }}
      HAS_CODESIGN: ${{ secrets.CODESIGN_PFX_BASE64 != '' }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: "8.0.x"

      # Re-publish win-x64 natively so the DCP path in AssemblyMetadata is a
      # Windows absolute path (C:\Users\runneradmin\AppData\Local\...) matching
      # the standard Windows NuGet package cache used by Aspire on Windows.
      - name: Restore dependencies
        run: dotnet restore vouchfx.sln

      - name: Publish win-x64 self-contained (Windows — native DCP path)
        run: |
          dotnet publish src/Cli/Vouchfx.Cli/Vouchfx.Cli.csproj `
            -c Release `
            -r win-x64 `
            --self-contained `
            "-p:Version=$env:VERSION" `
            -o publish\win-x64

      # Sign vouchfx.exe before it is packaged into the MSI — SECRET-GATED.
      # signtool.exe is available on windows-latest runners.
      - name: Sign vouchfx.exe (Authenticode) — secret-gated
        if: ${{ env.HAS_CODESIGN == 'true' }}
        env:
          CODESIGN_PFX_BASE64:   ${{ secrets.CODESIGN_PFX_BASE64 }}
          CODESIGN_PFX_PASSWORD: ${{ secrets.CODESIGN_PFX_PASSWORD }}
        run: |
          # Resolve signtool.exe explicitly — it is not reliably on PATH on
          # github-hosted windows-latest runners even though the Windows SDK is
          # present.  Pick the highest-versioned x64 build.
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
            -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.Directory.Name -eq 'x64' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { Write-Error "signtool.exe not found in Windows Kits\10\bin"; exit 1 }
          Write-Host "Using: $signtool"
          $pfxPath = "$env:RUNNER_TEMP\codesign.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:CODESIGN_PFX_BASE64))
          & $signtool sign `
            /f  $pfxPath `
            /p  $env:CODESIGN_PFX_PASSWORD `
            /tr http://timestamp.digicert.com `
            /td sha256 /fd sha256 `
            /d  "vouchfx" `
            /du "https://github.com/tomas-rampas/vouchfx" `
            publish\win-x64\vouchfx.exe
          Remove-Item $pfxPath -Force

      # Install WiX v4 dotnet tool if not already available.
      # In dev environments, wix is typically installed globally.
      - name: Ensure WiX v4 tool is available
        run: |
          # Pin the minor version so the WXS schema namespace stays stable.
          # Advance deliberately when upgrading from WiX 4.0.x.
          if (-not (Get-Command wix -ErrorAction SilentlyContinue)) {
            dotnet tool install --global wix --version 4.0.*
          }
          wix --version

      # WiX v4.0.x does not support the Files/glob harvesting element.
      # Invoke-Harvest.ps1 enumerates all files in the publish directory and
      # generates a WXS Fragment (AppFiles.wxs) with one Component per file.
      # The generated file is combined with vouchfx.wxs in the wix build step.
      - name: Harvest publish directory into WXS fragment
        run: |
          pwsh installer\windows\Invoke-Harvest.ps1 `
            -SourceDir publish\win-x64 `
            -OutputFile installer\windows\AppFiles.wxs

      # Build the MSI from the skeleton + harvested fragment.
      # -d Version= injects the version; MSI requires W.X.Y (no pre-release suffix).
      - name: Build MSI (wix build)
        run: |
          $msiVersion = $env:VERSION -replace '-.*$', ''
          New-Item -ItemType Directory -Force artifacts\installer | Out-Null
          wix build installer\windows\vouchfx.wxs installer\windows\AppFiles.wxs `
            "-d" "Version=$msiVersion" `
            -arch x64 `
            -o "artifacts\installer\vouchfx-$env:VERSION-win-x64.msi"
          Write-Host "Built MSI: vouchfx-$env:VERSION-win-x64.msi"

      # Sign the MSI after it is built — SECRET-GATED.
      - name: Sign MSI (Authenticode) — secret-gated
        if: ${{ env.HAS_CODESIGN == 'true' }}
        env:
          CODESIGN_PFX_BASE64:   ${{ secrets.CODESIGN_PFX_BASE64 }}
          CODESIGN_PFX_PASSWORD: ${{ secrets.CODESIGN_PFX_PASSWORD }}
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
            -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.Directory.Name -eq 'x64' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { Write-Error "signtool.exe not found in Windows Kits\10\bin"; exit 1 }
          Write-Host "Using: $signtool"
          $pfxPath = "$env:RUNNER_TEMP\codesign.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:CODESIGN_PFX_BASE64))
          & $signtool sign `
            /f  $pfxPath `
            /p  $env:CODESIGN_PFX_PASSWORD `
            /tr http://timestamp.digicert.com `
            /td sha256 /fd sha256 `
            /d  "vouchfx" `
            /du "https://github.com/tomas-rampas/vouchfx" `
            "artifacts\installer\vouchfx-$env:VERSION-win-x64.msi"
          Remove-Item $pfxPath -Force

      - name: Upload MSI installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: msi-installer
          path: artifacts/installer/*.msi
          if-no-files-found: error
          retention-days: 30

  # ===========================================================================
  # build-deb (ubuntu-latest)
  # Builds a Debian .deb package from the linux-x64 publish output.
  # Optional GPG signing: GPG_SIGNING_KEY + GPG_PASSPHRASE.
  # ===========================================================================
  build-deb:
    name: Build Debian package (.deb, linux-x64)
    runs-on: ubuntu-latest
    needs: build-dotnet
    permissions:
      contents: read

    env:
      VERSION: ${{ needs.build-dotnet.outputs.version }}
      HAS_GPG: ${{ secrets.GPG_SIGNING_KEY != '' }}

    steps:
      - name: Download linux-x64 publish dir
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: publish-linux-x64-dir
          path: publish/linux-x64/

      - name: Build .deb package
        run: |
          set -euo pipefail
          v="$VERSION"
          pkgroot="deb-build/vouchfx_${v}_amd64"

          mkdir -p "$pkgroot/DEBIAN"
          mkdir -p "$pkgroot/usr/lib/vouchfx"
          mkdir -p "$pkgroot/usr/local/bin"

          # All published files land under /usr/lib/vouchfx/
          cp -r publish/linux-x64/. "$pkgroot/usr/lib/vouchfx/"
          chmod +x "$pkgroot/usr/lib/vouchfx/vouchfx"

          # Symlink the binary into $PATH.
          ln -sf /usr/lib/vouchfx/vouchfx "$pkgroot/usr/local/bin/vouchfx"

          installed_kb=$(du -sk "$pkgroot/usr" | awk '{print $1}')

          # Strip pre-release suffix: dpkg version must be M.N.P[-epoch].
          deb_version="${v%%-*}"

          cat > "$pkgroot/DEBIAN/control" <<EOF
          Package: vouchfx
          Version: ${deb_version}
          Architecture: amd64
          Maintainer: vouchfx contributors <https://github.com/tomas-rampas/vouchfx>
          Installed-Size: ${installed_kb}
          Depends: libc6 (>= 2.17)
          Section: devel
          Priority: optional
          Homepage: https://github.com/tomas-rampas/vouchfx
          Description: vouchfx e2e integration test runner
           Compiles declarative .e2e.yaml integration tests into C# (Roslyn),
           orchestrates the required container topology via .NET Aspire +
           Testcontainers, and executes steps covering REST, PostgreSQL, Kafka,
           webhooks, and custom scripting.
           .
           Prerequisite: aspire.hosting.orchestration.linux-x64 v13.4.2 must be
           present in ~/.nuget/packages/ to start container topologies.
          EOF

          find "$pkgroot" -type d -exec chmod 755 {} +
          find "$pkgroot" -type f -exec chmod 644 {} +
          chmod 755 "$pkgroot/usr/lib/vouchfx/vouchfx"

          mkdir -p artifacts/installer
          dpkg-deb --build "$pkgroot" \
            "artifacts/installer/vouchfx-${v}-linux-x64.deb"
          ls -lh "artifacts/installer/vouchfx-${v}-linux-x64.deb"

      - name: Sign .deb (GPG detached signature) — secret-gated
        if: ${{ env.HAS_GPG == 'true' }}
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_PASSPHRASE:  ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          echo "$GPG_SIGNING_KEY" | base64 -d | gpg --batch --import
          deb="artifacts/installer/vouchfx-${VERSION}-linux-x64.deb"
          echo "$GPG_PASSPHRASE" | gpg --batch --yes --passphrase-fd 0 \
            --armor --detach-sign "$deb"
          echo "Signed: ${deb}.asc"

      - name: Upload .deb package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deb-package
          path: artifacts/installer/*.deb*
          if-no-files-found: error
          retention-days: 30

  # ===========================================================================
  # build-pkg (macos-latest)
  # Builds macOS .pkg from the osx-arm64 publish output.
  # Apple notarisation: APPLE_ID + APPLE_TEAM_ID + APPLE_APP_SPECIFIC_PASSWORD.
  # ===========================================================================
  build-pkg:
    name: Build macOS package installer (.pkg, osx-arm64)
    runs-on: macos-latest
    needs: build-dotnet
    permissions:
      contents: read

    env:
      VERSION: ${{ needs.build-dotnet.outputs.version }}
      HAS_APPLE: ${{ secrets.APPLE_ID != '' }}

    steps:
      - name: Download osx-arm64 publish dir
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: publish-osx-arm64-dir
          path: publish/osx-arm64/

      - name: Build .pkg (osx-arm64)
        run: |
          set -euo pipefail
          v="$VERSION"
          pkgroot="pkg-build/vouchfx-arm64"
          mkdir -p "$pkgroot/usr/lib/vouchfx"
          mkdir -p "$pkgroot/usr/local/bin"

          cp -r publish/osx-arm64/. "$pkgroot/usr/lib/vouchfx/"
          chmod +x "$pkgroot/usr/lib/vouchfx/vouchfx"
          ln -sf /usr/lib/vouchfx/vouchfx "$pkgroot/usr/local/bin/vouchfx"

          mkdir -p artifacts/installer
          pkgbuild \
            --root "$pkgroot" \
            --identifier com.vouchfx.cli \
            --version "$v" \
            --install-location / \
            "artifacts/installer/vouchfx-${v}-osx-arm64.pkg"
          echo "Built: artifacts/installer/vouchfx-${v}-osx-arm64.pkg"

      # Apple notarisation — SECRET-GATED.
      # Required secrets: APPLE_ID, APPLE_TEAM_ID, APPLE_APP_SPECIFIC_PASSWORD
      # Apple's servers scan the pkg and return a ticket; xcrun stapler attaches
      # it so Gatekeeper trusts the installer without an internet connection.
      - name: Notarise .pkg (Apple Notary Service) — secret-gated
        if: ${{ env.HAS_APPLE == 'true' }}
        env:
          APPLE_ID:                    ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID:               ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          pkg="artifacts/installer/vouchfx-${VERSION}-osx-arm64.pkg"
          echo "Submitting for notarisation: $pkg"
          xcrun notarytool submit "$pkg" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait \
            --timeout 600
          echo "Stapling ticket..."
          xcrun stapler staple "$pkg"
          echo "Notarisation complete."

      - name: Upload .pkg installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pkg-installer
          path: artifacts/installer/*.pkg
          if-no-files-found: error
          retention-days: 30

  # ===========================================================================
  # publish-release
  # Assembles all artifacts and attaches them to the GitHub Release.
  # Publishes the nupkg to NuGet.org via Trusted Publishing (GitHub OIDC,
  # no long-lived secret; repo-gated).
  # ===========================================================================
  publish-release:
    name: Publish artifacts to GitHub Release and NuGet
    runs-on: ubuntu-latest
    needs: [build-dotnet, sign-and-attest, smoke-test-packaged-tool]
    # Smoke-test: dispatch runs never publish (every step below is
    # tag/release-gated), but the artifact downloads used to run
    # unconditionally and failed hard because the cosign/GPG steps skip on
    # dispatch, so no signing-material artifact exists (first-smoke finding,
    # 2026-07-05).  Skip the whole job on dispatch — it has nothing to do.
    if: github.event_name != 'workflow_dispatch'

    permissions:
      contents: write   # attach files to the GitHub Release
      id-token: write   # mint GitHub OIDC token for NuGet Trusted Publishing
      # id-token is necessarily job-scoped (Actions has no step-level
      # permissions), so every step in this job could technically mint an
      # OIDC token; accepted — splitting a minimal publish job was judged
      # riskier than this residual surface.

    env:
      VERSION: ${{ needs.build-dotnet.outputs.version }}
      TAG:     ${{ needs.build-dotnet.outputs.tag }}

    steps:
      - name: Download nupkg
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuget-package
          path: release-upload/

      - name: Download publish archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: publish-archives
          path: release-upload/

      - name: Download SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
          path: release-upload/

      - name: Download .vsix
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vsix
          path: release-upload/

      - name: Download signing material (cosign bundles, GPG signatures)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        # The sign job uploads this artifact with if-no-files-found: warn, so
        # it legitimately does not exist when every signing step was skipped
        # (no secrets provisioned).  A release without detached signatures is
        # still a valid release (SLSA attestations are stored server-side);
        # never hard-fail the publish on its absence.
        continue-on-error: true
        with:
          name: signing-material
          path: release-upload/

      - name: Download MSI installer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: msi-installer
          path: release-upload/

      - name: Download .deb package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deb-package
          path: release-upload/

      - name: Download .pkg installer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pkg-installer
          path: release-upload/

      - name: List release artifacts
        run: |
          echo "Artifacts to attach to release $TAG:"
          find release-upload/ -type f | sort

      # Smoke-test runs (workflow_dispatch) stop here — all steps below interact
      # with GitHub Releases or NuGet.org and must not fire on test runs.
      - name: List release artifacts (smoke-test final step)
        run: |
          echo "Artifacts that would be uploaded to release $TAG:"
          find release-upload/ -type f | sort

      # Create the release if triggered by a tag push (the release might not
      # exist yet).  For release: published, the release already exists and
      # --notes-from-tag is a graceful no-op.
      # Skipped on workflow_dispatch smoke-test runs.
      - name: Create release if triggered by tag push
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This job performs no checkout, so gh cannot infer the repository
          # from a .git directory — GH_REPO supplies it explicitly (first real
          # tag run failed here with "fatal: not a git repository").
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists — skipping create"
          else
            gh release create "$TAG" \
              --title "vouchfx $TAG" \
              --generate-notes \
              --draft
          fi

      # Attach all artifacts to the release.  --clobber replaces any file
      # already uploaded (safe for re-runs or partial re-runs).
      # Skipped on workflow_dispatch smoke-test runs.
      - name: Upload artifacts to GitHub Release
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find release-upload/ -type f -print0)
          echo "Uploading ${#files[@]} files to release $TAG..."
          gh release upload "$TAG" "${files[@]}" --clobber
          echo "Done."

      # Exchange the single-use GitHub OIDC token for a short-lived
      # (~1 hour), reusable NuGet.org API key via the Trusted Publishing
      # policy configured on nuget.org (Package Owner "Tomas.R"): Repository
      # tomas-rampas/vouchfx, Workflow File release.yml, no Environment.
      # Repository-gated: forks have no matching policy, so the token
      # exchange would fail there anyway — the explicit condition just
      # fails fast/skips instead of erroring mid-job. The workflow_dispatch
      # guard is redundant with the job-level `if` above but kept as
      # defence in depth, matching the neighbouring steps.
      - name: NuGet login (OIDC → short-lived API key)
        id: nuget-login
        if: ${{ github.repository == 'tomas-rampas/vouchfx' && github.event_name != 'workflow_dispatch' }}
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: Tomas.R

      # Publish the nupkg to NuGet.org — TRUSTED-PUBLISHING-GATED.
      # Install: dotnet tool install -g vouchfx
      # Package: https://www.nuget.org/packages/vouchfx/
      # Also skipped on workflow_dispatch smoke-test runs.
      - name: Publish nupkg to NuGet.org — Trusted Publishing
        if: ${{ github.repository == 'tomas-rampas/vouchfx' && github.event_name != 'workflow_dispatch' }}
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          # Non-fatal per package: glob order pushes the five Vouchfx.* SDK
          # packages BEFORE vouchfx, and a first-time 403 on a new ID (policy
          # scope, prefix squat) must not hold the primary CLI publish hostage.
          # Every failure is still reported and fails the step at the end;
          # re-running the same tag completes the missing pushes via
          # --skip-duplicate once the policy issue is fixed.
          rc=0
          for nupkg in release-upload/*.nupkg; do
            echo "Pushing: $nupkg"
            if ! dotnet nuget push "$nupkg" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate; then
              echo "::error::Push failed for $nupkg — continuing with remaining packages."
              rc=1
            fi
          done
          exit $rc
