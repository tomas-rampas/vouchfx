name: TLS transport acceptance
on:
  workflow_dispatch:
    inputs:
      dotnet_sdk:
        description: Isolated SDK/runtime line to test
        required: false
        default: '8.0'
        type: choice
        options: ['8.0', '9.0', '10.0']
      reviewed_sha:
        description: Exact source commit selected for manual acceptance; review approval is checked separately
        required: true
        type: string
  workflow_call:
    inputs:
      dotnet_sdk:
        description: Isolated SDK/runtime line to test
        required: false
        default: '8.0'
        type: string
      reviewed_sha:
        description: Exact source commit selected by the calling CI or release workflow
        required: true
        type: string
permissions:
  contents: read
jobs:
  transport:
    name: Hosted TLS (${{ matrix.os }})${{ inputs.dotnet_sdk != '8.0' && format(' .NET {0}', inputs.dotnet_sdk) || '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      VOUCHFX_TLS_HOSTED_ACCEPTANCE: '1'
      REVIEWED_SHA: ${{ inputs.reviewed_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.reviewed_sha }}
      - name: Configure isolated SDK and apphost roots
        shell: bash
        run: |
          printf 'DOTNET_INSTALL_DIR=%s/dotnet-compatibility\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'DOTNET_ROOT_X64=%s/dotnet-compatibility\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '${{ inputs.dotnet_sdk }}.x'

      - name: Test runtime-isolation guard safety
        shell: pwsh
        run: ./scripts/ci/test-select-dotnet-runtime.ps1
      - name: Keep only the selected SDK and shared frameworks
        env:
          EXPECTED_DOTNET: '${{ inputs.dotnet_sdk }}'
        shell: pwsh
        run: ./scripts/ci/select-dotnet-runtime.ps1 -ExpectedDotnet $env:EXPECTED_DOTNET
      - name: Require the selected SDK and runtime only
        env:
          EXPECTED_DOTNET: ${{ inputs.dotnet_sdk }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_DOTNET" =~ ^(8|9|10)\.0$ ]]
          [[ "$(dotnet --version)" == "$EXPECTED_DOTNET".* ]]
          runtimes="$(dotnet --list-runtimes)"
          printf '%s\n' "$runtimes"
          [[ "$runtimes" == *Microsoft.NETCore.App* ]]
          while read -r _framework version _location; do
            [[ "$version" == "$EXPECTED_DOTNET".* ]]
          done <<< "$runtimes"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Confirm the explicitly selected commit
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REVIEWED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$REVIEWED_SHA"
      - name: Restore public packages and build the isolated host
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore tests/Vouchfx.Engine.Runtime.TransportAcceptance.Tests --source https://api.nuget.org/v3/index.json
          dotnet build tests/Vouchfx.Engine.Runtime.TransportAcceptance.Tests -c Release --no-restore -warnaserror -p:Version=1.0.2
      # ubuntu-26.04 (now behind ubuntu-latest) ships fs.inotify.max_user_instances=128.
      # Each IConfiguration JSON source with reloadOnChange opens a FileSystemWatcher, so
      # test hosts exhaust it and fail with "The configured user limit (128) on the number
      # of inotify instances has been reached" (run 41217231299). Raise instances and
      # watches to common CI values before any test host starts.
      - name: Raise inotify limits (ubuntu-26.04 defaults to 128 instances)
        if: runner.os == 'Linux'
        run: |
          sudo sysctl -w fs.inotify.max_user_instances=8192
          sudo sysctl -w fs.inotify.max_user_watches=524288
      - name: Run four opted-in transport facts and their final guard
        env:
          VOUCHFX_TLS_EVIDENCE_DIRECTORY: ${{ runner.temp }}/vouchfx-tls-acceptance/evidence
        shell: bash
        run: |
          set -euo pipefail
          dotnet test tests/Vouchfx.Engine.Runtime.TransportAcceptance.Tests -c Release --no-build --no-restore --logger 'trx;LogFileName=tls-hosted.trx' --results-directory "${{ runner.temp }}/vouchfx-tls-acceptance"
          python scripts/assert-tls-hosted-acceptance.py "${{ runner.temp }}/vouchfx-tls-acceptance"
      - name: Retain exact TRX and public certificate evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tls-transport-${{ matrix.os }}${{ inputs.dotnet_sdk != '8.0' && format('-net{0}', inputs.dotnet_sdk) || '' }}
          path: ${{ runner.temp }}/vouchfx-tls-acceptance
          if-no-files-found: error
          retention-days: 14
