# .github/workflows/vouchfx-run-examples.yml — the per-provider examples run gate.
#
# CLI-RUNS every flat examples/*.e2e.yaml suite end-to-end (real Docker topology,
# real providers) and requires a PASS verdict from each. This is the gate the
# compile-only ExamplesCompileTests deliberately cannot provide: compilation
# proves the YAML parses, validates and emits well-formed CSX, but only a live
# run proves the suite actually PASSES — the 2026-07-18 audit found 8 of 15
# examples failing at run time (placeholder SUT images, unmet expectations)
# while the compile gate stayed green ("run-rot").
#
# Scope: the FLAT examples/*.e2e.yaml files only — the suites docs/recipes.md
# advertises as "complete runnable example"s. The subdirectory suites have their
# own gates: examples/ci-reference is run (both root forms) by
# vouchfx-run-reference.yml, and examples/reference requires the
# VOUCHFX_REF_BEARER_TOKEN prerequisite its README documents.
#
# The roster is DISCOVERED dynamically (find examples -maxdepth 1 -name
# '*.e2e.yaml', flat files only), so adding a new example file automatically
# adds its gate — no hand-maintained matrix to rot.
# Each example runs on its own runner (no DCP contention) via the reusable
# workflow, exercising the single-FILE discovery-root form once per example.
# (The counts that used to appear here and below were already stale by one
# before this note replaced them; a roster this file discovers dynamically
# should not carry a hand-maintained tally of its own size.)
#
# Fixture material: an example may ship `examples/<name>.setup.sh`, which the
# discover job finds by convention and the run job passes to the reusable
# workflow's `setup-script` input. That is the only point at which a suite's
# declared-but-generated files (certificates, key stores) can be created — the
# engine existence-checks every `security:` path before the first container
# starts. See examples/security-mtls.e2e.yaml.
#
# Strict gating is deliberate here, unlike the taxonomy's permissive CI default:
# these suites are self-contained by construction, so an Environment error or
# Inconclusive verdict means the example (or the engine) regressed — never that
# a customer's infrastructure hiccuped. Dropping the strict flags would blind
# the gate to exactly the regression class it exists to catch (a placeholder
# image that cannot start surfaces as an Environment error, not a Fail).
#
# No prewarm-images are passed: the roster is dynamic and the dependency images
# are implied by `type:`, not written in the YAML, so any prewarm list here
# would be a hand-maintained drift hazard. Cold pulls on fresh runners are
# absorbed by the health gate — the samples repository's CI matrix cold-pulls
# heavier stacks (SQL Server, Kafka, MySQL) under the same strict gating and
# stays green. If a heavy leg (mq-azureservicebus pulls the SQL Server sidecar)
# ever proves pull-flaky in practice, add a per-leg prewarm map rather than
# relaxing the gating.

name: vouchfx examples

on:
  # Mirror vouchfx-run-reference.yml: run on pushes that touch the examples, the
  # workflows, or the CLI/engine that the build-from-source install compiles.
  # Push-to-main only (not per-PR): the matrix costs one runner per example, and
  # a same-day revert window on main is an acceptable trade for that cost.
  push:
    branches:
      - main
    paths:
      - "examples/**"
      - ".github/workflows/vouchfx-run.yml"
      - ".github/workflows/vouchfx-run-examples.yml"
      - "src/**"
  # Allow the same proof to be triggered by hand from the Actions tab.
  workflow_dispatch:

# Read-only: the jobs only read source and upload artefacts.
permissions:
  contents: read

jobs:
  discover:
    name: Discover example roster
    runs-on: ubuntu-latest
    outputs:
      examples: ${{ steps.list.outputs.examples }}
      setups: ${{ steps.list.outputs.setups }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: List flat examples/*.e2e.yaml as a JSON matrix
        id: list
        run: |
          examples=$(find examples -maxdepth 1 -name '*.e2e.yaml' -printf '%f\n' \
            | sed 's/\.e2e\.yaml$//' \
            | sort \
            | jq --raw-input --slurp --compact-output 'split("\n") | map(select(length > 0))')
          if [ "$examples" = "[]" ]; then
            echo "::error::No flat examples/*.e2e.yaml files found — discovery is broken." >&2
            exit 1
          fi
          echo "Discovered roster: $examples"
          echo "examples=$examples" >> "$GITHUB_OUTPUT"

          # A SECOND, equally dynamic list: the examples that ship a fixture script.
          #
          # Some suites declare files a fresh checkout does not contain, because nothing
          # inside a suite can create them in time — every `security:` path is resolved
          # and existence-checked before the first container starts. Those examples ship
          # `examples/<name>.setup.sh` beside the suite, and the run job below passes it
          # to the reusable workflow's `setup-script` input.
          #
          # Discovered by CONVENTION rather than listed by name, for the same reason the
          # roster above is: a hand-maintained exception here would rot the first time
          # someone added or renamed an example. Adding `<name>.setup.sh` is the whole of
          # what a new example needs to do to get its fixtures generated.
          # (tests/Vouchfx.Engine.Runtime.Tests/ExamplesCompileTests.cs honours the same
          # convention, so the non-docker compile gate prepares the same material.)
          setups=$(find examples -maxdepth 1 -name '*.setup.sh' -printf '%f\n' \
            | sed 's/\.setup\.sh$//' \
            | sort \
            | jq --raw-input --slurp --compact-output 'split("\n") | map(select(length > 0))')
          echo "Examples with a fixture script: $setups"
          echo "setups=$setups" >> "$GITHUB_OUTPUT"

  run-example:
    name: Example ${{ matrix.example }}
    needs: discover
    strategy:
      # One broken example must not mask the verdicts of all the others.
      fail-fast: false
      matrix:
        example: ${{ fromJson(needs.discover.outputs.examples) }}
    uses: ./.github/workflows/vouchfx-run.yml
    with:
      # The single-file root form — also a rolling regression gate for
      # `vouchfx run <file>.e2e.yaml` across every provider family.
      scenario-path: examples/${{ matrix.example }}.e2e.yaml
      # Generate this example's fixture material on the SAME runner, before the
      # suite is read — see the discover job's note on the convention, and
      # vouchfx-run.yml's own note on why no earlier job could do it instead.
      # Empty for every example that ships no script, which is most of them.
      setup-script: >-
        ${{ contains(fromJson(needs.discover.outputs.setups), matrix.example)
            && format('examples/{0}.setup.sh', matrix.example) || '' }}
      # Strict: a self-contained example that env-errors or times out has
      # regressed (see the header note on why the permissive default is wrong here).
      fail-on-env-error: true
      fail-on-inconclusive: true
      # v4+ artefact names are immutable within one run — one name per leg.
      artifact-name: vouchfx-reports-example-${{ matrix.example }}
