# .github/workflows/vouchfx-run.yml — REUSABLE "run a vouchfx suite" workflow.
#
# A reusable GitHub Actions workflow (`on: workflow_call`) that runs a vouchfx
# `.e2e.yaml` suite end-to-end against an orchestrated container topology and
# publishes the JUnit + HTML reports as build artefacts.  Call it from your own
# workflow with `uses:` (see the worked example at the bottom of this header, and the
# reference caller in .github/workflows/vouchfx-run-reference.yml).
#
# ── How vouchfx is installed (parameterised; build-from-source by default) ──────────
# vouchfx IS published as a NuGet global tool — `dotnet tool install --global vouchfx
# --prerelease` (docs/getting-started.md) is the recommended way to run suites locally.
# It is not published as a container image.
#   This workflow nevertheless DELIBERATELY installs by building from source at a
#   pinned ref, rather than installing the packaged tool: the default `vouchfx-ref` is
#   this workflow's own SHA (`github.sha`), keeping the engine and the workflow
#   definition in lock-step — which is also what lets the vouchfx repository's own CI
#   gate unreleased engine commits with this same workflow — and a SHA/tag-pinned
#   source build is an immutable supply-chain reference, consistent with this header's
#   pinning rules (see below).
#   A consumer tracking a released engine pins `vouchfx-ref` to the release tag (e.g.
#   `v1.0.0-alpha.9`) — still a source build. Installing the packaged tool instead
#   could become an optional install mode later; the install step is intentionally the
#   only thing that would change.
#
# ── Supply-chain hygiene (please read before calling this workflow) ─────────────────
#   • PIN the `uses:` reference to a full commit SHA, NOT a moving branch or tag, e.g.
#         uses: your-org/vouchfx/.github/workflows/vouchfx-run.yml@<40-char-commit-sha>
#     A branch/tag ref lets the workflow definition change underneath you; a SHA is
#     immutable.  Likewise pin `vouchfx-ref` to a SHA or release tag, never a branch.
#   • PIN every entry in `prewarm-images` to an immutable image DIGEST, NOT a floating
#     tag, e.g.  `traefik/whoami@sha256:<digest>`  instead of  `traefik/whoami:latest`.
#     A digest guarantees you pull the exact image you reviewed; `:latest` can change.
#     (The defaults below use tags only to stay legible in this reference; production
#     callers should supply digests.)
#
# ── Telemetry (opt-in, off by default) ──────────────────────────────────────────────
#   vouchfx telemetry from CI is ENVIRONMENT-CONFIGURED (docs/telemetry.md): providing
#   all three values below IS the opt-in — no `telemetry enable` step, no consent store.
#   The engine emits under the SUPPLIED install id, so every run of the same repository
#   aggregates under one stable install identity instead of minting a fresh id per
#   ephemeral runner. One-time setup in the caller repository's Settings → Secrets and
#   variables → Actions:
#     • variable VOUCHFX_TELEMETRY_ENDPOINT   — the ingest base URL (not sensitive)
#     • variable VOUCHFX_TELEMETRY_INSTALL_ID — any GUID you choose once (e.g. `uuidgen`)
#     • secret   VOUCHFX_TELEMETRY_TOKEN      — the bearer ingest token (SECRET — it
#       authenticates uploads; the other two are plain variables)
#   then pass them through as in the worked example. Any of the three missing →
#   environment-configured telemetry stays inactive and the engine falls back to its
#   normal store-based consent model; on ephemeral hosted runners (no consent store)
#   that means nothing is sent, but a persistent/self-hosted runner whose local
#   consent is Enabled may still emit via the store-based path. To force telemetry
#   off regardless, set VOUCHFX_NO_TELEMETRY=1 in the caller job — it always wins.
#
#   SECURITY: any secret placed in the "Run vouchfx suite" step's own `env:` block
#   below (the telemetry token above, or any other secret a caller adds there) is
#   readable by the SUITE ITSELF via a `${env:NAME}` reference (REQ-006; docs/02
#   §3.2.6) — the engine passes such secrets through verbatim, by design. Do not call
#   this workflow from a secrets-bearing trigger context (one where GitHub injects real
#   repository/organisation secrets) with a `scenario-path` — OR a `setup-script` — an
#   untrusted contributor can influence, e.g. a fork's contents merged via
#   `pull_request_target`; that combination lets attacker-authored content exfiltrate the
#   secret. `setup-script` is if anything the sharper of the two: it names a file this
#   workflow executes as a shell script on the runner, before the suite, so it is arbitrary
#   code rather than a document the engine interprets. Both inputs must name content from a
#   ref you trust.
#
# ── Worked example (caller) ─────────────────────────────────────────────────────────
#   jobs:
#     e2e:
#       uses: your-org/vouchfx/.github/workflows/vouchfx-run.yml@<commit-sha>
#       with:
#         scenario-path: ./tests/e2e
#         fail-on-env-error: true
#         prewarm-images: |
#           traefik/whoami@sha256:<digest>
#           postgres@sha256:<digest>
#         # OPTIONAL telemetry (see the telemetry header block above):
#         telemetry-endpoint: ${{ vars.VOUCHFX_TELEMETRY_ENDPOINT }}
#         telemetry-install-id: ${{ vars.VOUCHFX_TELEMETRY_INSTALL_ID }}
#       secrets:
#         telemetry-token: ${{ secrets.VOUCHFX_TELEMETRY_TOKEN }}

name: Run vouchfx suite (reusable)

on:
  workflow_call:
    inputs:
      scenario-path:
        description: >-
          Path to a DIRECTORY containing the consumer's *.e2e.yaml suite (searched
          recursively for *.e2e.yaml files), OR a single *.e2e.yaml file, relative to
          the caller's checked-out repository root. Defaults to the repository root.
        type: string
        required: false
        default: "."

      setup-script:
        description: >-
          OPTIONAL path (relative to the caller's checked-out repository root) of a shell
          script to run on THIS runner after checkout and before the suite, to produce
          fixture files the suite declares but does not ship — most obviously the
          certificates and key/trust stores a `security:` block names. Such material
          cannot be produced from inside a suite: every path under a `security:` block is
          resolved and existence-checked BEFORE the first container starts, so a
          `script.csharp` step runs far too late. Left empty by default; when set, the
          script must exist and must exit 0 or the job fails. It is invoked as
          `bash <path>`, so it does not need its executable bit set — which a repository
          developed on Windows often cannot carry.
        type: string
        required: false
        default: ""

      vouchfx-repo:
        description: >-
          The `owner/name` of the repository to obtain vouchfx from (build-from-source
          install). Defaults to this repository. Override (with vouchfx-ref) to track a
          different fork, or to pin to a specific release tag while still building from
          source.
        type: string
        required: false
        default: ${{ github.repository }}

      vouchfx-ref:
        description: >-
          The git ref (branch, tag, or — recommended for supply-chain hygiene — a full
          commit SHA) of `vouchfx-repo` to build vouchfx from. Defaults to this
          workflow's own ref so the engine and this workflow definition stay in lock-step.
        type: string
        required: false
        default: ${{ github.sha }}

      dotnet-version:
        description: >-
          The .NET SDK version to install for building vouchfx and running the suite.
          vouchfx targets .NET 8; "8.0.x" resolves the latest 8.0 feature band on the runner.
        type: string
        required: false
        default: "8.0.x"

      fail-on-env-error:
        description: >-
          When true, pass --fail-on-env-error so an Environment-error verdict (unhealthy
          container, image-pull / seed / tunnel failure) fails the job with exit 3. Off by
          default: per the verdict taxonomy only a product Fail breaks CI by default.
        type: boolean
        required: false
        default: false

      fail-on-inconclusive:
        description: >-
          When true, pass --fail-on-inconclusive so an Inconclusive verdict (timeout,
          partition outlasted grace, upstream capture unmet) fails the job with exit 4. Off
          by default: per the verdict taxonomy only a product Fail breaks CI by default.
        type: boolean
        required: false
        default: false

      artifact-name:
        description: >-
          Name of the uploaded reports artefact. Override when ONE workflow run calls
          this reusable workflow MORE THAN ONCE (e.g. once per suite): upload-artifact
          v4+ artefact names are immutable within a run, so a second invocation with
          the default name would fail the upload with a conflict.
        type: string
        required: false
        default: "vouchfx-reports"

      prewarm-images:
        description: >-
          Optional newline-separated list of container images to `docker pull` BEFORE the
          run, to warm the Docker cache and dodge Aspire/DCP's ~20s per-resource cold-start
          watchdog (mirrors build.yml). Each pull is best-effort and non-fatal — a stale or
          unreachable tag only degrades to a cold pull during startup, it never fails the
          job. Each pull's output is echoed inside a `::stop-commands::` fence so a
          registry response cannot be executed as a workflow command, and the image
          reference you supply is escaped before it is placed in any log annotation;
          both are transparent to callers and change no behaviour. SUPPLY-CHAIN: pin
          each entry to an immutable image DIGEST (name@sha256:...), not a floating tag.
        type: string
        required: false
        default: ""

      runs-on:
        description: >-
          The runner label the job executes on. Must provide Docker (the topology uses
          Testcontainers via Aspire); the default ubuntu-latest does.
        type: string
        required: false
        default: "ubuntu-latest"

      telemetry-endpoint:
        description: >-
          OPTIONAL vouchfx-telemetry ingest base URL (see the telemetry header block).
          Not sensitive — typically passed from a caller repository VARIABLE.
          Environment-configured telemetry activates only when this,
          `telemetry-install-id`, AND the `telemetry-token` secret are all provided;
          otherwise it stays inactive and the engine's store-based consent model applies.
        type: string
        required: false
        default: ""

      telemetry-install-id:
        description: >-
          OPTIONAL stable install id for telemetry — any GUID chosen ONCE per caller
          repository (e.g. from `uuidgen`) and stored as a repository VARIABLE. Reusing
          the same GUID on every run is the point: it aggregates all of this repository's
          CI runs under one install identity instead of a fresh id per ephemeral runner.
          An invalid value is ignored by the engine with a warning (never fails the run).
        type: string
        required: false
        default: ""

    secrets:
      telemetry-token:
        description: >-
          OPTIONAL bearer token authenticating telemetry uploads (the only sensitive
          value of the three; see the telemetry header block). Telemetry stays off
          without it.
        required: false

# Read-only token: this reusable workflow only reads source and uploads artefacts.
permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  run-suite:
    name: Run vouchfx suite
    runs-on: ${{ inputs.runs-on }}

    steps:
      # 1. Check out the CONSUMER's repository (their *.e2e.yaml scenarios). This is the
      #    default checkout — `scenario-path` is resolved relative to this working tree.
      - name: Check out consumer scenarios
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 2. Check out the vouchfx SOURCE at the requested repo/ref into a sibling path, so
      #    building the engine never collides with the consumer's own files. The
      #    build-from-source install is deliberate, not a stopgap; see the header.
      - name: Check out vouchfx source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.vouchfx-repo }}
          ref: ${{ inputs.vouchfx-ref }}
          path: .vouchfx-src

      # 3. Install the .NET 8 SDK used to build vouchfx and run the suite.
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      # 3b. OPTIONAL fixture preparation. Runs on THIS runner, against the consumer's own
      #    checkout, before anything reads the suite. This is the only supported point at
      #    which a suite's declared-but-generated files can be created: the engine resolves
      #    and existence-checks every `security:` path before it starts a container, so no
      #    step inside the suite is early enough, and a preceding JOB would not help either
      #    — each job gets a fresh runner and a fresh checkout, so the material would have
      #    to travel as an artefact, which for private keys is exactly where it should not
      #    go. Skipped entirely when `setup-script` is empty.
      #    SECURITY: the caller-supplied path is bound to an `env:` var and dereferenced as
      #    "$SETUP_SCRIPT" rather than interpolated into the shell line via ${{ … }}, so a
      #    value containing shell metacharacters cannot be executed — the same pattern the
      #    pre-warm and run steps use.
      - name: Prepare suite fixtures
        if: inputs.setup-script != ''
        env:
          SETUP_SCRIPT: ${{ inputs.setup-script }}
        run: |
          script="$GITHUB_WORKSPACE/$SETUP_SCRIPT"
          if [ ! -f "$script" ]; then
            echo "::error::setup-script '$SETUP_SCRIPT' was not found at '$script'." >&2
            exit 1
          fi
          echo "::group::bash $SETUP_SCRIPT"
          bash "$script"
          echo "::endgroup::"

      # 4. Build vouchfx (Release) from source. Building the CLI project pulls in the six
      #    Core providers it references; the resulting `vouchfx` executable is the Aspire
      #    host that carries the embedded DCP metadata (Aspire.AppHost.Sdk + IsAspireHost).
      - name: Build vouchfx (Release, from source)
        working-directory: .vouchfx-src
        run: dotnet build src/Cli/Vouchfx.Cli/Vouchfx.Cli.csproj -c Release

      # 5. OPTIONAL image pre-warm. Pull each requested image BEFORE the run so DCP's
      #    internal ~20s per-resource startup watchdog is never spent on a cold pull (the
      #    documented CI-flake mitigation, mirroring build.yml). Best-effort and non-fatal:
      #    each pull records its own outcome (`|| pull_ok=no`) and a failure is reported as a
      #    warning after the group closes, so a stale/unreachable tag degrades to a cold pull
      #    rather than failing the job. Skipped entirely when `prewarm-images` is empty.
      #    SUPPLY-CHAIN: callers should pin each entry to an image DIGEST (name@sha256:...).
      - name: Pre-warm container images (best-effort, non-fatal)
        if: inputs.prewarm-images != ''
        env:
          PREWARM_IMAGES: ${{ inputs.prewarm-images }}
        run: |
          # HARDENING ONLY — THE POLICY HERE IS DELIBERATELY NOT build.yml's.
          # The equivalent block in this repository's own build.yml classifies pull
          # failures, bounds each pull, retries, and FAILS the job on a bad pin.
          # None of that is ported here and none of it should be: this is a
          # `workflow_call` reusable workflow with external consumers, its
          # `prewarm-images` contract has always promised best-effort, non-fatal
          # pre-warming, and turning a stale tag into a red job would break every
          # caller relying on that. The two workflows now differ in POLICY (what a
          # failed pull means) while agreeing completely on HARDENING (what untrusted
          # text may do to the runner) — and hardening is the half that cannot be
          # left to policy, because both echo remote-controlled text into a stream
          # the runner parses workflow commands out of.
          #
          # Two injection paths are closed, and both matter more here than in
          # build.yml because the image reference is CALLER-supplied rather than
          # pinned in-tree:
          #   1. `$image` itself is interpolated into ::group:: and ::warning::
          #      bodies. A caller passing a reference containing `%0A` would have it
          #      decoded by the runner into a real newline inside the annotation,
          #      ending the command early and starting one of the caller's choosing.
          #      Escaping `%` to `%25` first (and collapsing C0 controls) makes the
          #      reference inert while still readable.
          #   2. The pull's own output is the registry's text, and the runner parses
          #      `::`-prefixed commands from ordinary stdout, not just annotations.
          #      It is fenced with `::stop-commands::` and an unpredictable
          #      per-image token rather than escaped, because nothing in it is ever
          #      meant as a command and fencing keeps it byte-for-byte readable.
          # See the long-form rationale on both techniques in build.yml's pre-pull
          # step; this is the same reasoning applied to the published surface.
          one_line() {
            printf '%s' "${1//%/%25}" | tr '\000-\037' ' '
          }
          echo "$PREWARM_IMAGES" | while IFS= read -r image; do
            # Skip blank lines (trailing newline / indentation in the multiline input).
            #
            # Trimmed with parameter expansion rather than `xargs`, and that is a
            # bug fix rather than a style preference. `xargs` applies SHELL-LIKE
            # QUOTE PARSING to its input, so a reference containing an unbalanced
            # quote makes it exit non-zero ("xargs: unmatched double quote") — and
            # under the runner's default `bash -e` that killed the whole step,
            # contradicting this input's documented promise that a bad entry "never
            # fails the job". MEASURED: `echo 'foo"bar:1' | xargs` exits 1. The
            # expansions below cannot fail on any input: they strip leading and then
            # trailing [:space:] by pattern, with no parsing of the value at all.
            #
            # The change cuts BOTH WAYS, and both are worth knowing. `xargs` did not
            # only fail on malformed input, it also NORMALISED input — MEASURED:
            # `echo '"postgres:18.3"' | xargs` yields `postgres:18.3` and
            # `echo 'foo\bar' | xargs` yields `foobar`, so a quoted or
            # backslash-bearing entry used to be silently turned into a pullable
            # reference. The expansions keep such a value verbatim, so it now
            # reaches `docker pull` as written, fails there, and is reported as the
            # ordinary non-fatal warning below. Net effect in each direction: an
            # unbalanced quote goes from KILLING THE JOB to a warning, and a quoted
            # or backslashed entry that used to pull by accident goes from a silent
            # success to a warning. Both outcomes are non-fatal, so the documented
            # contract on `prewarm-images` — best-effort, never fails the job — now
            # holds in every case rather than in most of them.
            image=${image#"${image%%[![:space:]]*}"}
            image=${image%"${image##*[![:space:]]}"}
            [ -z "$image" ] && continue

            # The reference as it is safe to put inside a workflow command. The pull
            # below still uses the RAW $image — escaping is for the annotation, not
            # for docker.
            safe_image="$(one_line "$image")"

            log_token="$(head -c 16 /dev/urandom | od -An -tx1 | tr -d ' \n')" || log_token=""
            if [ "${#log_token}" -ne 32 ]; then
              # Non-fatal, matching this workflow's contract: skip the pre-warm
              # rather than echo the pull's output unfenced. The documented
              # consequence of a skipped pre-warm is a cold pull during StartAsync,
              # which is exactly what a failed one already means here.
              echo "::warning::could not generate a random log-fencing token, so $safe_image was not pre-warmed (non-fatal; DCP will cold-pull it during StartAsync)"
              continue
            fi

            echo "::group::docker pull $safe_image"
            echo "::stop-commands::$log_token"
            pull_ok=yes
            docker pull "$image" || pull_ok=no
            echo "::${log_token}::"
            echo "::endgroup::"
            # ONE VISIBLE DIFFERENCE from the pre-fence shape, recorded because the
            # behaviour is identical and the LOG LAYOUT is not: the failure warning
            # used to be emitted INSIDE the ::group::, and now follows ::endgroup::.
            # The HARD CONSTRAINT is only that it follow the fence RESUME: while the
            # fence is up the runner ignores workflow commands, so a ::warning::
            # raised inside it would simply be swallowed. Placing it after
            # ::endgroup:: rather than between the resume and ::endgroup:: is a
            # CHOICE, not a requirement — a ::warning:: in that gap is processed
            # normally. The choice is argued just below: an annotation buried in a
            # collapsed group is easy to miss, and this one now sits beside the
            # group rather than inside it. Same trigger, same text, same non-fatal
            # semantics, different position.
            [ "$pull_ok" = yes ] || echo "::warning::pre-pull of $safe_image failed (non-fatal; DCP will cold-pull it during StartAsync)"
          done

      # 6. Run the suite. `dotnet run --project` invokes the just-built `vouchfx` executable
      #    (the install is build-from-source). The CLI flags map directly to the inputs:
      #      --junit results.xml   → JUnit XML for CI ingestion (always written)
      #      --html  report.html   → self-contained HTML report (always written)
      #      --fail-on-env-error / --fail-on-inconclusive → added only when opted in
      #    Exit-code gating is the engine's: 0 Pass / 1 Fail (always gates) / 2 usage /
      #    3 EnvError (only with --fail-on-env-error) / 4 Inconclusive (only with
      #    --fail-on-inconclusive). A non-zero exit fails this step, and so the job — so a
      #    product Fail gates the consumer's CI by default, env-errors/inconclusives only on
      #    opt-in. `--` separates `dotnet run` options from the vouchfx arguments.
      #    WORKING-DIRECTORY: `dotnet run --project <csproj>` runs the app with its CWD set to
      #    the PROJECT directory (.vouchfx-src/src/Cli/Vouchfx.Cli), NOT the consumer checkout,
      #    so a RELATIVE scenario path would misresolve under the vouchfx source tree. We
      #    therefore pass the scenario path and the report paths as ABSOLUTE
      #    ($GITHUB_WORKSPACE/…), which resolve correctly regardless of the run CWD.
      #    SECURITY: the caller-supplied `scenario-path` is bound to an `env:` var and
      #    dereferenced as "$SCENARIO_PATH" rather than interpolated into the shell line
      #    via ${{ … }}, so a value containing shell metacharacters cannot be executed
      #    (the same pattern the pre-warm step uses for PREWARM_IMAGES).  The boolean
      #    fail-on-* inputs are `type: boolean`, so their ${{ … && '--flag' || '' }}
      #    expansion can only emit the fixed flag literal or nothing — no injection surface.
      #    TELEMETRY: the three VOUCHFX_TELEMETRY_* variables are bound unconditionally —
      #    the engine is inert unless ALL of them are present and valid (environment-
      #    configured telemetry, docs/telemetry.md), so empty values change nothing. They
      #    enter only via env:, never the shell line, per the injection-safety pattern.
      #    EXIT-CODE ECHO: the verdict token the CLI prints and the process exit code are
      #    two distinct trust signals. The taxonomy allows an Environment-error or
      #    Inconclusive verdict to exit 0 when the matching --fail-on-* flag above is off,
      #    so the exit code is not always implied by the verdict text — and today it is
      #    only visible on failure, via the step's own failure banner. We capture it
      #    explicitly (`|| exit_code=$?`, which does not trip the default `bash -e` shell)
      #    and echo it on every run, pass or fail, so the exit-code table above is
      #    auditable at a glance in the log instead of inferred. The trailing
      #    `exit $exit_code` keeps step/job gating byte-identical to a bare `dotnet run …`.
      - name: Run vouchfx suite
        # SECURITY: every value bound below is readable by the SUITE ITSELF via a
        # ${env:NAME} reference (REQ-006; docs/02 §3.2.6) — that is how the SUT
        # configuration surface and this workflow's telemetry wiring both work. Never
        # add a secret here unless this workflow is being called from a trigger context
        # an untrusted contributor cannot influence (see the telemetry header block
        # above for the full rationale).
        env:
          SCENARIO_PATH: ${{ inputs.scenario-path }}
          VOUCHFX_TELEMETRY_ENDPOINT: ${{ inputs.telemetry-endpoint }}
          VOUCHFX_TELEMETRY_INSTALL_ID: ${{ inputs.telemetry-install-id }}
          VOUCHFX_TELEMETRY_TOKEN: ${{ secrets.telemetry-token }}
        run: |
          exit_code=0
          dotnet run \
            --project .vouchfx-src/src/Cli/Vouchfx.Cli/Vouchfx.Cli.csproj \
            -c Release \
            --no-build \
            -- \
            run "$GITHUB_WORKSPACE/$SCENARIO_PATH" \
            --junit "$GITHUB_WORKSPACE/results.xml" \
            --html "$GITHUB_WORKSPACE/report.html" \
            ${{ inputs.fail-on-env-error && '--fail-on-env-error' || '' }} \
            ${{ inputs.fail-on-inconclusive && '--fail-on-inconclusive' || '' }} || exit_code=$?
          echo "vouchfx exit code: $exit_code (0=Pass · 1=Fail · 2=usage · 3=EnvironmentError, gated by --fail-on-env-error · 4=Inconclusive, gated by --fail-on-inconclusive)"
          exit $exit_code

      # 7. ALWAYS publish the reports, even when the run step failed (a Fail still produces
      #    a results.xml + report.html — those artefacts are most valuable precisely when
      #    the suite did not pass). if: always() so a non-zero run exit does not skip upload.
      - name: Upload vouchfx reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: |
            results.xml
            report.html
          retention-days: 7
          if-no-files-found: warn
