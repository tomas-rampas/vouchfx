# examples/cache-assert-redis.e2e.yaml — cache-assert.redis suite.
#
# Run (full docker capstone — requires Docker + Redis image):
#   vouchfx run examples/cache-assert-redis.e2e.yaml
metadata:
  name: cache-assert-redis-example
  description: >
    Example showing how to assert on Redis cache state with the cache-assert.redis
    provider.  A system-under-test writes a value into Redis; the steps then verify the
    value, the key's presence, its TTL, and a few collection shapes (hash / list / set).
    `cache-assert` is a multi-provider family (redis + elasticsearch), so the dotted form
    `cache-assert.redis` is required — the bare `cache-assert` alias is ambiguous.

    HONEST-EXAMPLE NOTE: the placeholder SUT below (whoami) does not itself talk
    to Redis, and the engine provisions the cache EMPTY. In production usage, the
    SUT's own session handler is the thing that would write the keys these steps
    assert. This example instead SIMULATES those writes with a script.csharp step
    over the staged connection string — exactly the same HONEST-disclosure
    approach storage-assert-s3.e2e.yaml and db-assert-dynamodb.e2e.yaml use. It
    still exercises the full Redis topology + every cache-assert.redis operation
    end to end.

environment:
  services:
    # The system under test.  Replace with your own image or project reference.
    app:
      image: traefik/whoami:latest

  dependencies:
    # Redis cache.  Its connection string is staged as conn::cache for cache-assert.redis.
    cache:
      type: redis

variables:
  userId: "42"

steps:
  - id: prime-cache
    type: http.rest
    description: >
      Drive the business transaction that (in a real SUT) writes the user's
      session into Redis: SET user:42 = "active" (with a TTL) and populate a
      profile hash.  The whoami placeholder answers 200 to any request and
      ignores the body — replace it with your real SUT, whose handler would
      perform the writes the next step simulates.
    target: app
    method: POST
    path: /sessions
    body: '{"userId":"42","status":"active"}'
    expect:
      status: 200

  - id: simulate-session-write
    type: script.csharp
    description: >
      SIMULATES the SUT's own write path (see the HONEST-EXAMPLE NOTE in the
      suite description above): connects with the staged connection string and
      writes every shape the assertions below expect — the session string (with
      a TTL), the profile hash, the job queue list, and the tag set.  The
      delete-first calls make the step idempotent across reruns against the
      same container.  A real suite would delete this step entirely — its SUT
      already does these writes.
    code: |
      var connStr = (string)Vars["conn::cache"];
      var userId = (string)Vars["userId"];
      var muxer = await StackExchange.Redis.ConnectionMultiplexer.ConnectAsync(connStr);
      try
      {
          var db = muxer.GetDatabase();
          await db.StringSetAsync("user:" + userId, "active", TimeSpan.FromMinutes(5));
          await db.HashSetAsync(
              "user:" + userId + ":profile",
              new StackExchange.Redis.HashEntry[]
              {
                  new StackExchange.Redis.HashEntry("status", "verified"),
              });
          var queueKey = "user:" + userId + ":queue";
          await db.KeyDeleteAsync(queueKey);
          await db.ListRightPushAsync(
              queueKey,
              new StackExchange.Redis.RedisValue[] { "job-1", "job-2", "job-3" });
          var tagsKey = "user:" + userId + ":tags";
          await db.KeyDeleteAsync(tagsKey);
          await db.SetAddAsync(
              tagsKey,
              new StackExchange.Redis.RedisValue[] { "beta", "early-adopter" });
      }
      finally { muxer.Dispose(); }

  # ── String value assertion ───────────────────────────────────────────────────
  - id: assert-session-value
    type: cache-assert.redis
    description: The cached session value for the user equals "active".
    target: cache
    key: "user:{userId}"        # {userId} is substituted at execution time
    operation: get
    expect:
      value: active
    verifyMode: RETRY           # poll until the SUT has written the value
    timeout: 10s

  # ── Key presence assertion ──────────────────────────────────────────────────
  - id: assert-session-present
    type: cache-assert.redis
    description: The session key exists.
    target: cache
    key: "user:{userId}"
    operation: exists
    expect:
      exists: true

  # ── TTL presence assertion (has-a-positive-TTL check) ───────────────────────
  - id: assert-session-has-ttl
    type: cache-assert.redis
    description: The session key was written with an expiry (a positive TTL).
    target: cache
    key: "user:{userId}"
    operation: ttl
    expect:
      exists: true             # ttl asserts presence of a positive TTL, not an exact value

  # ── Hash-field assertion ────────────────────────────────────────────────────
  - id: assert-profile-status
    type: cache-assert.redis
    description: The user's profile hash records a verified status.
    target: cache
    key: "user:{userId}:profile"
    operation: hget
    field: status
    expect:
      value: verified

  # ── List length assertion ───────────────────────────────────────────────────
  - id: assert-queue-length
    type: cache-assert.redis
    description: Exactly three items are queued for the user.
    target: cache
    key: "user:{userId}:queue"
    operation: llen
    expect:
      length: 3

  # ── Set cardinality assertion ───────────────────────────────────────────────
  - id: assert-tag-count
    type: cache-assert.redis
    description: The user has two tags.
    target: cache
    key: "user:{userId}:tags"
    operation: scard
    expect:
      length: 2
