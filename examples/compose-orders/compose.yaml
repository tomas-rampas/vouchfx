services:
  web:
    image: vouchfx-compose-orders-example:local
    build: ./app
    ports:
      - target: 8080
        host_ip: 127.0.0.1
    environment:
      DATABASE_CONNECTION_STRING: "Host=postgres;Port=5432;Database=orders;Username=orders;Password=${VOUCHFX_COMPOSE_PASSWORD}"
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:17-alpine
    ports:
      - target: 5432
        host_ip: 127.0.0.1
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: "${VOUCHFX_COMPOSE_PASSWORD}"
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U orders -d orders"]
      interval: 1s
      timeout: 2s
      retries: 30
    volumes:
      - data:/var/lib/postgresql/data
volumes:
  data: {}
