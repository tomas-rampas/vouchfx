metadata:
  name: mongodb-order-assertion
  owner: platform-team
  tags: [mongodb, db-assert, orders]
  description: >
    Verifies that a placed order is persisted correctly in MongoDB.
    The http.rest step places the order; the db-assert.mongodb step
    asserts the document is present with the expected field values.

environment:
  services:
    orders-api:
      image: "ghcr.io/example/orders-api:latest"
      env:
        # Container-native connection string, resolved to the mongodb dependency's
        # database resource (never the host-published localhost:randomport) — see
        # the SUT configuration surface (`env:`).  A secret reference is NOT valid
        # here: env: values resolve at container-BUILD time, before the topology
        # starts, whereas ${secret:...} deliberately resolves only at
        # step-execution time (§17) — baking a secret into a container's
        # environment would expose it via `docker inspect`.
        MONGO_CONNECTION: "${conn:orders-mongo}"

  dependencies:
    orders-mongo:
      type: mongodb

steps:
  - id: place-order
    type: http.rest
    target: orders-api
    method: POST
    path: /orders
    body: |
      {"productId": "ABC-123", "quantity": 2}
    expect:
      status: 201
    capture:
      orderId: "$.id"

  - id: assert-order-persisted
    type: db-assert.mongodb
    target: orders-mongo
    collection: orders
    filter: '{"_id": "{orderId}"}'
    expect:
      count: 1
      document:
        productId: "ABC-123"
        quantity: "2"
        status: "PENDING"
    verifyMode: RETRY
    timeout: 30s

  - id: assert-no-cancelled-orders
    type: db-assert.mongodb
    target: orders-mongo
    collection: orders
    filter: '{"status": "CANCELLED"}'
    expect:
      count: 0
