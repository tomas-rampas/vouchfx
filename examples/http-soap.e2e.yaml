metadata:
  name: http-soap-example
  description: >
    Example showing how to call a SOAP 1.1 service and assert on its response — the second
    provider in the http family alongside http.rest. http.soap is the RAW-ENVELOPE provider
    (v1 decision): you supply the FULL SOAP envelope yourself; there is no auto-wrapping of a
    bare payload. The http family is now multi-provider; the dotted form is required either
    way (http.rest / http.soap), exactly like every other family.
    HONEST-EXAMPLE NOTE: the placeholder SUT below (whoami) accepts any POST and answers 200
    with a plain-text body, so the runnable step asserts transport-level success only — the
    envelope/SOAPAction mechanics it exercises are real. The payload-level assertions a real
    SOAP SUT enables (expect.xpath, expect.fault, XPath capture) are shown in the commented
    step at the end, exactly as you would write them. This file runs green as-is.

environment:
  services:
    # The system under test's SOAP endpoint. Replace with your own image or project
    # reference — any server that accepts a SOAP 1.1 POST at the declared path works
    # unchanged, exactly like http.rest's target addressing.
    app:
      image: traefik/whoami:latest

variables:
  userId: "user-1001"

steps:
  - id: get-user
    type: http.soap
    description: >
      A SOAP 1.1 call: the full envelope is posted with Content-Type text/xml and the quoted
      SOAPAction header; {placeholder} substitution runs inside the envelope template at
      execution time. status defaults to 200 when expect.status is omitted, and no fault is
      expected by default. Against the plain-text stand-in SUT only the status assertion is
      declared; see the commented step below for the payload assertions a real SOAP endpoint
      enables.
    target: app
    path: /soap/users
    action: "http://example.com/GetUser"
    envelope: |
      <?xml version="1.0" encoding="utf-8"?>
      <soap:Envelope xmlns:soap="http://schemas.xmlsoap.org/soap/envelope/">
        <soap:Body>
          <GetUser xmlns="http://example.com/users">
            <UserId>{userId}</UserId>
          </GetUser>
        </soap:Body>
      </soap:Envelope>
    expect:
      status: 200

  # With a REAL SOAP SUT, payload-level expectations and captures look like this
  # (namespace-agnostic local-name() XPath, consistent with http.rest's XPath capture;
  # a SOAP Fault is a first-class expected outcome via expect.fault — conventionally
  # served with HTTP 500, and the observation on an unexpected fault carries only the
  # faultcode, never the faultstring):
  #
  # - id: get-missing-user
  #   type: http.soap
  #   target: app
  #   path: /soap/users
  #   action: "http://example.com/GetUser"
  #   envelope: |
  #     <?xml version="1.0" encoding="utf-8"?>
  #     <soap:Envelope xmlns:soap="http://schemas.xmlsoap.org/soap/envelope/">
  #       <soap:Body>
  #         <GetUser xmlns="http://example.com/users">
  #           <UserId>does-not-exist</UserId>
  #         </GetUser>
  #       </soap:Body>
  #     </soap:Envelope>
  #   expect:
  #     status: 500
  #     fault: true
  #
  # - id: get-existing-user
  #   type: http.soap
  #   target: app
  #   path: /soap/users
  #   action: "http://example.com/GetUser"
  #   envelope: |
  #     ... as above with a real UserId ...
  #   expect:
  #     status: 200
  #     xpath:
  #       - path: //*[local-name()='Body']/*[local-name()='GetUserResponse']/*[local-name()='Status']
  #         value: "OK"
  #   capture:
  #     userName:
  #       xpath: //*[local-name()='Body']/*[local-name()='GetUserResponse']/*[local-name()='Name']
