metadata:
  name: mail-expect-smtp-example
  description: >
    Example showing how to assert that a system-under-test sends an expected
    email via the mail-expect.smtp provider backed by a Mailpit SMTP capture
    container.  The SUT sends email through Mailpit's SMTP port (1025); the
    step queries Mailpit's HTTP API to verify the message arrived.

environment:
  services:
    # The system under test.  Replace with your own image or project reference.
    app:
      image: traefik/whoami:latest

  dependencies:
    # Mailpit: captures SMTP email and exposes a REST API + web UI.
    # HTTP API: http://localhost:8025 (staged as conn::mailpit)
    # SMTP port: localhost:1025 (staged as svc::mailpit-smtp)
    mailpit:
      type: mailpit

steps:
  - id: trigger-welcome-email
    type: http.rest
    description: >
      Drive the business transaction that (in a real SUT) sends a welcome email
      through Mailpit's SMTP port.  The whoami placeholder answers 200 to any
      request and does not itself send email — replace it with your real SUT.
      This example does not depend on the placeholder sending anything: the next
      step (simulate-welcome-email) sends the asserted message explicitly.
    target: app
    method: POST
    path: /send-welcome
    body: '{"to":"alice@example.com","name":"Alice"}'
    expect:
      status: 200

  - id: simulate-welcome-email
    type: script.csharp
    description: >
      SIMULATES the SUT's own send path: parses the staged SMTP endpoint
      (svc::mailpit-smtp — the tcp://host:port URL EnvironmentMapper's mailpit
      registration stages alongside the conn:: HTTP API URL) and sends the
      welcome email the assertion below expects via System.Net.Mail.  A real
      suite would delete this step entirely — its SUT already sends this email.
    code: |
      var raw = (string)Vars["svc::mailpit-smtp"];
      string host;
      int port;
      if (raw.Contains("://"))
      {
          var uri = new Uri(raw);
          host = uri.Host;
          port = uri.Port;
      }
      else
      {
          var idx = raw.LastIndexOf(':');
          host = raw.Substring(0, idx);
          port = int.Parse(raw.Substring(idx + 1), System.Globalization.CultureInfo.InvariantCulture);
      }

      var smtp = new System.Net.Mail.SmtpClient(host, port);
      try
      {
          var message = new System.Net.Mail.MailMessage(
              "noreply@example.com",
              "alice@example.com",
              "Welcome to Example",
              "Hello, Alice - welcome aboard!");
          try
          {
              await smtp.SendMailAsync(message);
          }
          finally { message.Dispose(); }
      }
      finally { smtp.Dispose(); }

  - id: assert-welcome-email
    type: mail-expect.smtp
    description: >
      Assert that exactly one welcome email arrived at alice@example.com.
      verifyMode: RETRY polls until the email arrives or the timeout expires.
    target: mailpit
    expect:
      count: 1
      match:
        to: alice@example.com
        subject-contains: "Welcome"
        body-contains: "Hello, Alice"
    verifyMode: RETRY
    timeout: 30s
