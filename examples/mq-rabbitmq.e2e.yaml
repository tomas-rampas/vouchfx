metadata:
  name: mq-rabbitmq-example
  description: >
    Example showing how to publish a message to a RabbitMQ queue and then assert
    that the expected message is present, using the mq-publish.rabbitmq and
    mq-expect.rabbitmq providers backed by a live RabbitMQ container.
    The mq-expect step uses verifyMode: RETRY so the engine polls until the message
    arrives or the timeout expires — authors never write Thread.Sleep.

environment:
  services:
    # The system under test.  Replace with your own image or project reference.
    app:
      image: traefik/whoami:latest

  dependencies:
    # RabbitMQ: AMQP 0-9-1 broker.  The connection URI is staged as conn::rmq
    # (VarKeys.Connection("rmq")) by the orchestrator and consumed by both
    # mq-publish.rabbitmq and mq-expect.rabbitmq via the 'target' field.
    #
    # NOTE: the 'orders' queue used in the steps below must already exist when the
    # publish step runs — publishes to the default exchange are silently dropped
    # when no queue with a matching name exists.  In production your SUT declares
    # it on startup; this standalone example declares it explicitly with the
    # declare-orders-queue script step below.
    rmq:
      type: rabbitmq

steps:
  - id: trigger-order-event
    type: http.rest
    description: >
      Drive the business transaction that (in a real SUT) publishes an order
      event to the 'orders' queue via the AMQP URI the SUT receives at startup.
      The whoami placeholder answers 200 to any request and does not itself talk
      to RabbitMQ — replace it with your real SUT.  This example does not depend
      on the placeholder publishing anything: the publish-order-event step
      publishes the asserted message explicitly.
    target: app
    method: POST
    path: /orders
    body: '{"customerId":"cust-1","amount":49.99}'
    expect:
      status: 200

  - id: declare-orders-queue
    type: script.csharp
    description: >
      Declares the 'orders' queue over the staged AMQP connection string (the
      same RabbitMQ.Client v7 async API the mq-*.rabbitmq providers use).  In
      production your SUT declares its own queues on startup and this step
      disappears; standalone, the declaration must happen before the publish
      step because publishes to the default exchange are silently dropped when
      no matching queue exists (see the dependency NOTE above).  QueueDeclareAsync
      is idempotent, so reruns against the same container are safe.
    code: |
      var connStr = (string)Vars["conn::rmq"];
      var factory = new RabbitMQ.Client.ConnectionFactory { Uri = new Uri(connStr) };
      RabbitMQ.Client.IConnection conn = null;
      RabbitMQ.Client.IChannel channel = null;
      try
      {
          conn = await factory.CreateConnectionAsync(System.Threading.CancellationToken.None);
          channel = await conn.CreateChannelAsync(
              cancellationToken: System.Threading.CancellationToken.None);
          // durable: true is required — RabbitMQ 4.x deprecates transient
          // non-exclusive queues (declaring one is refused with AMQP 541
          // INTERNAL_ERROR "Feature `transient_nonexcl_queues` is deprecated").
          await channel.QueueDeclareAsync(
              queue: "orders",
              durable: true,
              exclusive: false,
              autoDelete: false,
              arguments: null,
              cancellationToken: System.Threading.CancellationToken.None);
      }
      finally
      {
          if (channel != null) { await channel.DisposeAsync(); }
          if (conn != null) { await conn.DisposeAsync(); }
      }

  - id: publish-order-event
    type: mq-publish.rabbitmq
    description: >
      Direct publish step: sends an order-created event to the default exchange
      routed to the 'orders' queue.  Use this pattern when your test needs to
      seed a specific message rather than relying on the SUT to produce it.
      NOTE: A Pass verdict confirms hand-off to the broker client only; delivery
      is NOT confirmed (publisher confirms are a post-v1 feature).  Verify
      delivery with a following mq-expect.rabbitmq step (see assert-order-event).
    target: rmq
    routingKey: orders
    payload: '{"event":"order-created","orderId":"ord-001","customerId":"cust-1"}'
    headers:
      x-event-type: order-created

  - id: assert-order-event
    type: mq-expect.rabbitmq
    description: >
      Assert that a message matching the criteria is present in the 'orders' queue.
      The criteria are AND-conjunctive: the body must contain 'order-created', the
      'x-event-type' header must be 'order-created', and the JSONPath $.orderId
      must select 'ord-001'.
      verifyMode: RETRY polls until the message arrives or the timeout expires.
    target: rmq
    queue: orders
    match:
      payloadContains: "order-created"
      headers:
        x-event-type: order-created
      json:
        $.orderId: ord-001
    verifyMode: RETRY
    timeout: 30s
