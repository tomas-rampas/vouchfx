# nginx configuration for the `orders-api` service of
# examples/security-mtls.e2e.yaml — a TLS-terminating API that demands a client
# certificate.
#
# This file is the SERVER half of mutual TLS. vouchfx never writes it: the
# engine configures the client and confirms the connection, but the listener,
# its certificate and its verification policy are yours. That division is the
# thing this example exists to make concrete, so the file is committed and
# readable rather than generated.
#
# It is delivered to /etc/nginx/conf.d/default.conf (see `serverArtifacts` in
# the suite), which replaces the image's own plaintext port-80 server block.
#
# Deliberately NOT delivered to /etc/nginx/templates/. The nginx image runs
# envsubst over anything it finds there, and envsubst does not know that
# `$ssl_client_s_dn` belongs to nginx — with a matching environment variable
# defined it would substitute the value at start-up and freeze this file's
# per-request evidence into a constant. Writing the final configuration
# directly keeps nginx the only thing that ever expands a `$` here.

server {
    listen 8443 ssl;
    server_name localhost;

    # The server's own identity, and the anchor it validates CLIENTS against.
    # Both were issued by the one authority the suite declares as `caCert`.
    ssl_certificate        /etc/nginx/certs/server.pem;
    ssl_certificate_key    /etc/nginx/certs/server-key.pem;
    ssl_client_certificate /etc/nginx/certs/ca.pem;

    # The floor stated here rather than inherited from whichever nginx build
    # this configuration is copied onto — older ones still accept TLS 1.0.
    ssl_protocols TLSv1.2 TLSv1.3;

    # The point of the whole fixture. Without it the API would answer an
    # anonymous caller happily, and the suite would "prove" mutual TLS while
    # presenting nothing. With it, a request carrying no client certificate is
    # answered `400 No required SSL certificate was sent`.
    ssl_verify_client on;

    access_log /dev/stdout;

    location / {
        default_type application/json;

        # The server's own account of who it just authenticated. The suite
        # captures both fields and carries them onto the Kafka topic, so a green
        # verdict depends on nginx having reported SUCCESS for the identity the
        # suite declared — not merely on the request having returned 200.
        #
        # THIS LINE TAKES A SHORTCUT A REAL SERVICE MUST NOT. `$ssl_client_s_dn`
        # is spliced into a JSON string literal with no escaping, because nginx
        # has no JSON escaping to apply in a `return` directive. It is safe HERE
        # only because the only certificate that ever reaches this listener is
        # the one the setup script mints, whose common name contains nothing that
        # needs escaping. Point this at a corporate PKI and it breaks: a
        # perfectly ordinary distinguished name containing a quote, a backslash
        # or a comma-quoted value emits malformed JSON, and the suite then fails
        # at the capture with a parse error that says nothing about the cause.
        # It cannot be used to forge a value — the DN is the DN the CA issued —
        # but it can corrupt one. A real service builds this response in its
        # application code, with a JSON serialiser.
        return 200 '{"clientDn":"$ssl_client_s_dn","verify":"$ssl_client_verify"}';
    }
}
