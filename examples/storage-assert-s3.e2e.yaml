metadata:
  name: storage-assert-s3-example
  description: >
    Example showing how to assert against an object the system under test writes to
    an S3-compatible object store.  storage-assert is a brand-new family — the
    dotted form storage-assert.s3 is required (there is no bare storage-assert
    alias).  The engine provisions a real MinIO container for the "reports" minio
    dependency; storage-assert.s3 HEADs the object (and, only if sha256 or
    contentContains is declared, GETs a bounded — 16 MiB cap — copy of the body).

    HONEST-EXAMPLE NOTE: the placeholder SUT below (whoami) does not itself write to
    S3, and MinIO starts with no bucket and no object. In production usage, the
    SUT's own report-export handler is the thing that would PUT the object this
    provider observes. This example instead SIMULATES that write with a
    script.csharp step that parses the staged connection string, creates the
    bucket, and PUTs the object the assertion below expects — exactly the same
    HONEST-disclosure approach trace-expect-otlp.e2e.yaml uses to simulate the
    SUT's own OTLP export (see its KNOWN LIMITATION note). It still exercises the
    full MinIO topology + HEAD + RETRY + assertion path end to end.

environment:
  services:
    # The system under test.  Replace with your own image or project reference.
    app:
      image: traefik/whoami:latest
  dependencies:
    reports: { type: minio }

variables:
  reportKey: "exports/daily-report.csv"

steps:
  - id: trigger-export
    type: http.rest
    description: Drive the business transaction that (in a real SUT) writes the report.
    target: app
    method: POST
    path: /reports/export
    body: '{"format":"csv"}'
    expect:
      status: 200

  - id: simulate-report-write
    type: script.csharp
    description: >
      SIMULATES the SUT's own write path (see the HONEST-EXAMPLE NOTE in the suite
      description above): parses the minio dependency's staged connection string
      (the "ServiceURL=…;AccessKey=…;SecretKey=…" form EnvironmentMapper's "minio"
      registration produces), creates the "reports" bucket on demand, then PUTs the
      object the assertion below expects. A real suite would delete this step
      entirely — its SUT already does this write.
    code: |
      var connStr = (string)Vars["conn::reports"];
      string serviceUrl = string.Empty, accessKey = string.Empty, secretKey = string.Empty;
      foreach (var part in connStr.Split(';', StringSplitOptions.RemoveEmptyEntries))
      {
        var eq = part.IndexOf('=');
        if (eq <= 0) continue;
        var k = part.Substring(0, eq).Trim();
        var v = part.Substring(eq + 1).Trim();
        if (string.Equals(k, "ServiceURL", StringComparison.OrdinalIgnoreCase)) serviceUrl = v;
        else if (string.Equals(k, "AccessKey", StringComparison.OrdinalIgnoreCase)) accessKey = v;
        else if (string.Equals(k, "SecretKey", StringComparison.OrdinalIgnoreCase)) secretKey = v;
      }

      Amazon.S3.AmazonS3Client client = null;
      try
      {
        client = new Amazon.S3.AmazonS3Client(
          new Amazon.Runtime.BasicAWSCredentials(accessKey, secretKey),
          new Amazon.S3.AmazonS3Config
          {
            ServiceURL = serviceUrl,
            ForcePathStyle = true,
            MaxErrorRetry = 0,
            Timeout = TimeSpan.FromSeconds(5),
            ConnectTimeout = TimeSpan.FromSeconds(5),
          });

        try
        {
          await client.PutBucketAsync("reports");
        }
        catch (Amazon.S3.AmazonS3Exception ex) when (
          string.Equals(ex.ErrorCode, "BucketAlreadyOwnedByYou", StringComparison.Ordinal)
          || string.Equals(ex.ErrorCode, "BucketAlreadyExists", StringComparison.Ordinal))
        {
          // Already created by a prior scenario run against the same container.
        }

        var reportKey = (string)Vars["reportKey"];
        var body = "date,amount\n2026-07-08,49.99\n";
        await client.PutObjectAsync(new Amazon.S3.Model.PutObjectRequest
        {
          BucketName = "reports",
          Key = reportKey,
          ContentBody = body,
          ContentType = "text/csv",
        });
      }
      finally
      {
        client?.Dispose();
      }

  - id: assert-report-written
    type: storage-assert.s3
    description: >
      Assert the exported report object exists with the expected content type and a
      non-trivial size.  RETRY accommodates the export lagging the HTTP response
      that triggered it — the family's canonical "eventually-consumed" idiom.
    target: reports
    bucket: reports
    key: "{reportKey}"
    verifyMode: RETRY
    timeout: 15s
    expect:
      exists: true
      minSize: "1"
      contentType: "text/csv"
    capture:
      reportEtag: $.etag

  - id: assert-report-not-yet-purged
    type: storage-assert.s3
    description: >
      A later step in the same suite might assert the OPPOSITE — that a purged
      report no longer exists.  exists:false excludes every content expectation
      (size/minSize/sha256/contentContains/contentType/metadata).
    target: reports
    bucket: reports
    key: "exports/already-purged.csv"
    expect:
      exists: false
