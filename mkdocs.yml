site_name: vouchfx
site_description: >-
  Declarative .e2e.yaml end-to-end tests for distributed .NET systems, compiled to
  memory-safe C# and orchestrated with .NET Aspire and Testcontainers.
site_url: https://tomas-rampas.github.io/vouchfx/
repo_url: https://github.com/tomas-rampas/vouchfx
repo_name: tomas-rampas/vouchfx
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: _site

# Maintainer-local internal material that exists on disk but must never
# reach the built site: the internal MVP project plan and review evidence.
# Paths are relative to docs_dir.
exclude_docs: |
  03_MVP_Project_Plan.md
  reviews/

# There is deliberately no docs/index.md — see scripts/site_hooks/landing.py,
# which copies the bespoke site/ landing page over the root of the build
# after MkDocs finishes writing every other page.
#
# ORDER MATTERS: MkDocs fires same-event hooks (all three implement
# on_post_build) in exactly the order listed here — verified against
# mkdocs' own source (config_options.Hooks.post_validation appends each
# hook module, in list order, into the same PluginCollection regular
# plugins use) and empirically with throwaway hooks in both list orders.
#   1. landing.py   copies site/index.html (and companions) into the build.
#   2. facts.py     substitutes {{fact:KEY}} tokens across every built
#                    text-like file, including the one landing.py just
#                    copied in — it MUST run after landing.py, or
#                    index.html won't exist yet to substitute into.
#   3. redirects.py writes legacy-URL redirect stubs, and refuses to
#                    overwrite anything already present — it runs LAST so
#                    its collision check sees the complete, final build.
hooks:
  - scripts/site_hooks/landing.py
  - scripts/site_hooks/facts.py
  - scripts/site_hooks/redirects.py

theme:
  name: material
  font: false
  favicon: assets/favicon.svg
  logo: assets/favicon.svg
  palette:
    - scheme: slate
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  # base_path's "." entry is resolved relative to the process's current working
  # directory, NOT relative to this file — so `mkdocs build`/`mkdocs serve` MUST be
  # invoked from the repository root (as documented everywhere this is run) for
  # docs/changelog.md, docs/governance.md and docs/project-readme.md to find the
  # root-level README.md/CHANGELOG.md/GOVERNANCE.md they embed via --8<--.
  # check_site.py's check_snippet_allowlist additionally constrains every --8<--
  # target in docs/ source to those three files, regardless of where base_path
  # can reach.
  - pymdownx.snippets:
      base_path:
        - .
        - docs
      check_paths: true
  - attr_list
  - md_in_html
  - toc:
      permalink: true

plugins:
  - search
  - blog:
      blog_dir: blog
      post_dir: "{blog}/posts"
      archive: true
      categories: true
      pagination_per_page: 10
  # enable_git_follow: false was evaluated (per review) as a way to quiet the
  # "no git logs, using current timestamp" warnings the plugin logs for
  # not-yet-committed stub pages (changelog.md, governance.md, project-readme.md,
  # blog/index.md). It made no measurable difference: those warnings fire on the
  # plugin's "this file has zero git history" fallback path, which git-follow
  # (a rename-tracking option) doesn't touch. Left at the plugin default; the
  # warnings are expected to self-resolve once these files are committed and
  # `git log` has something to report for them.
  - git-revision-date-localized:
      enable_creation_date: true

# Mirrors scripts/build_site.py's DOCS list (lines 33-51): same groups,
# same order, same labels. Keep the two in step until build_site.py is
# retired.
nav:
  - Design docs:
      - 01 · Architecture Blueprint: 01_Technical_Architecture_and_Engineering_Blueprint.md
      - 02 · YAML DSL Specification: 02_YAML_DSL_Specification_and_VSCode_Extension_Design.md
  - User guides:
      - Getting started (60-minute path): getting-started.md
      - Recipes: recipes.md
      - Common patterns: common-patterns.md
      - Troubleshooting: troubleshooting.md
      - Telemetry & privacy: telemetry.md
      - Language reference (generated): language-reference.md
      - The memory-leak harness: memory-harness.md
      - Accessibility: accessibility.md
  - Knowledge base:
      - "KB: DCP orchestrator not found": kb/dcp-orchestrator-portability.md
  - Ecosystem:
      - The ecosystem: ecosystem.md
  - Project:
      - Roadmap: roadmap.md
      - Changelog: changelog.md
      - Governance: governance.md
      - "Decision: dotnet tool packaging": decisions/dotnet-tool-packaging.md
      - Project README: project-readme.md
  - Blog:
      - blog/index.md
