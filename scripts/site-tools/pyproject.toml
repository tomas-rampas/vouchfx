[project]
name = "vouchfx-site-tools"
version = "1.0.0"
description = "Shared static-site generator for the vouchfx ecosystem's GitHub Pages sites."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "markdown",
    "pygments",
]

[project.optional-dependencies]
# Regression suite for the SiteConfig.site_url contract (vouchfx issue #254).
# Install with: pip install -e "scripts/site-tools[test]"
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
