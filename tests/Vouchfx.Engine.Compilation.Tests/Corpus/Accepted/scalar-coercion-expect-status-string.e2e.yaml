# KNOWN-FAILING today — see scalar-coercion-headers-numeric-value.e2e.yaml for
# the full explanation. http.rest's 'expect.status' is typed { "type":
# "integer" }, but a quoted string status code is a plausible authoring habit
# (copied from a curl transcript, a log line, or another tool's config) and
# the engine compares the observed status as text either way. A quoted "200"
# fails only at this schema gate today.
metadata:
  name: scalar-coercion-expect-status-string
environment:
  services:
    app:
      image: traefik/whoami:latest
steps:
  - id: call-app
    type: http.rest
    target: app
    method: GET
    path: /api
    expect:
      status: "200"
