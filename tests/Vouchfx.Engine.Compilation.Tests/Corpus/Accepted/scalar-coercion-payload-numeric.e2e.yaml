# REJECTED BY THE SCHEMA TODAY, ACCEPTED BY THE ENGINE — see
# scalar-coercion-headers-numeric-value.e2e.yaml for
# the full explanation. mq-publish.kafka's 'payload' is typed { "type":
# "string" }, but the binder reads it via GetScalar (raw scalar text)
# regardless of YAML type, so a bare numeric payload works at runtime today
# and fails only at this schema gate.
metadata:
  name: scalar-coercion-payload-numeric
environment:
  dependencies:
    events:
      type: kafka
steps:
  - id: publish-event
    type: mq-publish.kafka
    target: events
    topic: orders
    payload: 12345
