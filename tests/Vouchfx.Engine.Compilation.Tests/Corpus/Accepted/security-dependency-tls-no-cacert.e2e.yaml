# Surface coverage: environment.dependencies.<name>.security with profile: tls and no
# caCert declared. REQ-001's own acceptance names this exact shape as valid — caCert's
# absence is not an error, since the relevant CA may already live in a declared
# truststore or the platform's own default trust store.
metadata:
  name: security-dependency-tls-no-cacert
environment:
  dependencies:
    cache:
      type: redis
      security:
        profile: tls
        endpoint: 6380
steps:
  - id: noop
    type: script.csharp
    code: "// Filler step: this fixture exercises environment.dependencies.security surface only."
