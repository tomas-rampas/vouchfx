# Surface coverage: security.profile: mtls with the optional 'clientKeyPassword' field
# (spec client-key-password, REQ-001/REQ-002) — the shape an author writes when the file
# named by 'clientKey' is an ENCRYPTED PEM private key, so the key need never sit
# unencrypted at rest inside the suite checkout.
#
# Three things this fixture pins, and each is a way the field could have been got wrong:
#   • 'clientKeyPassword' validates under profile 'mtls' at all.
#   • It is OPTIONAL there — the 'mtls' branch's own 'required' stays
#     ["clientCert", "clientKey"], because whether a key is encrypted is not knowable
#     from this document, only from the file it names. (security-mtls-without-cacert
#     and security-service-mtls-full remain the fixtures proving an mtls block WITHOUT
#     this field still validates.)
#   • The value is a whole '${secret:source/path}' reference, never a literal (§17). The
#     'pattern' enforcing that is the anchored form of SecretReference's own grammar; the
#     two are held in step by SecretReferencePatternParityTests, and the literal form is
#     refused by Corpus/Rejected/security-client-key-password-literal.e2e.yaml.
metadata:
  name: security-mtls-client-key-password
environment:
  dependencies:
    events-kafka:
      type: kafka
      security:
        profile: mtls
        endpoint: 9093
        caCert: ./certs/ca.pem
        clientCert: ./certs/client.pem
        clientKey: ./certs/client-key.enc.pem
        clientKeyPassword: "${secret:env/CLIENT_KEY_PASS}"
steps:
  - id: noop
    type: script.csharp
    code: "// Filler step: this fixture exercises the security.clientKeyPassword surface only."
