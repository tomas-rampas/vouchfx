# Surface coverage: security.mode: mtls with clientCert/clientKey but WITHOUT caCert.
# REQ-001's own acceptance names this exact shape as valid: trust may already come from
# an already-declared truststore or the platform default, so caCert stays optional even
# under mtls.
metadata:
  name: security-mtls-without-cacert
environment:
  dependencies:
    events-kafka:
      type: kafka
      security:
        mode: mtls
        endpoint: 9093
        clientCert: ./certs/client.pem
        clientKey: ./certs/client-key.pem
steps:
  - id: noop
    type: script.csharp
    code: "// Filler step."
