# REQ-001 describes for a customer's own mTLS-secured broker declared as a service.
metadata:
  name: security-service-mtls-full
environment:
  services:
    kafka-broker:
      image: myorg/kafka-broker:1.0
      security:
        mode: mtls
        endpoint: 9093
        caCert: ./certs/ca.pem
