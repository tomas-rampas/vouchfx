# Surface coverage: security.mode: tls WITH an explicit caCert declared — the
# complementary shape to security-dependency-tls-no-cacert.e2e.yaml (caCert is legal
# under tls whether present or absent; only its presence differs between the two).
metadata:
  name: security-tls-with-cacert
environment:
  dependencies:
    search:
      type: elasticsearch
      security:
        mode: tls
        endpoint: 9243
        caCert: ./certs/ca.pem
steps:
  - id: noop
    type: script.csharp
    code: "// Filler step."
