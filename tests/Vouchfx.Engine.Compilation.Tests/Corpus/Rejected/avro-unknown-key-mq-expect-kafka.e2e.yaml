# expected-instance-location: /steps/0/avro/extra
# expected-keyword: additionalProperties
#
# Pre-GA schema tightening (T3a2 — nested-block closure): mq-expect.kafka's
# 'avro' block used to declare its own "additionalProperties": true, so an
# unknown key alongside 'schemaRegistry' was silently accepted.
# additionalProperties is now false.
metadata:
  name: rejected-avro-unknown-key-mq-expect-kafka
environment:
  dependencies:
    orders-kafka:
      type: kafka
steps:
  - id: expect-order
    type: mq-expect.kafka
    target: orders-kafka
    topic: orders
    match:
      key: order-1
    avro:
      schemaRegistry: orders-kafka
      extra: oops
