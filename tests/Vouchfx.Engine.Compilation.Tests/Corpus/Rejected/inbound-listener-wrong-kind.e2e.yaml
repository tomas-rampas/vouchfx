# expected-instance-location: /listeners/callbacks/kind
# expected-keyword: enum
listeners:
  callbacks:
    kind: kafka
    security:
      profile: mtls
      serverCert: certs/server.pem
      serverKey: certs/key.pem
      clientCaCert: certs/ca.pem
steps:
  - id: callback
    type: webhook-listen.http
    listener: callbacks
    match: { path: /event }
