# expected-instance-location: /steps/0/match/extra
# expected-keyword: additionalProperties
#
# Pre-GA schema tightening (T3a2 — nested-block closure): mq-expect.kafka's
# 'match' block used to declare its own "additionalProperties": true, so an
# unknown key alongside a real criterion (here, 'key') was silently accepted.
# additionalProperties is now false — a REPLACEMENT, not merely a removal —
# so the block actually closes.
metadata:
  name: rejected-match-unknown-key-mq-expect-kafka
environment:
  dependencies:
    orders-kafka:
      type: kafka
steps:
  - id: expect-order
    type: mq-expect.kafka
    target: orders-kafka
    topic: orders
    match:
      key: order-1
      extra: oops
