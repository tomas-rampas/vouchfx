# expected-instance-location: /steps/0/match/extra
# expected-keyword: additionalProperties
#
# Pre-GA schema tightening (T3a2 — nested-block closure): mq-expect.redis's
# 'match' block used to declare its own "additionalProperties": true, so an
# unknown key alongside a real criterion (here, 'payloadContains') was
# silently accepted. additionalProperties is now false.
metadata:
  name: rejected-match-unknown-key-mq-expect-redis
environment:
  dependencies:
    orders-redis:
      type: redis
steps:
  - id: expect-order
    type: mq-expect.redis
    target: orders-redis
    stream: orders
    match:
      payloadContains: id
      extra: oops
