# expected-instance-location: /environment/dependencies/events-kafka/security/clientKeyPassword
# expected-keyword: pattern
#
# Spec client-key-password, REQ-001/REQ-002: 'clientKeyPassword' takes a whole
# '${secret:<source>/<path>}' reference and NEVER a literal. §17 is a hard invariant —
# "References only: ${secret:source/path}, never literals" — and this field would
# otherwise be the sole place in the language where a secret literal validates.
#
# Refused HERE, at authoring time, rather than at run time: a literal that reached the
# engine would be a plaintext passphrase sitting in a checked-in document beside the
# encrypted key it unlocks, which reproduces exactly the at-rest exposure the field
# exists to remove. Costs the author nothing to avoid — '${secret:env/KEY_PASS}' is one
# line.
#
# The 'pattern' this fails is the anchored form of SecretReference's own grammar,
# character class for character class; SecretReferencePatternParityTests keeps the two
# spellings in step, so a value refused here is exactly one the engine's own parser
# would refuse.
metadata:
  name: rejected-security-client-key-password-literal
environment:
  dependencies:
    events-kafka:
      type: kafka
      security:
        profile: mtls
        endpoint: 9093
        clientCert: ./certs/client.pem
        clientKey: ./certs/client-key.enc.pem
        clientKeyPassword: "hunter2"
steps:
  - id: noop
    type: script.csharp
    code: "// Filler step."
