# expected-instance-location: /environment/services/app/security/clientKeyPassword
# expected-keyword: properties
#
# Spec client-key-password, REQ-001/REQ-002: 'clientKeyPassword' is legal only for
# profile 'mtls' and is FORBIDDEN under profile 'tls', by the same per-field 'false'
# subschema idiom the 'tls' branch of $defs/security's own allOf already uses for
# 'clientCert'/'clientKey' (see security-clientcert-under-tls.e2e.yaml, the sibling
# fixture this one mirrors).
#
# The reason is the same one that forbids its two companions there: plain 'tls' presents
# no client identity, so there is no client key for a passphrase to unlock, and a field
# that does nothing must not silently validate. Accepting it would leave an author
# believing a passphrase was in play while nothing read it.
metadata:
  name: rejected-security-client-key-password-under-tls
environment:
  services:
    app:
      image: myorg/app:1.0
      security:
        profile: tls
        endpoint: 8443
        clientKeyPassword: "${secret:env/CLIENT_KEY_PASS}"
steps:
  - id: noop
    type: script.csharp
    code: "// Filler step."
