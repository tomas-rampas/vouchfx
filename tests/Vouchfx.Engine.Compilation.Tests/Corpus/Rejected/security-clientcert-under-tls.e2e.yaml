# expected-instance-location: /environment/services/app/security/clientCert
# expected-keyword: properties
#
# REQ-001: 'clientCert'/'clientKey' are not applicable to mode 'tls' — mutual TLS's
# whole point is presenting a client identity, which plain 'tls' never does. A field
# that does nothing must not silently validate (the series' philosophy — mirrors
# db-assert.dynamodb's/storage-assert.s3's own 'expect.exists: false' forbidden-
# property clauses), so declaring 'clientCert' under mode 'tls' is rejected here.
metadata:
  name: rejected-security-clientcert-under-tls
environment:
  services:
    app:
      image: myorg/app:1.0
      security:
        profile: tls
        endpoint: 8443
        clientCert: ./certs/client.pem
steps:
  - id: noop
    type: script.csharp
    code: "// Filler step."
