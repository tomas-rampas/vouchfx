# expected-instance-location: /environment/dependencies/cache/security
# expected-keyword: required
#
# REQ-002 (mandatory explicit endpoint selector): 'endpoint' is required whenever a
# 'security' block is present, for both modes — an implicit "first endpoint" default
# would silently resolve to an unauthenticated listener kept open beside the secured
# one. A security block declaring 'mode' but omitting 'endpoint' is rejected here.
metadata:
  name: rejected-security-missing-endpoint
environment:
  dependencies:
    cache:
      type: redis
      security:
        mode: tls
