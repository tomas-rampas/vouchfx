# expected-instance-location: /environment/dependencies/events-kafka/security/bogus
# expected-keyword: unevaluatedProperties
#
# REQ-020: $defs/security now carries 'unevaluatedProperties: false' (replacing
# 'additionalProperties: false' — never alongside it, see SchemaStepSurfaceClosureTests
# for the sibling-keyword trap this avoids). An unrecognised key inside a 'security'
# block is still rejected here with a correctly-located error naming the owning
# dependency, exactly as it was under the old keyword — SchemaErrorCollector's
# unevaluatedProperties branch resolves the environment container the same way its
# additionalProperties branch already did.
#
# Uses 'type: kafka' (not redis) deliberately (REQ-021, as tightened by M1): on any
# other dependency kind the whole 'security' block is now rejected, and
# SchemaErrorCollector.SuppressErrorsInsideForbiddenContainer would correctly subsume
# this fixture's own nested finding into that one — leaving nothing at the pinned
# location. Kafka accepts the block, so this fixture keeps pinning REQ-020's closure and
# nothing else.
metadata:
  name: rejected-security-unknown-key
environment:
  dependencies:
    events-kafka:
      type: kafka
      security:
        profile: tls
        endpoint: 9093
        bogus: true
steps:
  - id: noop
    type: script.csharp
    code: "// Filler step."
