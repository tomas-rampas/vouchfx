# expected-instance-location: /environment/seed/events/publish
# expected-keyword: additionalProperties
#
# Pre-GA removal: the 'publish' seed kind (broker warm-up) never performed an
# actual broker publish — SeedApplier only read and content-hashed the
# referenced fixture and recorded the intent through IBrokerWarmupSink,
# without publishing. Nothing in the repo used it. Removed from the v1
# language before general availability (see SeedSpec.cs's header remarks and
# CHANGELOG.md): a suite still writing 'publish:' now fails schema validation
# — loudly — instead of silently no-opping the way the removed
# wired-but-deferred seam used to.
metadata:
  name: rejected-seed-publish-key-removed
environment:
  dependencies:
    events:
      type: kafka
  seed:
    events:
      publish:
        - topic: catalog.snapshot
          payload: { from: "fixtures/catalog.json" }
steps:
  - id: noop
    type: script.csharp
    code: "// Filler step."
