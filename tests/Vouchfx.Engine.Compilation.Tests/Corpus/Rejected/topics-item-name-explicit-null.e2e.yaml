# expected-instance-location: /environment/dependencies/asb/topics/0/name
# expected-keyword: type
#
# Alignment fix (feat/close-remaining-surfaces): an explicit null 'name'
# ('name: ~') previously validated — the type union included 'null' — yet
# ParseAsbTopics (EnvironmentMapper) silently drops such a topic entry
# exactly as it does an absent 'name' (see topics-item-missing-name.e2e.yaml,
# the sibling fixture for the absent case). Narrowing the type union to
# exclude 'null' closes this residual gap: both shapes ParseAsbTopics drops
# are now rejected at schema time instead of surfacing later as an
# unrelated-looking Service Bus environment error.
metadata:
  name: rejected-topics-item-name-explicit-null
environment:
  dependencies:
    asb:
      type: azureservicebus
      topics:
        - name: ~
steps:
  - id: noop
    type: script.csharp
    code: "// Filler step."
