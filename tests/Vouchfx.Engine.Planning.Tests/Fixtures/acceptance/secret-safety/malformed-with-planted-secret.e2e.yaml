metadata:
  name: malformed-with-planted-secret

# EDGE-006 / MINOR fix-round: this step's `type` is deliberately garbage (never a real
# registered step type) so AstBuilder.ResolveKind's "unknown step type '{raw}'" error
# message echoes the ENTIRE value below verbatim (see AstBuilder.cs) — the raw content of
# this suite file is the one real channel through which suite-authored text reaches
# SuiteSetLoader.ParseFile's captured PlanUnanalysableSuite.Error (unlike an environment
# variable or an observation payload, neither of which the Planner ever reads at all). The
# 800-character 'x' padding pushes the fake secret token past SuiteSetLoader.
# MaxParseErrorMessageChars (500), so PlanSafetyTests can prove the bound actually truncates
# it away rather than merely asserting a channel the Planner never exercised in the first
# place.
steps:
  - id: leaky-step
    type: -vfx-test-9f2b6d41-e006-4c2a-8c58-4b6a9a3d0e21
